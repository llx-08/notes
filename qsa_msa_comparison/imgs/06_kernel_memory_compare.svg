<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
  <title id="title">QSA 与 MSA kernel 内存路径比较</title><desc id="desc">分层展示 HBM、shared memory、register Tensor Core 与输出，比较 QSA 静态连续 Query 复用和 MSA 动态 KV block outer 的代价。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#475569"/></marker><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".13"/></filter><style>.t{font:700 34px sans-serif;fill:#0f172a}.h{font:700 24px sans-serif;fill:#0f172a}.l{font:600 17px sans-serif;fill:#1e293b}.sm{font:500 15px sans-serif;fill:#475569}.m{font:600 14px ui-monospace,monospace;fill:#1e293b}.w{font:600 14px ui-monospace,monospace;fill:#fff}.arr{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1800" height="1050" fill="#f8fafc"/><text x="900" y="54" text-anchor="middle" class="t">两种 kernel 都在扩大 Q tile，但为此支付的元数据与输出代价不同</text>
  <g transform="translate(70,110)"><rect width="790" height="860" rx="24" fill="#fff" stroke="#3b82f6" stroke-width="3" filter="url(#s)"/><text x="395" y="45" text-anchor="middle" class="h">QSA Q-block：静态、单阶段</text>
    <g transform="translate(55,85)"><rect width="680" height="150" rx="16" fill="#e2e8f0"/><text x="30" y="32" class="l">HBM</text><rect x="30" y="55" width="185" height="62" rx="9" fill="#dbeafe"/><text x="122" y="81" text-anchor="middle" class="m">Q[Bq×G,D]</text><text x="122" y="103" text-anchor="middle" class="sm">连续读取</text><rect x="245" y="55" width="185" height="62" rx="9" fill="#fef3c7"/><text x="337" y="81" text-anchor="middle" class="m">indices[1,S]</text><text x="337" y="103" text-anchor="middle" class="sm">只读第一行</text><rect x="460" y="55" width="190" height="62" rx="9" fill="#bfdbfe"/><text x="555" y="81" text-anchor="middle" class="m">gather K/V[S,D]</text><text x="555" y="103" text-anchor="middle" class="sm">随机 token gather</text></g>
    <path d="M395 238V285" class="arr"/><g transform="translate(55,285)"><rect width="680" height="135" rx="16" fill="#dbeafe" stroke="#60a5fa"/><text x="30" y="32" class="l">Registers / cache</text><text x="340" y="67" text-anchor="middle" class="m">同一 K/V tile 被 Bq×G 行 Q 直接复用</text><text x="340" y="98" text-anchor="middle" class="sm">没有 Q2K→K2Q 转换，没有 partial output buffer</text></g>
    <path d="M395 423V470" class="arr"/><g transform="translate(55,470)"><rect width="680" height="145" rx="16" fill="#2563eb"/><text x="30" y="34" style="font:600 17px sans-serif;fill:white">Tensor Core + online softmax</text><text x="340" y="72" text-anchor="middle" class="w">QK [Bq×G,D] × [D,BN]</text><text x="340" y="102" text-anchor="middle" class="w">softmax + PV 在同一个 program 内完成</text><text x="340" y="129" text-anchor="middle" style="font:500 14px sans-serif;fill:#dbeafe">FP8 路径可同时降低 K/V IO、使用 FP8 MMA</text></g>
    <path d="M395 618V665" class="arr"/><g transform="translate(55,665)"><rect width="680" height="120" rx="16" fill="#dcfce7" stroke="#22c55e"/><text x="30" y="33" class="l">一次写回最终结果</text><text x="340" y="70" text-anchor="middle" class="m">O[Bq×G,D]</text><text x="340" y="98" text-anchor="middle" class="sm">无 combine kernel；代价是 block 内 Query 共用路由</text></g>
  </g>
  <g transform="translate(940,110)"><rect width="790" height="860" rx="24" fill="#fff" stroke="#8b5cf6" stroke-width="3" filter="url(#s)"/><text x="395" y="45" text-anchor="middle" class="h">MiniMax MSA：动态、两阶段</text>
    <g transform="translate(55,85)"><rect width="680" height="150" rx="16" fill="#e2e8f0"/><text x="30" y="32" class="l">HBM + metadata</text><rect x="25" y="55" width="190" height="62" rx="9" fill="#ede9fe"/><text x="120" y="81" text-anchor="middle" class="m">K2Q CSR row</text><text x="120" y="103" text-anchor="middle" class="sm">任意 Q positions</text><rect x="245" y="55" width="190" height="62" rx="9" fill="#ddd6fe"/><text x="340" y="81" text-anchor="middle" class="m">Q gather list</text><text x="340" y="103" text-anchor="middle" class="sm">按 schedule chunk</text><rect x="465" y="55" width="190" height="62" rx="9" fill="#c4b5fd"/><text x="560" y="81" text-anchor="middle" class="m">K/V block[128,D]</text><text x="560" y="103" text-anchor="middle" class="sm">连续 TMA 读取</text></g>
    <path d="M395 238V285" class="arr"/><g transform="translate(55,285)"><rect width="680" height="135" rx="16" fill="#ede9fe" stroke="#a78bfa"/><text x="30" y="32" class="l">Shared memory</text><text x="340" y="67" text-anchor="middle" class="m">固定 K/V block + 拼接 ceil(128/G) 个任意 Q</text><text x="340" y="98" text-anchor="middle" class="sm">连续 KV block 读取更友好；Query gather 与 schedule 更复杂</text></g>
    <path d="M395 423V470" class="arr"/><g transform="translate(55,470)"><rect width="680" height="145" rx="16" fill="#7c3aed"/><text x="30" y="34" style="font:600 17px sans-serif;fill:white">Tensor Core：KV block partial</text><text x="340" y="72" text-anchor="middle" class="w">QK ≈ [128,D] × [D,128]</text><text x="340" y="102" text-anchor="middle" class="w">输出 Opartial + LSEpartial 到预分配 slot</text><text x="340" y="129" text-anchor="middle" style="font:500 14px sans-serif;fill:#ede9fe">一个 Query 的 16 blocks 由不同 CTA 计算</text></g>
    <path d="M395 618V665" class="arr"/><g transform="translate(55,665)"><rect width="680" height="120" rx="16" fill="#f3e8ff" stroke="#8b5cf6"/><text x="30" y="33" class="l">HBM partial buffer + Combine kernel</text><text x="340" y="70" text-anchor="middle" class="m">read O/LSE partials → log-sum-exp merge → final O</text><text x="340" y="98" text-anchor="middle" class="sm">保留 Query 独立路由，但多一次 partial 写回/读取和归并</text></g>
  </g>
</svg>
