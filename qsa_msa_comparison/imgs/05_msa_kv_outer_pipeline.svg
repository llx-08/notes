<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1300" viewBox="0 0 1900 1300" role="img" aria-labelledby="title desc">
  <title id="title">MiniMax MSA KV-outer 完整流程</title><desc id="desc">从每 Query 每 GQA group 的 index score、KV block max、TopK，到 K2Q CSR、调度、KV outer partial attention 与 LSE combine。</desc>
  <defs><marker id="a" markerWidth="11" markerHeight="11" refX="10" refY="3" orient="auto"><path d="M0 0L0 6L10 3Z" fill="#475569"/></marker><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity=".14"/></filter><style>.t{font:700 34px sans-serif;fill:#0f172a}.h{font:700 22px sans-serif;fill:#0f172a}.l{font:600 17px sans-serif;fill:#1e293b}.sm{font:500 15px sans-serif;fill:#475569}.m{font:600 14px ui-monospace,monospace;fill:#1e293b}.w{font:600 14px ui-monospace,monospace;fill:#fff}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:16;filter:url(#s)}.arr{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1900" height="1300" fill="#f8fafc"/><text x="950" y="55" text-anchor="middle" class="t">MiniMax MSA：独立选路 → K2Q 反转 → KV-outer → partial combine</text>
  <g transform="translate(55,95)"><rect width="1790" height="360" rx="24" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2"/><text x="35" y="43" class="h">阶段 A：Index Branch（每个 Query、每个 GQA group 独立）</text>
    <g transform="translate(35,75)"><rect width="285" height="225" class="box"/><text x="142" y="34" text-anchor="middle" class="l">轻量 Index Q/K</text><text x="30" y="78" class="m">Qidx [N,Hkv,didx]</text><text x="30" y="112" class="m">Kidx [N,1,didx]</text><text x="30" y="153" class="sm">每个 GQA group 一个 Qidx head</text><text x="30" y="184" class="sm">所有 group 共用一个 Kidx head</text></g><path d="M335 188H405" class="arr"/>
    <g transform="translate(405,75)"><rect width="330" height="225" class="box"/><text x="165" y="34" text-anchor="middle" class="l">token score → K-block max</text><rect x="30" y="62" width="270" height="52" rx="8" fill="#ede9fe"/><text x="165" y="94" text-anchor="middle" class="m">score[q,r,k_token]</text><path d="M165 118V148" class="arr"/><rect x="30" y="150" width="270" height="52" rx="8" fill="#c4b5fd"/><text x="165" y="182" text-anchor="middle" class="m">max within each Bk block</text></g><path d="M750 188H820" class="arr"/>
    <g transform="translate(820,75)"><rect width="330" height="225" class="box"/><text x="165" y="34" text-anchor="middle" class="l">Exp-free Top-K blocks</text><text x="28" y="78" class="sm">直接按 raw score 排序：</text><text x="28" y="109" class="m">q0/r0 → K0,K2</text><text x="28" y="140" class="m">q1/r0 → K0,K3</text><text x="28" y="171" class="m">q2/r0 → K1,K2</text><text x="28" y="202" class="sm">强制保留当前 local block</text></g><path d="M1165 188H1235" class="arr"/>
    <g transform="translate(1235,75)"><rect width="510" height="225" class="box"/><text x="255" y="34" text-anchor="middle" class="l">Q2K metadata</text><rect x="35" y="60" width="440" height="66" rx="9" fill="#8b5cf6"/><text x="255" y="87" text-anchor="middle" class="w">q2k_indices [Hkv, total_q, Kblk]</text><text x="255" y="111" text-anchor="middle" class="w">值是 batch-local KV block id</text><text x="35" y="165" class="m">论文：Bk=128, Kblk=16</text><text x="35" y="195" class="sm">Main Attention budget ≤ 2048 tokens / Query</text></g>
  </g>
  <path d="M950 458V510" class="arr"/>
  <g transform="translate(55,515)"><rect width="1790" height="300" rx="24" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="35" y="43" class="h">阶段 B：反向 CSR 与负载均衡 schedule</text>
    <g transform="translate(40,75)"><rect width="390" height="170" class="box"/><text x="195" y="34" text-anchor="middle" class="l">Q2K → K2Q CSR</text><text x="28" y="76" class="m">k2q_row_ptr [Hkv, rows+1]</text><text x="28" y="109" class="m">k2q_q_indices [Hkv, Q×Kblk]</text><text x="28" y="143" class="sm">每个 CSR row = 选择该 KV block 的 Q 列表</text></g><path d="M445 160H525" class="arr"/>
    <g transform="translate(525,75)"><rect width="410" height="170" class="box"/><text x="205" y="34" text-anchor="middle" class="l">识别热门 KV block</text><text x="30" y="77" class="sm">sink/local block 可能被几乎所有 Q 选择</text><text x="30" y="109" class="m">if q_count is large:</text><text x="50" y="139" class="m">split Q list into chunks</text></g><path d="M950 160H1030" class="arr"/>
    <g transform="translate(1030,75)"><rect width="420" height="170" class="box"/><text x="210" y="34" text-anchor="middle" class="l">预分配 partial slot</text><text x="28" y="76" class="m">slot s ∈ [0,Kblk)</text><text x="28" y="109" class="m">handle = pack(query_id, slot)</text><text x="28" y="143" class="sm">不同 CTA 写不同 slot，不需要 atomic</text></g><path d="M1465 160H1535" class="arr"/>
    <g transform="translate(1535,75)"><rect width="210" height="170" class="box"/><text x="105" y="34" text-anchor="middle" class="l">schedule</text><text x="22" y="72" class="m">work_count</text><text x="22" y="101" class="m">qsplit_indices</text><text x="22" y="130" class="m">split_counts</text><text x="105" y="157" text-anchor="middle" class="sm">persistent grid</text></g>
  </g>
  <path d="M950 818V870" class="arr"/>
  <g transform="translate(55,875)"><rect width="1790" height="360" rx="24" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="35" y="43" class="h">阶段 C：KV-outer Sparse Attention + 两阶段 softmax 合并</text>
    <g transform="translate(40,75)"><rect width="340" height="225" class="box"/><text x="170" y="34" text-anchor="middle" class="l">Persistent CTA 领取工作</text><text x="28" y="75" class="m">tile = (KV block, KV head)</text><text x="28" y="108" class="m">Q list = CSR row chunk</text><text x="28" y="148" class="sm">例如 K0 → q0,q1,q3,...</text><text x="28" y="181" class="sm">热门 block 的列表被多个 CTA 分担</text></g><path d="M395 187H465" class="arr"/>
    <g transform="translate(465,75)"><rect width="390" height="225" class="box"/><text x="195" y="34" text-anchor="middle" class="l">加载一次 K/V block</text><rect x="35" y="62" width="320" height="58" rx="9" fill="#8b5cf6"/><text x="195" y="87" text-anchor="middle" class="w">K/V [Bk=128, D]</text><text x="195" y="109" text-anchor="middle" class="w">TMA → shared memory</text><text x="35" y="158" class="m">gather ceil(128/G) Q positions</text><text x="35" y="190" class="m">Q MMA rows ≈ 128</text></g><path d="M870 187H940" class="arr"/>
    <g transform="translate(940,75)"><rect width="370" height="225" class="box"/><text x="185" y="34" text-anchor="middle" class="l">产生 block partial</text><rect x="35" y="62" width="300" height="55" rx="9" fill="#6d28d9"/><text x="185" y="95" text-anchor="middle" class="w">QK → local softmax → PV</text><text x="35" y="151" class="m">Obuf[slot, q, h, d]</text><text x="35" y="184" class="m">LSEbuf[slot, q, h]</text><text x="185" y="212" text-anchor="middle" class="sm">每个 Query 有 Kblk 个 partial</text></g><path d="M1325 187H1395" class="arr"/>
    <g transform="translate(1395,75)"><rect width="350" height="225" class="box"/><text x="175" y="34" text-anchor="middle" class="l">Combine kernel</text><text x="30" y="74" class="m">a = max_s LSE_s</text><text x="30" y="106" class="m">w_s = exp(LSE_s - LSE)</text><text x="30" y="138" class="m">O = Σ_s w_s × Opartial_s</text><rect x="30" y="163" width="290" height="42" rx="8" fill="#dcfce7"/><text x="175" y="189" text-anchor="middle" class="m">final O[total_q,Hq,D]</text></g>
  </g>
</svg>
