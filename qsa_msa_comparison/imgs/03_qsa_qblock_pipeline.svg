<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1250" viewBox="0 0 1900 1250" role="img" aria-labelledby="title desc">
  <title id="title">QSA Q-block 完整计算流程</title><desc id="desc">从 FP8 indexer 输入到 fused Q pooling、Top-K 复制，再到 Triton Q-block sparse attention 和 causal mask 的完整流程。</desc>
  <defs><marker id="a" markerWidth="11" markerHeight="11" refX="10" refY="3" orient="auto"><path d="M0 0L0 6L10 3Z" fill="#475569"/></marker><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity=".14"/></filter><style>.t{font:700 34px sans-serif;fill:#0f172a}.h{font:700 22px sans-serif;fill:#0f172a}.l{font:600 17px sans-serif;fill:#1e293b}.sm{font:500 15px sans-serif;fill:#475569}.m{font:600 14px ui-monospace,monospace;fill:#1e293b}.w{font:600 14px ui-monospace,monospace;fill:#fff}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:16;filter:url(#s)}.arr{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1900" height="1250" fill="#f8fafc"/><text x="950" y="55" text-anchor="middle" class="t">QSA Q-block：把“共享路由”直接变成一个更宽的 Query tile</text>
  <g transform="translate(55,100)"><rect width="1790" height="500" rx="24" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="40" y="45" class="h">阶段 A：Indexer（PAI-DeepGEMM + Top-K）</text>
    <g transform="translate(45,85)"><rect width="290" height="300" class="box"/><text x="145" y="35" text-anchor="middle" class="l">输入</text><rect x="30" y="60" width="230" height="48" rx="8" fill="#dbeafe"/><text x="145" y="90" text-anchor="middle" class="m">q_fp8 [M,Hidx,Didx]</text><rect x="30" y="122" width="230" height="48" rx="8" fill="#bfdbfe"/><text x="145" y="152" text-anchor="middle" class="m">k_fp8 [N,Didx]</text><rect x="30" y="184" width="230" height="48" rx="8" fill="#dbeafe"/><text x="145" y="214" text-anchor="middle" class="m">weights [M,Hidx]</text><text x="145" y="267" text-anchor="middle" class="sm">例：M=8, N=16, Bq=4</text></g>
    <path d="M350 235H430" class="arr"/>
    <g transform="translate(430,85)"><rect width="400" height="300" class="box"/><text x="200" y="35" text-anchor="middle" class="l">Fused score + Q max-pooling</text><rect x="35" y="60" width="330" height="80" rx="10" fill="#2563eb"/><text x="200" y="91" text-anchor="middle" class="w">数学上仍计算 score[M,N]</text><text x="200" y="117" text-anchor="middle" class="w">但不物化完整矩阵</text><path d="M200 145V183" class="arr"/><rect x="35" y="185" width="330" height="62" rx="10" fill="#60a5fa"/><text x="200" y="211" text-anchor="middle" class="w">pooled = max over Bq rows</text><text x="200" y="234" text-anchor="middle" class="w">shape [ceil(M/Bq), N]</text><text x="200" y="277" text-anchor="middle" class="sm">复用预分配 mqa_logits_buffer</text></g>
    <path d="M845 235H925" class="arr"/>
    <g transform="translate(925,85)"><rect width="350" height="300" class="box"/><text x="175" y="35" text-anchor="middle" class="l">Q-block Top-S</text><rect x="30" y="65" width="290" height="56" rx="9" fill="#fef3c7"/><text x="175" y="99" text-anchor="middle" class="m">TopK(pooled, S)</text><text x="175" y="151" text-anchor="middle" class="sm">causal 范围取 block 最后一个 Q</text><rect x="30" y="177" width="290" height="70" rx="9" fill="#f59e0b"/><text x="175" y="207" text-anchor="middle" class="w">topk_pooled</text><text x="175" y="232" text-anchor="middle" class="w">[ceil(M/Bq), S]</text><text x="175" y="278" text-anchor="middle" class="m">Q0 → k1,k8,k11</text></g>
    <path d="M1290 235H1370" class="arr"/>
    <g transform="translate(1370,85)"><rect width="365" height="300" class="box"/><text x="182" y="35" text-anchor="middle" class="l">复制回 token-level buffer</text><text x="182" y="69" text-anchor="middle" class="m">repeat_interleave(Bq)</text><g transform="translate(43,92)"><rect width="278" height="35" rx="7" fill="#dbeafe"/><rect y="42" width="278" height="35" rx="7" fill="#dbeafe"/><rect y="84" width="278" height="35" rx="7" fill="#dbeafe"/><rect y="126" width="278" height="35" rx="7" fill="#dbeafe"/><text x="139" y="23" text-anchor="middle" class="m">q0: k1,k8,k11</text><text x="139" y="65" text-anchor="middle" class="m">q1: k1,k8,k11</text><text x="139" y="107" text-anchor="middle" class="m">q2: k1,k8,k11</text><text x="139" y="149" text-anchor="middle" class="m">q3: k1,k8,k11</text></g><text x="182" y="282" text-anchor="middle" class="m">indices [M,S]</text></g>
  </g>

  <path d="M950 605V665" class="arr"/>
  <g transform="translate(55,670)"><rect width="1790" height="510" rx="24" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="40" y="45" class="h">阶段 B：Main Sparse Attention（Triton Q-block kernel）</text>
    <g transform="translate(45,90)"><rect width="300" height="330" class="box"/><text x="150" y="35" text-anchor="middle" class="l">Program 定位</text><text x="30" y="78" class="m">pid0 = Q-block id</text><text x="30" y="108" class="m">pid1 = batch × KV head</text><rect x="30" y="135" width="240" height="80" rx="10" fill="#c7d2fe"/><text x="150" y="166" text-anchor="middle" class="m">q_start = pid0 × Bq</text><text x="150" y="192" text-anchor="middle" class="m">idx = indices[q_start]</text><text x="150" y="251" text-anchor="middle" class="sm">只读取 Q-block 第一行 indices</text><text x="150" y="288" text-anchor="middle" class="m">grid.x = ceil(maxQ/Bq)</text></g>
    <path d="M360 255H440" class="arr"/>
    <g transform="translate(440,90)"><rect width="360" height="330" class="box"/><text x="180" y="35" text-anchor="middle" class="l">构造更宽的 Q tile</text><rect x="35" y="65" width="290" height="70" rx="10" fill="#818cf8"/><text x="180" y="95" text-anchor="middle" class="w">Q [Bq × G, D]</text><text x="180" y="120" text-anchor="middle" class="w">连续 Q positions × GQA heads</text><rect x="35" y="158" width="290" height="70" rx="10" fill="#a5b4fc"/><text x="180" y="188" text-anchor="middle" class="m">BLOCK_SIZE_M</text><text x="180" y="213" text-anchor="middle" class="m">= next_pow2(Bq×G), min 16</text><text x="180" y="271" text-anchor="middle" class="sm">例：Bq=4, G=8 → M tile=32</text></g>
    <path d="M815 255H895" class="arr"/>
    <g transform="translate(895,90)"><rect width="420" height="330" class="box"/><text x="210" y="35" text-anchor="middle" class="l">循环 Top-K tiles</text><g transform="translate(35,65)"><rect width="350" height="46" rx="8" fill="#fde68a"/><text x="175" y="29" text-anchor="middle" class="m">load indices tile [BN]</text><path d="M175 48V78" class="arr"/><rect y="80" width="350" height="55" rx="8" fill="#fbbf24"/><text x="175" y="104" text-anchor="middle" class="w">gather K [D,BN]</text><text x="175" y="125" text-anchor="middle" class="w">gather V [BN,D]　仅一次</text><path d="M175 138V168" class="arr"/><rect y="170" width="350" height="65" rx="8" fill="#4f46e5"/><text x="175" y="197" text-anchor="middle" class="w">QK → per-Q causal mask</text><text x="175" y="220" text-anchor="middle" class="w">online softmax → PV</text></g><text x="210" y="305" text-anchor="middle" class="sm">同一 K/V tile 服务 Bq×G 行</text></g>
    <path d="M1330 255H1410" class="arr"/>
    <g transform="translate(1410,90)"><rect width="325" height="330" class="box"/><text x="162" y="35" text-anchor="middle" class="l">输出与精度路径</text><rect x="30" y="66" width="265" height="62" rx="9" fill="#dcfce7"/><text x="162" y="91" text-anchor="middle" class="m">O [Bq,G,D]</text><text x="162" y="113" text-anchor="middle" class="sm">写回各自 Query/head</text><text x="30" y="164" class="sm">BF16 路径：</text><text x="45" y="190" class="m">BF16 Q/K/V + FP32 acc</text><text x="30" y="227" class="sm">FP8 路径：</text><text x="45" y="253" class="m">E4M3 QK/PV + FP32 acc</text><text x="45" y="279" class="m">Max-offset 减少 P 下溢</text><text x="162" y="311" text-anchor="middle" class="sm">Main FLOPs 仍约 M×S</text></g>
  </g>
</svg>
