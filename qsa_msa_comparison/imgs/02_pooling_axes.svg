<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">QSA 与 MSA 的 pooling 轴对比</title><desc id="desc">用八行 Query、十六列 KV score 矩阵展示 QSA 沿 Query 行 pooling，MSA 沿 KV block 列 pooling。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#475569"/></marker><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-opacity=".14"/></filter><style>.t{font:700 34px sans-serif;fill:#0f172a}.h{font:700 24px sans-serif;fill:#0f172a}.l{font:600 17px sans-serif;fill:#1e293b}.sm{font:500 15px sans-serif;fill:#475569}.m{font:600 14px ui-monospace,monospace;fill:#0f172a}.arr{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1800" height="1080" fill="#f8fafc"/><text x="900" y="54" text-anchor="middle" class="t">同一张 score[Query, KV token] 矩阵，两种 pooling 沿不同方向</text><text x="900" y="88" text-anchor="middle" class="sm">蓝色：QSA 合并 Query 行　紫色：MSA 合并 KV token 列</text>
  <g transform="translate(70,140)"><rect width="760" height="850" rx="24" fill="#fff" stroke="#3b82f6" stroke-width="3" filter="url(#s)"/><text x="380" y="45" text-anchor="middle" class="h">QSA Q-block：沿 Query 维 max</text><text x="380" y="75" text-anchor="middle" class="sm">Bq=4：四行合成一行，KV 仍保持 token 粒度</text>
    <g transform="translate(78,125)"><text x="270" y="-18" text-anchor="middle" class="l">16 个 KV token 列</text>
      <g fill="#dbeafe" stroke="#93c5fd"><rect x="0" y="0" width="540" height="50"/><rect x="0" y="52" width="540" height="50"/><rect x="0" y="104" width="540" height="50"/><rect x="0" y="156" width="540" height="50"/></g><g fill="#eff6ff" stroke="#bfdbfe"><rect x="0" y="232" width="540" height="50"/><rect x="0" y="284" width="540" height="50"/><rect x="0" y="336" width="540" height="50"/><rect x="0" y="388" width="540" height="50"/></g>
      <g class="m"><text x="-42" y="31">q0</text><text x="-42" y="83">q1</text><text x="-42" y="135">q2</text><text x="-42" y="187">q3</text><text x="-42" y="263">q4</text><text x="-42" y="315">q5</text><text x="-42" y="367">q6</text><text x="-42" y="419">q7</text></g>
      <g stroke="#fff" stroke-width="1"><path d="M0 0V206M0 232V438"/><path d="M33.75 0V206M33.75 232V438"/><path d="M67.5 0V206M67.5 232V438"/><path d="M101.25 0V206M101.25 232V438"/><path d="M135 0V206M135 232V438"/><path d="M168.75 0V206M168.75 232V438"/><path d="M202.5 0V206M202.5 232V438"/><path d="M236.25 0V206M236.25 232V438"/><path d="M270 0V206M270 232V438"/><path d="M303.75 0V206M303.75 232V438"/><path d="M337.5 0V206M337.5 232V438"/><path d="M371.25 0V206M371.25 232V438"/><path d="M405 0V206M405 232V438"/><path d="M438.75 0V206M438.75 232V438"/><path d="M472.5 0V206M472.5 232V438"/><path d="M506.25 0V206M506.25 232V438"/><path d="M540 0V206M540 232V438"/></g>
      <path d="M570 102H625" class="arr"/><path d="M570 335H625" class="arr"/><text x="600" y="75" text-anchor="middle" class="sm" transform="rotate(90 600 75)">max 4 rows</text>
      <rect x="650" y="55" width="54" height="100" rx="8" fill="#2563eb"/><rect x="650" y="288" width="54" height="100" rx="8" fill="#60a5fa"/><text x="677" y="109" text-anchor="middle" style="font:700 15px sans-serif;fill:white">Q0</text><text x="677" y="342" text-anchor="middle" style="font:700 15px sans-serif;fill:white">Q1</text>
      <path d="M677 160V505H520" class="arr"/><path d="M677 393V555H520" class="arr"/>
      <rect x="40" y="485" width="480" height="50" rx="8" fill="#2563eb"/><rect x="40" y="545" width="480" height="50" rx="8" fill="#60a5fa"/><text x="280" y="516" text-anchor="middle" style="font:600 15px monospace;fill:white">pooled[Q0, k0..k15] → Top-S token ids</text><text x="280" y="576" text-anchor="middle" style="font:600 15px monospace;fill:white">pooled[Q1, k0..k15] → Top-S token ids</text>
      <rect x="40" y="630" width="625" height="105" rx="14" fill="#eff6ff" stroke="#3b82f6"/><text x="352" y="663" text-anchor="middle" class="l">输出形状：[M/Bq, N] = [2,16]</text><text x="352" y="695" text-anchor="middle" class="sm">随后把每行 Top-S 复制 Bq 次，给连续 Query 共用</text><text x="352" y="721" text-anchor="middle" class="sm">省 logits 写回和 Top-K 行数，但改变 Query 路由语义</text>
    </g>
  </g>
  <g transform="translate(970,140)"><rect width="760" height="850" rx="24" fill="#fff" stroke="#8b5cf6" stroke-width="3" filter="url(#s)"/><text x="380" y="45" text-anchor="middle" class="h">MiniMax MSA：沿 KV block 维 max</text><text x="380" y="75" text-anchor="middle" class="sm">Bk=4：每四列合成一列，每个 Query 行仍独立</text>
    <g transform="translate(75,125)"><text x="270" y="-18" text-anchor="middle" class="l">16 个 KV token，划分为 4 个 blocks</text>
      <g stroke="#fff" stroke-width="2"><rect width="135" height="438" fill="#ede9fe"/><rect x="135" width="135" height="438" fill="#ddd6fe"/><rect x="270" width="135" height="438" fill="#ede9fe"/><rect x="405" width="135" height="438" fill="#ddd6fe"/></g>
      <g stroke="#fff"><path d="M0 0H540"/><path d="M0 54.75H540"/><path d="M0 109.5H540"/><path d="M0 164.25H540"/><path d="M0 219H540"/><path d="M0 273.75H540"/><path d="M0 328.5H540"/><path d="M0 383.25H540"/><path d="M0 438H540"/><path d="M0 0V438"/><path d="M33.75 0V438"/><path d="M67.5 0V438"/><path d="M101.25 0V438"/><path d="M135 0V438"/><path d="M168.75 0V438"/><path d="M202.5 0V438"/><path d="M236.25 0V438"/><path d="M270 0V438"/><path d="M303.75 0V438"/><path d="M337.5 0V438"/><path d="M371.25 0V438"/><path d="M405 0V438"/><path d="M438.75 0V438"/><path d="M472.5 0V438"/><path d="M506.25 0V438"/><path d="M540 0V438"/></g>
      <g class="m"><text x="-42" y="31">q0</text><text x="-42" y="86">q1</text><text x="-42" y="141">q2</text><text x="-42" y="196">q3</text><text x="-42" y="250">q4</text><text x="-42" y="305">q5</text><text x="-42" y="360">q6</text><text x="-42" y="415">q7</text><text x="67" y="-8">K0</text><text x="202" y="-8">K1</text><text x="337" y="-8">K2</text><text x="472" y="-8">K3</text></g>
      <path d="M550 219H605" class="arr"/><text x="579" y="190" class="sm" transform="rotate(90 579 190)">max 4 cols</text>
      <g transform="translate(625,0)"><rect width="50" height="438" rx="8" fill="#8b5cf6"/><path d="M0 55H50M0 110H50M0 165H50M0 220H50M0 275H50M0 330H50M0 385H50" stroke="#fff"/><text x="25" y="225" text-anchor="middle" transform="rotate(90 25 225)" style="font:600 14px monospace;fill:white">[M,4 block scores]</text></g>
      <path d="M650 445V505H520" class="arr"/><rect x="25" y="485" width="495" height="110" rx="12" fill="#8b5cf6"/><text x="272" y="517" text-anchor="middle" style="font:600 15px monospace;fill:white">每个 q / GQA group 独立 Top-K blocks</text><text x="272" y="550" text-anchor="middle" style="font:500 14px monospace;fill:white">q0→K0,K2　q1→K0,K3　q2→K1,K2 ...</text><text x="272" y="578" text-anchor="middle" style="font:500 14px sans-serif;fill:white">不复制 Query 行；后续通过 K2Q 反向 CSR 聚合</text>
      <rect x="25" y="630" width="640" height="105" rx="14" fill="#faf5ff" stroke="#8b5cf6"/><text x="345" y="663" text-anchor="middle" class="l">输出形状：[M, N/Bk] = [8,4]</text><text x="345" y="695" text-anchor="middle" class="sm">论文采用 Bk=128、Top-K blocks=16，最多注意 2048 tokens</text><text x="345" y="721" text-anchor="middle" class="sm">牺牲 K 选择粒度，但保留每个 Query 的独立路由</text>
    </g>
  </g>
</svg>
