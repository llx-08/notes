<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc" data-series="cuda-cute-nvidia-learning">
  <title id="title">共驻悬崖实测：H20 与 GB200 的对比及失效机制</title>
  <desc id="desc">扫描 consumer 的 shared memory 用量，测得共驻悬崖位置在两代架构上相同，但失效后 H20 优雅降级而 GB200 转为净亏；并用 prolog 字节数扫描验证涓流填入导致带宽打不满的机制。</desc>
