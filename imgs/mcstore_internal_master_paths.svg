<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650">
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.sub{font-size:18px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#526076}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.blue{fill:#e8f1ff;stroke:#5b8def;stroke-width:2}.green{fill:#e9f8ef;stroke:#41a66b;stroke-width:2}.orange{fill:#fff2df;stroke:#e79835;stroke-width:2}.purple{fill:#f1ebff;stroke:#8b68d7;stroke-width:2}.red{fill:#fff0f0;stroke:#dc6b6b;stroke-width:2}.arrow{fill:none;stroke:#526076;stroke-width:2.2;marker-end:url(#a)}.dash{fill:none;stroke:#8a97aa;stroke-width:2;stroke-dasharray:7 6}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526076"/></marker></defs>
  <rect width="1120" height="650" fill="#fff"/><text x="560" y="42" text-anchor="middle" class="title">Master 瓶颈的三种杠杆：减流、过滤、扩容</text>
  <rect x="330" y="75" width="460" height="85" rx="14" class="red"/><text x="560" y="108" text-anchor="middle" class="sub">当前：全部 lookup 汇聚到单一全局 Master</text><text x="560" y="135" text-anchor="middle" class="body">实测约 4.5M keys/s；百实例冷缓存外推约 14M keys/s</text>
  <path d="M560 160L560 205" class="arrow"/>
  <rect x="75" y="215" width="280" height="200" rx="16" class="green"/><text x="215" y="250" text-anchor="middle" class="sub">① LocalMaster</text><text x="215" y="278" text-anchor="middle" class="body">让一部分查询不进入全局控制面</text><rect x="105" y="305" width="220" height="48" rx="9" class="panel"/><text x="215" y="335" text-anchor="middle" class="body">利用 Pod / 节点局部性</text><text x="215" y="382" text-anchor="middle" class="small">边界：跨实例命中多时，</text><text x="215" y="402" text-anchor="middle" class="small">本地可回答比例可能有限</text>
  <rect x="420" y="215" width="280" height="200" rx="16" class="blue"/><text x="560" y="250" text-anchor="middle" class="sub">② kv_events 负向过滤</text><text x="560" y="278" text-anchor="middle" class="body">已知不存在的 key 不再查询</text><rect x="450" y="305" width="220" height="48" rx="9" class="panel"/><text x="560" y="335" text-anchor="middle" class="body">UNKNOWN / TRUSTED / GAP</text><text x="560" y="382" text-anchor="middle" class="small">边界：事件会丢，索引不是权威；</text><text x="560" y="402" text-anchor="middle" class="small">只能保守否定，先 observe-only</text>
  <rect x="765" y="215" width="280" height="200" rx="16" class="purple"/><text x="905" y="250" text-anchor="middle" class="sub">③ Partitioned Master</text><text x="905" y="278" text-anchor="middle" class="body">提高全局控制面的总处理能力</text><rect x="795" y="305" width="220" height="48" rx="9" class="panel"/><text x="905" y="335" text-anchor="middle" class="body">一致性哈希环 + Redis</text><text x="905" y="382" text-anchor="middle" class="small">边界：单个热 key 仍只属于一个</text><text x="905" y="402" text-anchor="middle" class="small">Master；容量均衡 ≠ QPS 均衡</text>
  <path d="M470 160L245 215" class="arrow"/><path d="M560 160L560 215" class="arrow"/><path d="M650 160L875 215" class="arrow"/>
  <rect x="120" y="475" width="880" height="90" rx="16" class="orange"/><text x="560" y="506" text-anchor="middle" class="sub">三者可以串联</text><text x="560" y="536" text-anchor="middle" class="body">请求 → LocalMaster 本地回答 → 可信事件索引截断 miss → 剩余请求进入分区 Master</text>
  <path d="M215 415L340 475M560 415L560 475M905 415L780 475" class="dash"/>
  <text x="560" y="605" text-anchor="middle" class="body">目标不是选一个“万能方案”，而是分别测量每层能削掉多少流量、付出多少一致性与部署成本</text>
  <text x="560" y="630" text-anchor="middle" class="small">M1–M4 合成压测的价值：为第三条路径给出容量、fan-out 和热点上界，而不是替代 rldev 实现</text>
</svg>
