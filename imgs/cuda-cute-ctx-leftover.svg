<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc" data-series="cuda-cute-nvidia-learning">
  <title id="title">leftover policy：并发受剩余 SM 资源限制</title>
  <desc id="desc">实测两个 kernel 在不同 stream 上的并发度随各自占用 SM 比例的变化，并图示 50%/75%/100% 三种情形下 SM 的实际分配。</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8fb8d6"/></marker></defs>
  <rect x="0" y="0" width="1200" height="620" rx="26" fill="#071522"/>
  <text x="600.0" y="46" fill="white" font-family="sans-serif" font-size="27" text-anchor="middle" font-weight="700">放在不同 stream 只是「允许」并发，不「保证」并发</text><text x="600.0" y="74" fill="#7e9fb8" font-family="sans-serif" font-size="14" text-anchor="middle">2 个 kernel 放 2 个 non-blocking stream，扫它们各自占多少 SM（GB200，152 SM）</text>
  <rect x="60" y="110" width="650" height="420" rx="12" fill="#0b1c2a" stroke="#22405a" stroke-width="1.2"/>
  <line x1="110" y1="421.42857142857144" x2="670" y2="421.42857142857144" stroke="#1b3346" stroke-width="1"/>
  <text x="100" y="425.42857142857144" fill="#5f7f96" font-family="sans-serif" font-size="11.5" text-anchor="end">1.0</text>
  <line x1="110" y1="300.0" x2="670" y2="300.0" stroke="#1b3346" stroke-width="1"/>
  <text x="100" y="304.0" fill="#5f7f96" font-family="sans-serif" font-size="11.5" text-anchor="end">1.5</text>
  <line x1="110" y1="178.5714285714286" x2="670" y2="178.5714285714286" stroke="#1b3346" stroke-width="1"/>
  <text x="100" y="182.5714285714286" fill="#5f7f96" font-family="sans-serif" font-size="11.5" text-anchor="end">2.0</text>
  <text x="76" y="300.0" fill="#7e9fb8" font-family="sans-serif" font-size="12" text-anchor="middle">并发度</text>
  <text x="110.0" y="492" fill="#5f7f96" font-family="sans-serif" font-size="11.5" text-anchor="middle">12%</text>
  <text x="222.0" y="492" fill="#5f7f96" font-family="sans-serif" font-size="11.5" text-anchor="middle">25%</text>
  <text x="334.0" y="492" fill="#5f7f96" font-family="sans-serif" font-size="11.5" text-anchor="middle">50%</text>
  <text x="446.0" y="492" fill="#5f7f96" font-family="sans-serif" font-size="11.5" text-anchor="middle">75%</text>
  <text x="558.0" y="492" fill="#5f7f96" font-family="sans-serif" font-size="11.5" text-anchor="middle">100%</text>
  <text x="670.0" y="492" fill="#5f7f96" font-family="sans-serif" font-size="11.5" text-anchor="middle">200%</text>
  <text x="390.0" y="518" fill="#7e9fb8" font-family="sans-serif" font-size="12.5" text-anchor="middle">每个 kernel 占用的 SM 比例</text>
  <polyline points="110.0,181.00000000000006 222.0,181.00000000000006 334.0,181.00000000000006 446.0,300.0 558.0,421.42857142857144 670.0,421.42857142857144" fill="none" stroke="#58d68d" stroke-width="2.6"/>
  <circle cx="110.0" cy="181.00000000000006" r="4.5" fill="#58d68d"/>
  <circle cx="222.0" cy="181.00000000000006" r="4.5" fill="#58d68d"/>
  <circle cx="334.0" cy="181.00000000000006" r="4.5" fill="#58d68d"/>
  <circle cx="446.0" cy="300.0" r="4.5" fill="#58d68d"/>
  <circle cx="558.0" cy="421.42857142857144" r="4.5" fill="#58d68d"/>
  <circle cx="670.0" cy="421.42857142857144" r="4.5" fill="#58d68d"/>
  <rect x="102.0" y="130" width="240.0" height="340" rx="6" fill="#58d68d" opacity="0.1"/>
  <text x="222.0" y="152" fill="#7ee6a8" font-family="sans-serif" font-size="12.5" text-anchor="middle" font-weight="700">两个都放得下 → 完全并发</text>
  <rect x="548.0" y="130" width="132.0" height="340" rx="6" fill="#ff7b7b" opacity="0.1"/>
  <text x="614.0" y="152" fill="#ff9b9b" font-family="sans-serif" font-size="12.5" text-anchor="middle" font-weight="700">第一个已占满 → 串行</text>
  <text x="446.0" y="284.0" fill="#ffd76a" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="700">75%：部分并发</text>
  <text x="720" y="124" fill="#cfe6f3" font-family="sans-serif" font-size="14" font-weight="700">75% 那一点发生了什么</text>
  <rect x="720" y="146" width="420" height="126" rx="10" fill="#0b1c2a" stroke="#22405a" stroke-width="1.2"/>
  <text x="734" y="168" fill="#8fb8d6" font-family="sans-serif" font-size="12.5" font-weight="700">50% + 50%</text>
  <rect x="734" y="180" width="392" height="26" rx="5" fill="#0d1f2e" stroke="#33566f" stroke-width="1.2"/>
  <rect x="734" y="180" width="196.0" height="26" rx="5" fill="#173f59" stroke="#65d0ff" stroke-width="1.2"/>
  <text x="832.0" y="198" fill="#82dcff" font-family="sans-serif" font-size="11" text-anchor="middle">K1 76SM</text>
  <rect x="930.0" y="180" width="196.0" height="26" rx="5" fill="#2e2350" stroke="#b18cff" stroke-width="1.2"/>
  <text x="1028.0" y="198" fill="#c9b0ff" font-family="sans-serif" font-size="11" text-anchor="middle">K2 76</text>
  <text x="734" y="226" fill="#cfe6f3" font-family="sans-serif" font-size="11.5">两个各拿 76 个 SM，同时跑完</text>
  <rect x="720" y="296" width="420" height="126" rx="10" fill="#0b1c2a" stroke="#22405a" stroke-width="1.2"/>
  <text x="734" y="318" fill="#8fb8d6" font-family="sans-serif" font-size="12.5" font-weight="700">75% + 75%</text>
  <rect x="734" y="330" width="392" height="26" rx="5" fill="#0d1f2e" stroke="#33566f" stroke-width="1.2"/>
  <rect x="734" y="330" width="294.0" height="26" rx="5" fill="#173f59" stroke="#65d0ff" stroke-width="1.2"/>
  <text x="881.0" y="348" fill="#82dcff" font-family="sans-serif" font-size="11" text-anchor="middle">K1 114SM</text>
  <rect x="1028.0" y="330" width="98.0" height="26" rx="5" fill="#2e2350" stroke="#b18cff" stroke-width="1.2"/>
  <text x="1077.0" y="348" fill="#c9b0ff" font-family="sans-serif" font-size="11" text-anchor="middle">K2 38</text>
  <text x="734" y="376" fill="#cfe6f3" font-family="sans-serif" font-size="11.5">K1 拿满 114，K2 只捡到 38，</text>
  <text x="734" y="395" fill="#cfe6f3" font-family="sans-serif" font-size="11.5">剩下的等 K1 的 CTA 陆续退出</text>
  <rect x="720" y="446" width="420" height="126" rx="10" fill="#0b1c2a" stroke="#22405a" stroke-width="1.2"/>
  <text x="734" y="468" fill="#8fb8d6" font-family="sans-serif" font-size="12.5" font-weight="700">100% + 100%</text>
  <rect x="734" y="480" width="392" height="26" rx="5" fill="#0d1f2e" stroke="#33566f" stroke-width="1.2"/>
  <rect x="734" y="480" width="392.0" height="26" rx="5" fill="#173f59" stroke="#65d0ff" stroke-width="1.2"/>
  <text x="930.0" y="498" fill="#82dcff" font-family="sans-serif" font-size="11" text-anchor="middle">K1 152SM</text>
  <text x="734" y="526" fill="#cfe6f3" font-family="sans-serif" font-size="11.5">K1 吃满全部，K2 只能等</text>
  <rect x="60" y="560" width="1080" height="44" rx="10" fill="#0d1f2e" stroke="#f0c040" stroke-width="1.2"/>
  <text x="80" y="588" fill="#ffd76a" font-family="sans-serif" font-size="13">推论：如果 kernel 本来就能打满 GPU（大 batch 的 GEMM），多开 stream 一点用都没有。stream 并发的价值只在小 kernel 场景——也就是 bs=1 decode 那种。</text>
</svg>
