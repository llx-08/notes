<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660">
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.sub{font-size:18px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#526076}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.blue{fill:#e8f1ff;stroke:#5b8def;stroke-width:2}.green{fill:#e9f8ef;stroke:#41a66b;stroke-width:2}.orange{fill:#fff2df;stroke:#e79835;stroke-width:2}.purple{fill:#f1ebff;stroke:#8b68d7;stroke-width:2}.red{fill:#fff0f0;stroke:#dc6b6b;stroke-width:2}.arrow{fill:none;stroke:#526076;stroke-width:2.2;marker-end:url(#a)}.dash{fill:none;stroke:#8a97aa;stroke-width:2;stroke-dasharray:7 6}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526076"/></marker></defs>
  <rect width="1120" height="660" fill="#fff"/><text x="560" y="42" text-anchor="middle" class="title">三条代码线不是包含关系，而是能力分叉</text>
  <rect x="35" y="75" width="320" height="475" rx="16" class="panel"/><text x="195" y="108" text-anchor="middle" class="sub">社区 Mooncake</text><text x="195" y="133" text-anchor="middle" class="small">0.3.12.post1 / 6041a609</text>
  <rect x="65" y="165" width="260" height="72" rx="10" class="green"/><text x="195" y="194" text-anchor="middle" class="body">group_ids</text><text x="195" y="216" text-anchor="middle" class="small">可表达 TP shard 驱逐组</text>
  <rect x="65" y="255" width="260" height="92" rx="10" class="blue"/><text x="195" y="284" text-anchor="middle" class="body">KV events publisher</text><text x="195" y="306" text-anchor="middle" class="small">ENABLE_KV_EVENTS 默认 OFF</text><text x="195" y="327" text-anchor="middle" class="small">OFF 时命令行存在但实现为 stub</text>
  <rect x="65" y="365" width="260" height="92" rx="10" class="red"/><text x="195" y="395" text-anchor="middle" class="body">缺少内部专用能力</text><text x="195" y="418" text-anchor="middle" class="small">无 LocalMaster / Linux reclaim</text><text x="195" y="439" text-anchor="middle" class="small">无 rldev partitioned 部署</text>

  <rect x="400" y="75" width="320" height="475" rx="16" class="panel"/><text x="560" y="108" text-anchor="middle" class="sub">内部 PAI-LLM/mooncake rldev</text><text x="560" y="133" text-anchor="middle" class="small">统一池主线，分支快照：2026-08-26</text>
  <rect x="430" y="165" width="260" height="72" rx="10" class="green"/><text x="560" y="194" text-anchor="middle" class="body">LocalMaster + Unified Pool</text><text x="560" y="216" text-anchor="middle" class="small">Pod 内控制面与资源视图统一</text>
  <rect x="430" y="255" width="260" height="92" rx="10" class="orange"/><text x="560" y="284" text-anchor="middle" class="body">ShardEvictInfo / reclaim</text><text x="560" y="306" text-anchor="middle" class="small">active/inactive + direct reclaim</text><text x="560" y="327" text-anchor="middle" class="small">swapout / offload / primary 语义</text>
  <rect x="430" y="365" width="260" height="92" rx="10" class="purple"/><text x="560" y="395" text-anchor="middle" class="body">partitioned cluster mode</text><text x="560" y="418" text-anchor="middle" class="small">一致性哈希环 + Redis 注册表</text><text x="560" y="439" text-anchor="middle" class="small">当前快照无 group_ids / kv_events</text>

  <rect x="765" y="75" width="320" height="475" rx="16" class="panel"/><text x="925" y="108" text-anchor="middle" class="sub">我们的 vLLM / mcstore</text><text x="925" y="133" text-anchor="middle" class="small">llx/kvs-mooncake-store</text>
  <rect x="795" y="165" width="260" height="72" rx="10" class="green"/><text x="925" y="194" text-anchor="middle" class="body">PD 分离 + 跨实例 KV 共享</text><text x="925" y="216" text-anchor="middle" class="small">DRAM segment + RDMA zero-copy</text>
  <rect x="795" y="255" width="260" height="92" rx="10" class="blue"/><text x="925" y="284" text-anchor="middle" class="body">TP group 原子驱逐</text><text x="925" y="306" text-anchor="middle" class="small">group_ids 修复半残 block</text><text x="925" y="327" text-anchor="middle" class="small">需要向 rldev 移植或对齐</text>
  <rect x="795" y="365" width="260" height="92" rx="10" class="orange"/><text x="925" y="395" text-anchor="middle" class="body">实测证据</text><text x="925" y="418" text-anchor="middle" class="small">4.5M → 11.74M keys/s</text><text x="925" y="439" text-anchor="middle" class="small">fan-out、热点、驱逐损伤边界</text>
  <rect x="155" y="580" width="810" height="52" rx="12" class="red"/><text x="560" y="604" text-anchor="middle" class="body">采用 rldev = feature merge，不是普通升级</text><text x="560" y="623" text-anchor="middle" class="small">必须逐项核对 group 原子性、DRAM/RDMA 部署语义、版本基线和 kv_events</text>
</svg>
