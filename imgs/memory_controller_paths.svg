<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">CPU DRAM controller、PCIe I/O 与 GPU HBM controller 的分层结构</title>
  <desc id="desc">展示 CPU 核心和 PCIe 设备请求如何经过 cache、一致性、内存控制器到达 DDR，以及 GPU 请求如何经过 L2 和 HBM controller 到达 HBM；下方以 pinned host memory 到 GPU HBM 的 copy kernel 为例标出各部件职责。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#edf3f9"/>
    </linearGradient>
    <linearGradient id="cpuHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2855a6"/>
      <stop offset="1" stop-color="#3f77c8"/>
    </linearGradient>
    <linearGradient id="gpuHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#267545"/>
      <stop offset="1" stop-color="#48a466"/>
    </linearGradient>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#315f9f"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#2f8750"/>
    </marker>
    <marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#7658a5"/>
    </marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#26415f" flood-opacity=".12"/>
    </filter>
    <style>
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#162a42}
      .subtitle{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#5b6b7e}
      .panelTitle{font:700 21px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:white}
      .boxTitle{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#20344d}
      .body{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#526277}
      .tiny{font:400 12.5px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#64748a}
      .flow{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#344a64}
      .note{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#293b54}
    </style>
  </defs>

  <rect width="1400" height="980" fill="url(#bg)"/>
  <text x="700" y="50" text-anchor="middle" class="title">Memory Controller 在整条数据路径中的位置</text>
  <text x="700" y="80" text-anchor="middle" class="subtitle">它负责“如何访问 DRAM”，不负责理解或执行整个 copy / DMA 任务</text>

  <!-- CPU panel -->
  <g filter="url(#shadow)">
    <rect x="50" y="110" width="625" height="560" rx="18" fill="#fff" stroke="#c9d8e9"/>
    <path d="M68 110H657a18 18 0 0 1 18 18v48H50v-48a18 18 0 0 1 18-18Z" fill="url(#cpuHead)"/>
  </g>
  <text x="78" y="151" class="panelTitle">CPU / Host Memory 路径</text>

  <rect x="85" y="205" width="155" height="78" rx="11" fill="#eef5ff" stroke="#9bbce6"/>
  <text x="162.5" y="234" text-anchor="middle" class="boxTitle">CPU cores</text>
  <text x="162.5" y="258" text-anchor="middle" class="body">load / store 指令</text>

  <rect x="285" y="205" width="180" height="78" rx="11" fill="#eef5ff" stroke="#9bbce6"/>
  <text x="375" y="234" text-anchor="middle" class="boxTitle">L1 / L2 / LLC</text>
  <text x="375" y="258" text-anchor="middle" class="body">cache hit 可直接结束</text>

  <rect x="505" y="205" width="135" height="78" rx="11" fill="#fff4e5" stroke="#dfb46f"/>
  <text x="572.5" y="234" text-anchor="middle" class="boxTitle">Home / CHA</text>
  <text x="572.5" y="258" text-anchor="middle" class="body">一致性与归属</text>

  <path d="M240 244H275" stroke="#315f9f" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M465 244H495" stroke="#315f9f" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <rect x="85" y="330" width="175" height="100" rx="11" fill="#f4f0fb" stroke="#b9a4d7"/>
  <text x="172.5" y="360" text-anchor="middle" class="boxTitle">PCIe Endpoint</text>
  <text x="172.5" y="385" text-anchor="middle" class="body">NIC / GPU / NVMe</text>
  <text x="172.5" y="408" text-anchor="middle" class="tiny">发出 Memory Request TLP</text>

  <rect x="305" y="330" width="170" height="100" rx="11" fill="#f4f0fb" stroke="#b9a4d7"/>
  <text x="390" y="360" text-anchor="middle" class="boxTitle">Root Port / IIO</text>
  <text x="390" y="385" text-anchor="middle" class="body">PCIe ↔ 片上事务</text>
  <text x="390" y="408" text-anchor="middle" class="tiny">可经过 IOMMU 转换</text>

  <path d="M260 380H295" stroke="#7658a5" stroke-width="3" marker-end="url(#arrowPurple)"/>
  <path d="M475 380C525 380 560 340 570 293" fill="none" stroke="#7658a5" stroke-width="3" marker-end="url(#arrowPurple)"/>

  <rect x="215" y="480" width="300" height="118" rx="13" fill="#e9f2ff" stroke="#729ed5" stroke-width="2"/>
  <text x="365" y="511" text-anchor="middle" class="boxTitle">Integrated Memory Controller（IMC）</text>
  <text x="365" y="538" text-anchor="middle" class="body">地址映射 · 请求队列 · 读写调度</text>
  <text x="365" y="562" text-anchor="middle" class="body">DRAM timing · refresh · ECC / RAS · QoS</text>
  <text x="365" y="584" text-anchor="middle" class="tiny">把最终 memory request 变成 ACT / RD / WR / PRE</text>

  <path d="M572 283C572 410 515 458 478 476" fill="none" stroke="#315f9f" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <rect x="85" y="620" width="130" height="32" rx="8" fill="#dcecff" stroke="#8cb0df"/>
  <rect x="230" y="620" width="130" height="32" rx="8" fill="#dcecff" stroke="#8cb0df"/>
  <rect x="375" y="620" width="130" height="32" rx="8" fill="#dcecff" stroke="#8cb0df"/>
  <rect x="520" y="620" width="120" height="32" rx="8" fill="#dcecff" stroke="#8cb0df"/>
  <text x="150" y="642" text-anchor="middle" class="flow">DDR channel 0</text>
  <text x="295" y="642" text-anchor="middle" class="flow">DDR channel 1</text>
  <text x="440" y="642" text-anchor="middle" class="flow">DDR channel 2</text>
  <text x="580" y="642" text-anchor="middle" class="flow">… → DIMM</text>
  <path d="M365 598V610H150V618M365 610H580V618M295 610V618M440 610V618" fill="none" stroke="#315f9f" stroke-width="2"/>

  <!-- GPU panel -->
  <g filter="url(#shadow)">
    <rect x="725" y="110" width="625" height="560" rx="18" fill="#fff" stroke="#c8decf"/>
    <path d="M743 110h589a18 18 0 0 1 18 18v48H725v-48a18 18 0 0 1 18-18Z" fill="url(#gpuHead)"/>
  </g>
  <text x="753" y="151" class="panelTitle">GPU / HBM 路径</text>

  <rect x="760" y="205" width="165" height="90" rx="11" fill="#edf9f1" stroke="#91c9a3"/>
  <text x="842.5" y="234" text-anchor="middle" class="boxTitle">SM load/store</text>
  <text x="842.5" y="259" text-anchor="middle" class="body">kernel memory 指令</text>
  <text x="842.5" y="280" text-anchor="middle" class="tiny">coalescing / cache request</text>

  <rect x="960" y="205" width="170" height="90" rx="11" fill="#f4f0fb" stroke="#b9a4d7"/>
  <text x="1045" y="234" text-anchor="middle" class="boxTitle">Copy Engine</text>
  <text x="1045" y="259" text-anchor="middle" class="body">执行 copy descriptor</text>
  <text x="1045" y="280" text-anchor="middle" class="tiny">不是 HBM controller</text>

  <rect x="1165" y="205" width="150" height="90" rx="11" fill="#f4f0fb" stroke="#b9a4d7"/>
  <text x="1240" y="234" text-anchor="middle" class="boxTitle">PCIe / NVLink</text>
  <text x="1240" y="259" text-anchor="middle" class="body">外部请求入口</text>
  <text x="1240" y="280" text-anchor="middle" class="tiny">peer / host traffic</text>

  <rect x="805" y="342" width="465" height="76" rx="11" fill="#eef8f2" stroke="#91c9a3"/>
  <text x="1037.5" y="372" text-anchor="middle" class="boxTitle">GPU MMU + on-chip NoC / crossbar</text>
  <text x="1037.5" y="397" text-anchor="middle" class="body">地址转换、路由、请求合并与仲裁</text>

  <path d="M843 295V329" stroke="#2f8750" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <path d="M1045 295V329" stroke="#2f8750" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <path d="M1240 295V329" stroke="#2f8750" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <rect x="805" y="453" width="465" height="68" rx="11" fill="#e2f4e8" stroke="#70b288" stroke-width="2"/>
  <text x="1037.5" y="483" text-anchor="middle" class="boxTitle">Shared L2 cache / L2 slices</text>
  <text x="1037.5" y="507" text-anchor="middle" class="body">cache hit 不访问 HBM；miss 才进入 memory partition</text>
  <path d="M1037.5 418V440" stroke="#2f8750" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <rect x="825" y="553" width="425" height="72" rx="12" fill="#d9f0e1" stroke="#55a873" stroke-width="2"/>
  <text x="1037.5" y="582" text-anchor="middle" class="boxTitle">HBM memory controllers / partitions</text>
  <text x="1037.5" y="607" text-anchor="middle" class="body">地址映射 · 排队/调度 · timing · refresh · ECC / RAS</text>
  <path d="M1037.5 521V540" stroke="#2f8750" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <rect x="760" y="640" width="155" height="30" rx="7" fill="#cdebd8" stroke="#6bb486"/>
  <rect x="930" y="640" width="155" height="30" rx="7" fill="#cdebd8" stroke="#6bb486"/>
  <rect x="1100" y="640" width="215" height="30" rx="7" fill="#cdebd8" stroke="#6bb486"/>
  <text x="837.5" y="661" text-anchor="middle" class="flow">HBM stack 0</text>
  <text x="1007.5" y="661" text-anchor="middle" class="flow">HBM stack 1</text>
  <text x="1207.5" y="661" text-anchor="middle" class="flow">… channels / banks</text>
  <path d="M1037.5 625V632H837.5V638M1037.5 632H1207.5V638M1007.5 632V638" fill="none" stroke="#2f8750" stroke-width="2"/>

  <!-- Bottom worked example -->
  <g filter="url(#shadow)">
    <rect x="50" y="710" width="1300" height="220" rx="18" fill="#fff" stroke="#d4dce6"/>
  </g>
  <text x="80" y="750" class="boxTitle">例：GPU copy kernel 把 pinned host memory 复制到 GPU HBM</text>
  <text x="80" y="777" class="body">同一次 copy 会经过两个不同的 memory controller；控制器服务最终 DRAM 请求，但发起者是 GPU SM。</text>

  <rect x="80" y="812" width="150" height="70" rx="11" fill="#edf9f1" stroke="#91c9a3"/>
  <text x="155" y="840" text-anchor="middle" class="boxTitle">① GPU SM</text>
  <text x="155" y="864" text-anchor="middle" class="body">发出 host load</text>

  <rect x="260" y="812" width="170" height="70" rx="11" fill="#f4f0fb" stroke="#b9a4d7"/>
  <text x="345" y="840" text-anchor="middle" class="boxTitle">② PCIe / C2C</text>
  <text x="345" y="864" text-anchor="middle" class="body">把读请求送到 CPU</text>

  <rect x="460" y="812" width="180" height="70" rx="11" fill="#e9f2ff" stroke="#729ed5"/>
  <text x="550" y="840" text-anchor="middle" class="boxTitle">③ CPU IMC</text>
  <text x="550" y="864" text-anchor="middle" class="body">读取 pinned host DRAM</text>

  <rect x="670" y="812" width="170" height="70" rx="11" fill="#f4f0fb" stroke="#b9a4d7"/>
  <text x="755" y="840" text-anchor="middle" class="boxTitle">④ PCIe / C2C</text>
  <text x="755" y="864" text-anchor="middle" class="body">把返回数据送回 GPU</text>

  <rect x="870" y="812" width="145" height="70" rx="11" fill="#e2f4e8" stroke="#70b288"/>
  <text x="942.5" y="840" text-anchor="middle" class="boxTitle">⑤ GPU L2</text>
  <text x="942.5" y="864" text-anchor="middle" class="body">接收并缓存</text>

  <rect x="1045" y="812" width="210" height="70" rx="11" fill="#d9f0e1" stroke="#55a873"/>
  <text x="1150" y="840" text-anchor="middle" class="boxTitle">⑥ HBM controller</text>
  <text x="1150" y="864" text-anchor="middle" class="body">调度并写入 HBM DRAM</text>

  <path d="M230 847H247" stroke="#7658a5" stroke-width="3" marker-end="url(#arrowPurple)"/>
  <path d="M430 847H447" stroke="#7658a5" stroke-width="3" marker-end="url(#arrowPurple)"/>
  <path d="M640 847H657" stroke="#7658a5" stroke-width="3" marker-end="url(#arrowPurple)"/>
  <path d="M840 847H857" stroke="#7658a5" stroke-width="3" marker-end="url(#arrowPurple)"/>
  <path d="M1015 847H1032" stroke="#7658a5" stroke-width="3" marker-end="url(#arrowPurple)"/>

  <rect x="80" y="900" width="1175" height="1" fill="#e2e8f0"/>
  <text x="80" y="920" class="tiny">Pinned 的作用：页不被换出/迁移并建立可访问映射；它不会绕过 CPU IMC，也不会把 host DRAM 变成 GPU HBM。</text>
  <text x="1320" y="955" text-anchor="end" class="tiny">结构示意图 · 不对应某一代芯片的精确 floorplan</text>
</svg>
