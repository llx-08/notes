<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif; fill: #172033; }
      .head { font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif; fill: #172033; }
      .body { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif; fill: #344054; }
      .mono { font: 600 16px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #344054; }
      .white { font: 700 16px ui-monospace, SFMono-Regular, Menlo, monospace; fill: white; }
      .tiny { font: 500 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #475467; }
      .arrow { stroke: #667085; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#667085"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="1600" height="980" fill="#f7f9fc"/>
  <text x="800" y="55" text-anchor="middle" class="title">DeepSeek-V4 CSA：m=4 时，2m 候选如何压成 1 个 entry</text>

  <g filter="url(#shadow)">
    <rect x="45" y="90" width="1510" height="180" rx="22" fill="white"/>
    <rect x="45" y="305" width="1510" height="470" rx="22" fill="white"/>
    <rect x="45" y="815" width="1510" height="115" rx="22" fill="white"/>
  </g>

  <text x="75" y="128" class="head">1. 每 4 个 raw hidden states 是一个输出步长；每个 token 同时产生 a/b 两套 content + gate</text>

  <g>
    <rect x="95" y="160" width="78" height="48" rx="10" fill="#19a974"/><text x="134" y="190" text-anchor="middle" class="white">h0</text>
    <rect x="181" y="160" width="78" height="48" rx="10" fill="#19a974"/><text x="220" y="190" text-anchor="middle" class="white">h1</text>
    <rect x="267" y="160" width="78" height="48" rx="10" fill="#19a974"/><text x="306" y="190" text-anchor="middle" class="white">h2</text>
    <rect x="353" y="160" width="78" height="48" rx="10" fill="#19a974"/><text x="392" y="190" text-anchor="middle" class="white">h3</text>
    <rect x="545" y="160" width="78" height="48" rx="10" fill="#39a0ed"/><text x="584" y="190" text-anchor="middle" class="white">h4</text>
    <rect x="631" y="160" width="78" height="48" rx="10" fill="#39a0ed"/><text x="670" y="190" text-anchor="middle" class="white">h5</text>
    <rect x="717" y="160" width="78" height="48" rx="10" fill="#39a0ed"/><text x="756" y="190" text-anchor="middle" class="white">h6</text>
    <rect x="803" y="160" width="78" height="48" rx="10" fill="#39a0ed"/><text x="842" y="190" text-anchor="middle" class="white">h7</text>
    <rect x="995" y="160" width="78" height="48" rx="10" fill="#f5a623"/><text x="1034" y="190" text-anchor="middle" class="white">h8</text>
    <rect x="1081" y="160" width="78" height="48" rx="10" fill="#f5a623"/><text x="1120" y="190" text-anchor="middle" class="white">h9</text>
    <rect x="1167" y="160" width="78" height="48" rx="10" fill="#f5a623"/><text x="1206" y="190" text-anchor="middle" class="white">h10</text>
    <rect x="1253" y="160" width="78" height="48" rx="10" fill="#f5a623"/><text x="1292" y="190" text-anchor="middle" class="white">h11</text>

    <rect x="80" y="146" width="365" height="78" rx="15" fill="none" stroke="#107c56" stroke-width="3" stroke-dasharray="9 7"/>
    <rect x="530" y="146" width="365" height="78" rx="15" fill="none" stroke="#287fbd" stroke-width="3" stroke-dasharray="9 7"/>
    <rect x="980" y="146" width="365" height="78" rx="15" fill="none" stroke="#d98400" stroke-width="3" stroke-dasharray="9 7"/>
    <text x="262" y="248" text-anchor="middle" class="mono">G0</text>
    <text x="712" y="248" text-anchor="middle" class="mono">G1</text>
    <text x="1162" y="248" text-anchor="middle" class="mono">G2</text>
    <rect x="1385" y="152" width="115" height="62" rx="13" fill="#f1edff" stroke="#7656d8"/>
    <text x="1442" y="178" text-anchor="middle" class="tiny">Wkv → Ca,Cb</text>
    <text x="1442" y="199" text-anchor="middle" class="tiny">Wgate → Za,Zb</text>
  </g>

  <text x="75" y="344" class="head">2. 每个 compressed entry：前一组 b 分支 + 当前组 a 分支，共 8 个 candidates</text>

  <g>
    <rect x="95" y="385" width="1410" height="102" rx="17" fill="#fafbfc" stroke="#d0d5dd"/>
    <text x="125" y="425" class="mono">Ccomp[0]</text>
    <rect x="300" y="403" width="250" height="58" rx="12" fill="#f2f4f7" stroke="#98a2b3"/><text x="425" y="428" text-anchor="middle" class="body">previous b：padding</text><text x="425" y="449" text-anchor="middle" class="tiny">gate = -∞, content = 0</text>
    <text x="585" y="438" class="head">+</text>
    <rect x="625" y="403" width="400" height="58" rx="12" fill="#eaf8f1" stroke="#19a974"/><text x="825" y="428" text-anchor="middle" class="body">current a：Ca0, Ca1, Ca2, Ca3</text><text x="825" y="449" text-anchor="middle" class="tiny">G0 的 4 个有效 candidates</text>
    <path d="M1050 432 H1135" class="arrow"/>
    <rect x="1150" y="398" width="305" height="68" rx="13" fill="#fff2d9" stroke="#f5a623"/><text x="1302" y="425" text-anchor="middle" class="body">per-channel softmax + sum</text><text x="1302" y="449" text-anchor="middle" class="tiny">实际仅汇总 G0</text>

    <rect x="95" y="510" width="1410" height="102" rx="17" fill="#fafbfc" stroke="#d0d5dd"/>
    <text x="125" y="550" class="mono">Ccomp[1]</text>
    <rect x="300" y="528" width="250" height="58" rx="12" fill="#eaf8f1" stroke="#19a974"/><text x="425" y="553" text-anchor="middle" class="body">previous b：Cb0...Cb3</text><text x="425" y="574" text-anchor="middle" class="tiny">来自 G0</text>
    <text x="585" y="563" class="head">+</text>
    <rect x="625" y="528" width="400" height="58" rx="12" fill="#e5f4ff" stroke="#39a0ed"/><text x="825" y="553" text-anchor="middle" class="body">current a：Ca4, Ca5, Ca6, Ca7</text><text x="825" y="574" text-anchor="middle" class="tiny">来自 G1</text>
    <path d="M1050 557 H1135" class="arrow"/>
    <rect x="1150" y="523" width="305" height="68" rx="13" fill="#fff2d9" stroke="#f5a623"/><text x="1302" y="550" text-anchor="middle" class="body">8-way softmax × 512 channels</text><text x="1302" y="574" text-anchor="middle" class="tiny">感受野 h0...h7</text>

    <rect x="95" y="635" width="1410" height="102" rx="17" fill="#fafbfc" stroke="#d0d5dd"/>
    <text x="125" y="675" class="mono">Ccomp[2]</text>
    <rect x="300" y="653" width="250" height="58" rx="12" fill="#e5f4ff" stroke="#39a0ed"/><text x="425" y="678" text-anchor="middle" class="body">previous b：Cb4...Cb7</text><text x="425" y="699" text-anchor="middle" class="tiny">来自 G1</text>
    <text x="585" y="688" class="head">+</text>
    <rect x="625" y="653" width="400" height="58" rx="12" fill="#fff2d9" stroke="#f5a623"/><text x="825" y="678" text-anchor="middle" class="body">current a：Ca8, Ca9, Ca10, Ca11</text><text x="825" y="699" text-anchor="middle" class="tiny">来自 G2</text>
    <path d="M1050 682 H1135" class="arrow"/>
    <rect x="1150" y="648" width="305" height="68" rx="13" fill="#f1edff" stroke="#7656d8"/><text x="1302" y="675" text-anchor="middle" class="body">输出 1 个 512-d entry</text><text x="1302" y="699" text-anchor="middle" class="tiny">感受野 h4...h11</text>
  </g>

  <text x="75" y="853" class="head">3. 关键：感受野是 8，但输出步长是 4</text>
  <text x="95" y="892" class="body">12 个 raw tokens → 3 个 compressed entries，长度仍缩到 1/4；overlap 只扩大每个 summary 的信息来源，不增加输出数量。</text>
  <rect x="1140" y="842" width="350" height="60" rx="14" fill="#eaf8f1" stroke="#19a974"/>
  <text x="1315" y="868" text-anchor="middle" class="body">同一 raw group 参与两个相邻 summaries</text>
  <text x="1315" y="891" text-anchor="middle" class="tiny">一次走 a 分支，一次走 b 分支</text>
</svg>
