<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760">
  <defs>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif; fill: #172033; }
      .head { font: 700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif; fill: #172033; }
      .body { font: 500 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif; fill: #344054; }
      .small { font: 500 17px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #344054; }
      .label { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif; fill: white; }
      .arrow { stroke: #667085; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#667085"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1440" height="760" fill="#f7f9fc"/>
  <text x="720" y="58" text-anchor="middle" class="title">先看清楚：到底沿哪一条轴做 group？</text>

  <g filter="url(#shadow)">
    <rect x="45" y="100" width="650" height="590" rx="24" fill="#fff" stroke="#f1b5b5" stroke-width="3"/>
    <rect x="745" y="100" width="650" height="590" rx="24" fill="#fff" stroke="#9bd5b5" stroke-width="3"/>
  </g>

  <text x="370" y="145" text-anchor="middle" class="head">误解：沿 Query 轴分组</text>
  <text x="1070" y="145" text-anchor="middle" class="head">实际：沿历史 KV 轴分组</text>

  <g>
    <rect x="105" y="190" width="110" height="52" rx="12" fill="#5b7cfa"/><text x="160" y="223" text-anchor="middle" class="label">q0</text>
    <rect x="105" y="255" width="110" height="52" rx="12" fill="#5b7cfa"/><text x="160" y="288" text-anchor="middle" class="label">q1</text>
    <rect x="105" y="320" width="110" height="52" rx="12" fill="#5b7cfa"/><text x="160" y="353" text-anchor="middle" class="label">q2</text>
    <rect x="105" y="385" width="110" height="52" rx="12" fill="#5b7cfa"/><text x="160" y="418" text-anchor="middle" class="label">q3</text>
    <rect x="90" y="174" width="140" height="280" rx="18" fill="none" stroke="#ed6a5a" stroke-width="4" stroke-dasharray="10 8"/>
    <path d="M240 314 H340" class="arrow"/>
    <rect x="355" y="244" width="265" height="140" rx="18" fill="#fff0f0" stroke="#ed6a5a" stroke-width="2"/>
    <text x="487" y="292" text-anchor="middle" class="body">把 4 个 Query</text>
    <text x="487" y="324" text-anchor="middle" class="body">合成一次路由</text>
    <text x="487" y="356" text-anchor="middle" class="small">shared Top-K</text>
    <text x="370" y="505" text-anchor="middle" class="body">这种方案会让 q0-q3 得到</text>
    <text x="370" y="540" text-anchor="middle" class="body">完全相同的 selected KV indices</text>
    <rect x="165" y="580" width="410" height="60" rx="15" fill="#fff4e5" stroke="#f5a623"/>
    <text x="370" y="617" text-anchor="middle" class="body">QSA Q-block 属于这一类</text>
  </g>

  <g>
    <text x="790" y="205" class="body">Query rows 保持独立</text>
    <rect x="790" y="225" width="105" height="50" rx="12" fill="#5b7cfa"/><text x="842" y="257" text-anchor="middle" class="label">qA</text>
    <rect x="790" y="292" width="105" height="50" rx="12" fill="#7656d8"/><text x="842" y="324" text-anchor="middle" class="label">qB</text>

    <text x="970" y="205" class="body">历史 KV candidates</text>
    <g>
      <rect x="970" y="225" width="66" height="50" rx="10" fill="#19a974"/><text x="1003" y="257" text-anchor="middle" class="label">k0</text>
      <rect x="1043" y="225" width="66" height="50" rx="10" fill="#19a974"/><text x="1076" y="257" text-anchor="middle" class="label">k1</text>
      <rect x="1116" y="225" width="66" height="50" rx="10" fill="#19a974"/><text x="1149" y="257" text-anchor="middle" class="label">k2</text>
      <rect x="1189" y="225" width="66" height="50" rx="10" fill="#19a974"/><text x="1222" y="257" text-anchor="middle" class="label">k3</text>
      <rect x="955" y="212" width="315" height="76" rx="14" fill="none" stroke="#107c56" stroke-width="4" stroke-dasharray="9 7"/>
      <path d="M1112 298 V350" class="arrow"/>
      <rect x="1010" y="365" width="205" height="62" rx="14" fill="#dff6ec" stroke="#19a974" stroke-width="2"/>
      <text x="1112" y="404" text-anchor="middle" class="body">compressed G0</text>
    </g>

    <path d="M900 250 C940 250, 965 375, 1000 390" class="arrow"/>
    <path d="M900 317 C945 317, 965 400, 1000 406" class="arrow"/>
    <text x="1070" y="485" text-anchor="middle" class="body">qA 和 qB 各自给 G0、G1... 打分</text>
    <text x="1070" y="520" text-anchor="middle" class="body">各自执行一行 Top-K</text>
    <rect x="865" y="557" width="410" height="76" rx="15" fill="#eaf8f1" stroke="#19a974"/>
    <text x="1070" y="588" text-anchor="middle" class="body">group 的是 KV candidates</text>
    <text x="1070" y="617" text-anchor="middle" class="body">不是 Query tokens</text>
  </g>
</svg>
