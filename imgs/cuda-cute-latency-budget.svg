<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc" data-series="cuda-cute-nvidia-learning">
  <title id="title">延迟预算：H20 与 GB200 实测对比</title>
  <desc id="desc">用 pointer chase 实测 L1、L2、HBM 访存延迟，与单个 CTA tile 的 MMA 计算时间对比，说明 Blackwell 上延迟隐藏为何显著更难。</desc>
  <rect width="1200" height="780" rx="26" fill="#071522"/>
  <text x="600" y="46" text-anchor="middle" fill="white" font-family="sans-serif" font-size="28" font-weight="700">延迟预算：要藏的延迟 vs 能用来藏的计算</text>
  <text x="600" y="76" text-anchor="middle" fill="#7e9fb8" font-family="sans-serif" font-size="14.5">实测于 ecs 8×H20 与 target_p 4×GB200，单线程 pointer chase（1 GiB 随机环，512 B 步长）</text>

  <g font-family="sans-serif">
    <!-- 刻度 -->
    <line x1="300" y1="130" x2="300" y2="600" stroke="#2b4a63" stroke-width="1"/>
    <g stroke="#1b3346" stroke-width="1">
      <line x1="452" y1="130" x2="452" y2="600"/><line x1="604" y1="130" x2="604" y2="600"/>
      <line x1="756" y1="130" x2="756" y2="600"/><line x1="908" y1="130" x2="908" y2="600"/>
      <line x1="1060" y1="130" x2="1060" y2="600"/>
    </g>
    <g fill="#5f7f96" font-size="12.5" text-anchor="middle">
      <text x="300" y="124">0</text><text x="452" y="124">1000</text><text x="604" y="124">2000</text>
      <text x="756" y="124">3000</text><text x="908" y="124">4000</text><text x="1060" y="124">5000</text>
    </g>
    <text x="680" y="104" text-anchor="middle" fill="#8fb8d6" font-size="13.5">GPU cycle</text>

    <!-- ===== H20 ===== -->
    <rect x="40" y="146" width="240" height="196" rx="14" fill="#173f59" stroke="#65d0ff"/>
    <text x="160" y="180" text-anchor="middle" fill="#82dcff" font-size="21" font-weight="700">H20 (SM90)</text>
    <text x="160" y="206" text-anchor="middle" fill="white" font-size="13.5">78 SM @ 1.98 GHz</text>
    <text x="160" y="232" text-anchor="middle" fill="#bce7f7" font-size="13">896 FLOP/cycle/SM</text>
    <text x="160" y="264" text-anchor="middle" fill="#7fd4ff" font-size="14">延迟 / 计算 = 0.14</text>
    <text x="160" y="292" text-anchor="middle" fill="#9bf3c0" font-size="15" font-weight="700">余量充足</text>
    <text x="160" y="320" text-anchor="middle" fill="#bce7f7" font-size="13">需要 stage ≈ 2</text>

    <rect x="300" y="152" width="6" height="24" rx="2" fill="#8fb8d6"/>
    <text x="316" y="170" fill="#8fb8d6" font-size="13">L1  38.9 cycle</text>
    <rect x="300" y="186" width="48" height="24" rx="3" fill="#a87c2a"/>
    <text x="358" y="204" fill="#c9a05a" font-size="13">L2  316.8 cycle</text>
    <rect x="300" y="220" width="103" height="24" rx="3" fill="#e0a12f"/>
    <text x="413" y="238" fill="#ffd066" font-size="13.5" font-weight="700">HBM  674.8 cycle  (340.8 ns)</text>
    <rect x="300" y="262" width="712" height="34" rx="4" fill="#2f7a52"/>
    <text x="316" y="284" fill="white" font-size="14" font-weight="700">单 tile MMA 计算  4681 cycle</text>
    <text x="1024" y="284" fill="#9bf3c0" font-size="13">128×256×64</text>
    <line x1="403" y1="256" x2="403" y2="302" stroke="#ffd066" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="700" y="322" text-anchor="middle" fill="#69c78f" font-size="13">绿条远长于黄线：一次 MMA 就能盖住整个 HBM 往返</text>

    <!-- ===== GB200 ===== -->
    <rect x="40" y="380" width="240" height="196" rx="14" fill="#3a2b52" stroke="#c39bff"/>
    <text x="160" y="414" text-anchor="middle" fill="#ddc6ff" font-size="21" font-weight="700">GB200 (SM100)</text>
    <text x="160" y="440" text-anchor="middle" fill="white" font-size="13.5">152 SM @ 2.06 GHz</text>
    <text x="160" y="466" text-anchor="middle" fill="#d3bdf0" font-size="13">7290 FLOP/cycle/SM</text>
    <text x="160" y="498" text-anchor="middle" fill="#c9a6ff" font-size="14">延迟 / 计算 = 1.44</text>
    <text x="160" y="526" text-anchor="middle" fill="#ffb3c1" font-size="15" font-weight="700">同 tile 已经不够藏</text>
    <text x="160" y="554" text-anchor="middle" fill="#d3bdf0" font-size="13">需要 stage ≥ 3 或更大 tile</text>

    <rect x="300" y="386" width="6" height="24" rx="2" fill="#8fb8d6"/>
    <text x="316" y="404" fill="#8fb8d6" font-size="13">L1  38.9 cycle</text>
    <rect x="300" y="420" width="58" height="24" rx="3" fill="#a87c2a"/>
    <text x="368" y="438" fill="#c9a05a" font-size="13">L2  381.8 cycle</text>
    <rect x="300" y="454" width="126" height="24" rx="3" fill="#e0a12f"/>
    <text x="436" y="472" fill="#ffd066" font-size="13.5" font-weight="700">HBM  826.0 cycle  (400.6 ns)</text>
    <rect x="300" y="496" width="87" height="34" rx="4" fill="#2f7a52"/>
    <text x="399" y="518" fill="white" font-size="14" font-weight="700">单 tile MMA  575 cycle</text>
    <text x="580" y="518" fill="#9bf3c0" font-size="13">同样 128×256×64</text>
    <line x1="426" y1="490" x2="426" y2="536" stroke="#ffd066" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="700" y="556" text-anchor="middle" fill="#ffb3c1" font-size="13">绿条比黄线还短：一次 MMA 盖不住一次 HBM 往返</text>

    <!-- 结论 -->
    <rect x="40" y="620" width="1120" height="132" rx="14" fill="#0d1f30" stroke="#2b4a63"/>
    <text x="70" y="654" fill="#ffd066" font-size="17" font-weight="700">两代之间发生了什么</text>
    <text x="70" y="684" fill="white" font-size="14.5">Tensor Core 每 SM 每周期吞吐涨了 <tspan fill="#9bf3c0" font-weight="700">8.1×</tspan>（896 → 7290 FLOP/cycle），而 HBM 延迟不降反升 <tspan fill="#ffb3c1" font-weight="700">1.22×</tspan>（675 → 826 cycle）。</text>
    <text x="70" y="712" fill="white" font-size="14.5">同一个 tile 能提供的「掩护时间」因此缩水约 <tspan fill="#ffb3c1" font-weight="700">10×</tspan>。这是 Blackwell 必须引入 TMEM、CTA pair 和更大 tile 的直接原因：</text>
    <text x="70" y="738" fill="#8fb8d6" font-size="14.5">不是为了「算得更快」，而是为了把 t_c 拉回到足以掩盖 t_m 的量级，让流水线还能成立。</text>
  </g>
</svg>
