<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc" data-doc="qsa-qblock-vs-minimax-msa">
  <title id="title">QSA 共享路由与 MSA 路由转置</title><desc id="desc">用稀疏邻接矩阵展示 QSA 强制连续 Query 行相同，而 MSA 保留任意行后转置为 K block 到 Query 的 CSR。</desc>
  <defs><marker id="a" markerWidth="11" markerHeight="11" refX="10" refY="3" orient="auto"><path d="M0 0L0 6L10 3Z" fill="#475569"/></marker><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".14"/></filter><style>.t{font:700 34px sans-serif;fill:#0f172a}.h{font:700 24px sans-serif;fill:#0f172a}.l{font:600 17px sans-serif;fill:#1e293b}.sm{font:500 15px sans-serif;fill:#475569}.m{font:600 14px ui-monospace,monospace;fill:#1e293b}.arr{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1800" height="1100" fill="#f8fafc"/><text x="900" y="55" text-anchor="middle" class="t">稀疏路由矩阵 A[q,k]：QSA 约束“行”，MSA 转置“列”</text>
  <g transform="translate(70,120)"><rect width="760" height="900" rx="24" fill="#fff" stroke="#3b82f6" stroke-width="3" filter="url(#s)"/><text x="380" y="48" text-anchor="middle" class="h">QSA：让同一 Q-block 的行完全相同</text><text x="380" y="78" text-anchor="middle" class="sm">蓝色方块表示选择了该 KV token；Bq=4</text>
    <g transform="translate(110,130)"><text x="250" y="-25" text-anchor="middle" class="l">token-level adjacency A[8,8]</text><path d="M0 0H464M0 0V464" stroke="#cbd5e1"/><path d="M0 58H464M58 0V464" stroke="#cbd5e1"/><path d="M0 116H464M116 0V464" stroke="#cbd5e1"/><path d="M0 174H464M174 0V464" stroke="#cbd5e1"/><path d="M0 232H464M232 0V464" stroke="#cbd5e1"/><path d="M0 290H464M290 0V464" stroke="#cbd5e1"/><path d="M0 348H464M348 0V464" stroke="#cbd5e1"/><path d="M0 406H464M406 0V464" stroke="#cbd5e1"/><path d="M0 464H464M464 0V464" stroke="#cbd5e1"/><g class="m"><text x="29" y="-7" text-anchor="middle">k0</text><text x="-13" y="35" text-anchor="end">q0</text><text x="87" y="-7" text-anchor="middle">k1</text><text x="-13" y="93" text-anchor="end">q1</text><text x="145" y="-7" text-anchor="middle">k2</text><text x="-13" y="151" text-anchor="end">q2</text><text x="203" y="-7" text-anchor="middle">k3</text><text x="-13" y="209" text-anchor="end">q3</text><text x="261" y="-7" text-anchor="middle">k4</text><text x="-13" y="267" text-anchor="end">q4</text><text x="319" y="-7" text-anchor="middle">k5</text><text x="-13" y="325" text-anchor="end">q5</text><text x="377" y="-7" text-anchor="middle">k6</text><text x="-13" y="383" text-anchor="end">q6</text><text x="435" y="-7" text-anchor="middle">k7</text><text x="-13" y="441" text-anchor="end">q7</text></g>
      <g fill="#2563eb"><rect x="66" y="8" width="42" height="42" rx="6"/><rect x="240" y="8" width="42" height="42" rx="6"/><rect x="356" y="8" width="42" height="42" rx="6"/><rect x="66" y="66" width="42" height="42" rx="6"/><rect x="240" y="66" width="42" height="42" rx="6"/><rect x="356" y="66" width="42" height="42" rx="6"/><rect x="66" y="124" width="42" height="42" rx="6"/><rect x="240" y="124" width="42" height="42" rx="6"/><rect x="356" y="124" width="42" height="42" rx="6"/><rect x="66" y="182" width="42" height="42" rx="6"/><rect x="240" y="182" width="42" height="42" rx="6"/><rect x="356" y="182" width="42" height="42" rx="6"/></g><g fill="#60a5fa"><rect x="8" y="240" width="42" height="42" rx="6"/><rect x="298" y="240" width="42" height="42" rx="6"/><rect x="414" y="240" width="42" height="42" rx="6"/><rect x="8" y="298" width="42" height="42" rx="6"/><rect x="298" y="298" width="42" height="42" rx="6"/><rect x="414" y="298" width="42" height="42" rx="6"/><rect x="8" y="356" width="42" height="42" rx="6"/><rect x="298" y="356" width="42" height="42" rx="6"/><rect x="414" y="356" width="42" height="42" rx="6"/><rect x="8" y="414" width="42" height="42" rx="6"/><rect x="298" y="414" width="42" height="42" rx="6"/><rect x="414" y="414" width="42" height="42" rx="6"/></g>
      <rect x="-7" y="-7" width="478" height="246" rx="10" fill="none" stroke="#2563eb" stroke-width="4"/><rect x="-7" y="225" width="478" height="246" rx="10" fill="none" stroke="#60a5fa" stroke-width="4"/>
    </g>
    <g transform="translate(75,655)"><rect width="610" height="170" rx="16" fill="#eff6ff" stroke="#3b82f6"/><text x="305" y="35" text-anchor="middle" class="l">执行时不需要反向索引</text><text x="35" y="72" class="m">Q0 rows q0..q3 → 一套 {k1,k4,k6}</text><text x="35" y="104" class="m">Q1 rows q4..q7 → 一套 {k0,k5,k7}</text><text x="35" y="141" class="sm">program 天然知道：连续 Bq 个 Q 共享全部 selected K/V</text></g>
  </g>
  <g transform="translate(970,120)"><rect width="760" height="900" rx="24" fill="#fff" stroke="#8b5cf6" stroke-width="3" filter="url(#s)"/><text x="380" y="48" text-anchor="middle" class="h">MSA：行保持独立，把矩阵转置成 K2Q</text><text x="380" y="78" text-anchor="middle" class="sm">紫色方块表示 Query 选择了该 KV block</text>
    <g transform="translate(70,135)"><text x="160" y="-25" text-anchor="middle" class="l">Q2K A[8,4]</text><path d="M0 0H320" stroke="#cbd5e1"/><path d="M0 50H320" stroke="#cbd5e1"/><path d="M0 100H320" stroke="#cbd5e1"/><path d="M0 150H320" stroke="#cbd5e1"/><path d="M0 200H320" stroke="#cbd5e1"/><path d="M0 250H320" stroke="#cbd5e1"/><path d="M0 300H320" stroke="#cbd5e1"/><path d="M0 350H320" stroke="#cbd5e1"/><path d="M0 400H320" stroke="#cbd5e1"/><path d="M0 0V400" stroke="#cbd5e1"/><path d="M80 0V400" stroke="#cbd5e1"/><path d="M160 0V400" stroke="#cbd5e1"/><path d="M240 0V400" stroke="#cbd5e1"/><path d="M320 0V400" stroke="#cbd5e1"/><g class="m"><text x="40" y="-7" text-anchor="middle">K0</text><text x="120" y="-7" text-anchor="middle">K1</text><text x="200" y="-7" text-anchor="middle">K2</text><text x="280" y="-7" text-anchor="middle">K3</text><text x="-12" y="31" text-anchor="end">q0</text><text x="-12" y="81" text-anchor="end">q1</text><text x="-12" y="131" text-anchor="end">q2</text><text x="-12" y="181" text-anchor="end">q3</text><text x="-12" y="231" text-anchor="end">q4</text><text x="-12" y="281" text-anchor="end">q5</text><text x="-12" y="331" text-anchor="end">q6</text><text x="-12" y="381" text-anchor="end">q7</text></g><g fill="#8b5cf6"><rect x="14" y="7" width="52" height="36" rx="6"/><rect x="174" y="7" width="52" height="36" rx="6"/><rect x="14" y="57" width="52" height="36" rx="6"/><rect x="254" y="57" width="52" height="36" rx="6"/><rect x="94" y="107" width="52" height="36" rx="6"/><rect x="174" y="107" width="52" height="36" rx="6"/><rect x="14" y="157" width="52" height="36" rx="6"/><rect x="174" y="157" width="52" height="36" rx="6"/><rect x="94" y="207" width="52" height="36" rx="6"/><rect x="254" y="207" width="52" height="36" rx="6"/><rect x="14" y="257" width="52" height="36" rx="6"/><rect x="94" y="257" width="52" height="36" rx="6"/><rect x="174" y="307" width="52" height="36" rx="6"/><rect x="254" y="307" width="52" height="36" rx="6"/><rect x="14" y="357" width="52" height="36" rx="6"/><rect x="174" y="357" width="52" height="36" rx="6"/></g></g>
    <path d="M425 335H510" class="arr"/><text x="466" y="315" text-anchor="middle" class="sm">transpose / CSR</text>
    <g transform="translate(530,135)"><text x="95" y="-25" text-anchor="middle" class="l">K2Q CSR</text><rect width="180" height="400" rx="14" fill="#faf5ff" stroke="#8b5cf6"/><g class="m"><text x="18" y="47">K0:</text><text x="18" y="75">q0 q1 q3</text><text x="18" y="101">q5 q7</text><path d="M12 118H168" stroke="#c4b5fd"/><text x="18" y="155">K1:</text><text x="18" y="183">q2 q4 q5</text><path d="M12 200H168" stroke="#c4b5fd"/><text x="18" y="237">K2:</text><text x="18" y="265">q0 q2 q3</text><text x="18" y="291">q6 q7</text><path d="M12 308H168" stroke="#c4b5fd"/><text x="18" y="345">K3:</text><text x="18" y="373">q1 q4 q6</text></g></g>
    <path d="M620 548V620" class="arr"/>
    <g transform="translate(75,650)"><rect width="610" height="175" rx="16" fill="#faf5ff" stroke="#8b5cf6"/><text x="305" y="35" text-anchor="middle" class="l">执行时按 CSR row 读取 KV block</text><text x="35" y="72" class="m">load K0/V0 once → compute q0,q1,q3,q5,q7</text><text x="35" y="104" class="m">load K2/V2 once → compute q0,q2,q3,q6,q7</text><text x="35" y="141" class="sm">Query 可以来自任意位置，但一个 Query 会产生多个 block partial</text></g>
  </g>
</svg>
