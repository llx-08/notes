<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="720" viewBox="0 0 1480 720" role="img" aria-labelledby="title desc">
  <title id="title">LSE 加权合并在数学上精确等价于全局 softmax</title>
  <desc id="desc">各 rank 只掌握不相交的 key 子集。用局部 log-sum-exp 还原分子，再用全局 LSE 做分母，加权求和得到与未切分完全相同的 attention 输出。</desc>
  <defs>
    <style>
      .title { font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif; fill:#0f172a; }
      .h { font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif; fill:#0f172a; }
      .t { font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif; fill:#334155; }
      .s { font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif; fill:#475569; }
      .mono { font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace; fill:#0f172a; }
      .wh { font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif; fill:#fff; }
      .eq { font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace; fill:#0f172a; }
    </style>
  </defs>
  <rect width="1480" height="720" fill="#f8fafc"/>
  <text x="40" y="46" class="title">LSE 加权是精确的：局部 softmax 乘上质量占比</text>
  <text x="40" y="74" class="s">S_n 不相交且并集完备 =&gt; logsumexp(lse_n) 就是全局 softmax 分母。合并不是近似，残差只来自浮点舍入。</text>

  <rect x="40" y="100" width="700" height="360" rx="16" fill="#fff" stroke="#cbd5e1"/>
  <text x="60" y="134" class="h">把 softmax 质量看成各 rank 抢到的概率质量</text>
  <text x="60" y="160" class="s">沿用正文验算：rank0 scores=[1,2]，rank1 scores=[3]</text>

  <rect x="80" y="190" width="200" height="28" rx="6" fill="#2563eb"/>
  <text x="180" y="209" text-anchor="middle" class="wh">rank0  sum(exp) = 10.11</text>
  <rect x="280" y="190" width="400" height="28" rx="6" fill="#059669"/>
  <text x="480" y="209" text-anchor="middle" class="wh">rank1  sum(exp) = 20.09</text>
  <text x="80" y="244" class="t">全局 sum(exp) = 30.19    lse_g = ln(30.19) = 3.408</text>

  <text x="80" y="286" class="mono">factor0 = exp(lse0 - lse_g) = 10.11 / 30.19 = 0.335</text>
  <text x="80" y="312" class="mono">factor1 = exp(lse1 - lse_g) = 20.09 / 30.19 = 0.665</text>
  <text x="80" y="338" class="h">factor0 + factor1 = 1</text>
  <text x="80" y="366" class="t">权重就是各 rank 在全局 softmax 里占的质量。</text>
  <text x="80" y="392" class="t">score 更大的分片（这里是 rank1 的 e^3）自然拿到更大权重。</text>
  <text x="80" y="428" class="s">空分片必须把 lse 填成 -inf，否则垃圾值会污染 logsumexp。</text>
  <text x="80" y="450" class="s">factor = 0 的输出要显式写 0，避免 0 * inf = NaN。</text>

  <rect x="760" y="100" width="680" height="360" rx="16" fill="#fff" stroke="#7c3aed"/>
  <text x="780" y="134" class="h">还原分子，再除以全局分母</text>
  <text x="780" y="178" class="eq">o_n * exp(lse_n) = sum_{j in S_n} exp(s_j) v_j</text>
  <text x="780" y="214" class="eq">lse_g = log sum_n exp(lse_n) = log sum_j exp(s_j)</text>
  <text x="780" y="262" class="eq">sum_n o_n * exp(lse_n - lse_g)</text>
  <text x="780" y="292" class="eq">= sum_j exp(s_j) v_j  /  sum_j exp(s_j)</text>
  <text x="780" y="322" class="eq">= o*</text>
  <rect x="780" y="350" width="620" height="86" rx="10" fill="#f5f3ff"/>
  <text x="800" y="382" class="t">FlashAttention split-K / flash-decoding 用的就是这套公式。</text>
  <text x="800" y="408" class="t">DCP 只是把 split 从「一卡内不同 CTA」换成「不同 GPU」。</text>
  <text x="800" y="434" class="t">reduce 从 shared memory 变成 NCCL，数学不变。</text>

  <rect x="40" y="480" width="1400" height="210" rx="16" fill="#fff" stroke="#cbd5e1"/>
  <text x="60" y="514" class="h">同一组数字走完合并</text>
  <text x="60" y="548" class="mono">rank0: o0 = 1.731    rank1: o1 = 10.0</text>
  <text x="60" y="576" class="mono">合并 = 1.731 * 0.335 + 10.0 * 0.665 = 7.232</text>
  <text x="60" y="604" class="mono">真值 = (e^1*1 + e^2*2 + e^3*10) / (e^1+e^2+e^3) = 7.232</text>
  <rect x="60" y="624" width="1360" height="46" rx="10" fill="#ecfdf5" stroke="#059669"/>
  <text x="80" y="653" class="h">跨 rank 只交换 lse（每 head 一个 fp32）。value 留在本地，靠 ReduceScatter / A2A 把已经缩放过的 o_n 加起来。</text>
</svg>
