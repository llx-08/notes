<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="18" fill="#f8fafc"/>
  <text x="32" y="42" font-family="Arial, PingFang SC, sans-serif" font-size="24" font-weight="700" fill="#172033">Barex Send 大消息的三阶段协议</text>
<text x="180" y="90" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#2563eb">Sender A</text>
<text x="1020" y="90" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#059669">Receiver B</text>
<line x1="180" y1="115" x2="180" y2="650" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="1020" y1="115" x2="1020" y2="650" stroke="#059669" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="180" y1="175" x2="1020" y2="175" stroke="#94a3b8" stroke-width="2.5"  marker-end="url(#arrow)"/>
<text x="600" y="167" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" fill="#526078">1. SEND LARGE_MSG_META(len, opaque ptr)</text>
<rect x="825" y="220" width="270" height="65" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="257.5" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="14" fill="#172033">分配 registered recv buffer</text>
<line x1="1020" y1="320" x2="180" y2="320" stroke="#94a3b8" stroke-width="2.5"  marker-end="url(#arrow)"/>
<text x="600" y="312" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" fill="#526078">2. SEND addr/rkey/index</text>
<rect x="105" y="365" width="270" height="65" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="402.5" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="14" fill="#172033">构造 payload + x_msg_header</text>
<line x1="180" y1="470" x2="1020" y2="470" stroke="#94a3b8" stroke-width="2.5"  marker-end="url(#arrow)"/>
<text x="600" y="462" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" fill="#526078">3. RDMA WRITE WITH IMM(index)</text>
<rect x="825" y="515" width="270" height="75" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="549" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="14" fill="#172033">按 index 找 buffer</text>
  <text x="960" y="566" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="14" fill="#172033">OnRecvCall(payload)</text>
<line x1="1020" y1="620" x2="180" y2="620" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="600" y="612" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" fill="#526078">可选 response / 下一条消息</text>
<text x="1178" y="706" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#526078">NCCL · PCIe · RDMA · Barex learning notes</text></svg>