<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="860" viewBox="0 0 1520 860" role="img" aria-labelledby="title desc">
  <title id="title">AllGather 的是 Q 激活，不是 q_proj 权重；qrep 才复制权重</title>
  <desc id="desc">默认路径下每张卡只存自己那份 TP 切过的 q_proj 权重。AllGather 只把当前 decode token 的 Q 激活沿 head 维凑齐，用完即可丢掉。VLLM_DCP_Q_REPLICATE 才在 DCP group 内复制 q_proj 权重，换掉这次 AllGather。</desc>
  <defs>
    <style>
      .title { font:700 26px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif; fill:#0f172a; }
      .panel { font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif; fill:#fff; }
      .h { font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif; fill:#0f172a; }
      .t { font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif; fill:#334155; }
      .s { font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif; fill:#475569; }
      .mono { font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace; fill:#0f172a; }
      .wh { font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif; fill:#fff; }
    </style>
  </defs>
  <rect width="1520" height="860" fill="#f8fafc"/>
  <text x="40" y="44" class="title">AllGather 凑齐的是 Q 激活，权重默认仍按 TP 切开</text>
  <text x="40" y="72" class="s">DCP 是 TP 的子群，所以 Q head 本来就按 TP 分布。Decode 要在每张卡上拿「全组 Q heads x 本地 KV」算 partial attention，缺的那半 Q 可以现 gather，也可以把权重复制一份自己算。</text>

  <rect x="40" y="96" width="710" height="40" rx="12" fill="#64748b"/>
  <text x="395" y="122" text-anchor="middle" class="panel">默认：权重 TP 切开，AllGather 激活</text>
  <rect x="770" y="96" width="710" height="40" rx="12" fill="#2563eb"/>
  <text x="1125" y="122" text-anchor="middle" class="panel">VLLM_DCP_Q_REPLICATE=1：组内复制权重</text>

  <rect x="40" y="152" width="710" height="430" rx="16" fill="#fff" stroke="#cbd5e1"/>
  <g transform="translate(60,176)">
    <text x="0" y="16" class="h">常驻显存：q_proj / q_b_proj 权重</text>
    <rect x="0" y="32" width="310" height="52" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="155" y="54" text-anchor="middle" class="h">rank0  权重 h0-15</text>
    <text x="155" y="74" text-anchor="middle" class="s">只有自己的 TP shard</text>
    <rect x="330" y="32" width="310" height="52" rx="8" fill="#d1fae5" stroke="#059669"/>
    <text x="485" y="54" text-anchor="middle" class="h">rank1  权重 h16-31</text>
    <text x="485" y="74" text-anchor="middle" class="s">只有自己的 TP shard</text>
    <text x="0" y="108" class="t">AllGather 之后权重不会变大。对面那份 q_proj 从不搬过来。</text>

    <text x="0" y="148" class="h">临时激活：当前 1 个 decode token 的 Q</text>
    <rect x="0" y="164" width="310" height="70" rx="8" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="155" y="190" text-anchor="middle" class="h">GEMM 后</text>
    <text x="155" y="214" text-anchor="middle" class="mono">[1, 16, 576]  ~18 KB</text>
    <rect x="330" y="164" width="310" height="70" rx="8" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="485" y="190" text-anchor="middle" class="h">AllGather 后</text>
    <text x="485" y="214" text-anchor="middle" class="mono">[1, 32, 576]  ~37 KB</text>
    <text x="0" y="260" class="t">多出来的那 16 个 head 是激活，不是权重。本步用完即可丢掉。</text>
    <text x="0" y="284" class="t">DeepSeek-V3 tp=8 dcp=2：多占约 18 KB，不是几百 MB。</text>
    <text x="0" y="320" class="h">为什么必须 AllGather 激活？</text>
    <text x="0" y="344" class="t">本地只有一半 Q head，却要对本地那一半 KV 算全部 head 的 partial softmax。</text>
    <text x="0" y="368" class="t">缺的是这一步的 Q 向量，不是缺一份常驻权重。</text>
    <text x="0" y="392" class="s">o_proj / v_up 权重始终按 TP 切开。ReduceScatter 之后激活也切回 H_local。</text>
  </g>

  <rect x="770" y="152" width="710" height="430" rx="16" fill="#fff" stroke="#2563eb"/>
  <g transform="translate(790,176)">
    <text x="0" y="16" class="h">常驻显存：组内两份相同的 q_proj 权重</text>
    <rect x="0" y="32" width="310" height="52" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="155" y="54" text-anchor="middle" class="h">rank0  权重 h0-31</text>
    <text x="155" y="74" text-anchor="middle" class="s">整组 heads</text>
    <rect x="330" y="32" width="310" height="52" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="485" y="54" text-anchor="middle" class="h">rank1  权重 h0-31</text>
    <text x="485" y="74" text-anchor="middle" class="s">和 rank0 完全相同</text>
    <text x="0" y="108" class="t">tp_rank = rank // dcp，等于按 DCP group 切，不再按单卡切。</text>

    <text x="0" y="148" class="h">激活：GEMM 直接算出整组 Q，跳过 AllGather</text>
    <rect x="0" y="164" width="640" height="70" rx="8" fill="#ecfdf5" stroke="#059669"/>
    <text x="320" y="190" text-anchor="middle" class="h">本地 GEMM 就得到 [1, 32, 576]</text>
    <text x="320" y="214" text-anchor="middle" class="s">decode 不再 AllGather(Q)；prefill 用 _local_view() 切回 16 head</text>

    <text x="0" y="260" class="h">代价（常驻，每层都在）</text>
    <text x="0" y="284" class="t">q_b_proj 权重在组内复制 dcp 倍。DeepSeek-V3 tp=8 dcp=2：</text>
    <text x="0" y="308" class="mono">每层多约 9.4 MB  x  61 层  ~  0.57 GB / GPU</text>
    <text x="0" y="332" class="t">GEMM 也多算 dcp 倍。decode 时 B=1 通常划算；prefill 会先算出整组 head 再切掉。</text>
    <text x="0" y="368" class="h">所以默认关着：用 18 KB 的一次性 AllGather，换几百 MB 常驻权重。</text>
    <text x="0" y="392" class="s">decode 很 latency-bound、NCCL 启动开销明显时，再开 qrep 用通信换计算和显存。</text>
  </g>

  <rect x="40" y="604" width="1440" height="226" rx="16" fill="#fff" stroke="#cbd5e1"/>
  <text x="60" y="636" class="h">和 KV cache 显存不是一笔账</text>
  <text x="60" y="664" class="t">DCP 省的是 KV cache：序列切开之后每卡只留 1/dcp，长上下文下是 GB 级。Q AllGather 争的是「要不要为了跳过一次小 collective，把 q_proj 权重复制一份」。</text>
  <text x="60" y="692" class="t">KV 不能同样「每张卡放全量」——那就回到纯 TP 的冗余，DCP 没了。Q 可以复制，是因为 Q 没有 cache，每步现场从 hidden 投影，权重复制只影响 q_proj 这一层。</text>
  <text x="60" y="720" class="t">o_proj 仍然按 TP 切开。AllGather 把 Q head 临时撑开，ReduceScatter 把 attention 输出连同 head 维一起收回，下游线性层的权重布局完全不用改。</text>
  <text x="60" y="748" class="s">GQA 的 q 通常和 k/v 融在 qkv_proj 里，社区 qrep 目前主要接在 MLA 的 q_proj / q_b_proj 上。GQA decode 仍然 AllGather 的是 query 激活。</text>
  <text x="60" y="776" class="s">PCP&gt;1 时 qrep 直接禁用：prefill 的 Q 很长，复制权重还要多算大 GEMM，不划算。</text>
</svg>
