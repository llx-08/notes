<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a1a">饱和实验：驱逐扔掉 442 GB，重算率一动不动</text>
  <text x="450" y="46" text-anchor="middle" font-size="12" fill="#666">不重启不缩容，靠累积对话让 store 自然溢出跨过 0.90 水位</text>

  <!-- axes -->
  <line x1="80" y1="240" x2="820" y2="240" stroke="#999"/>
  <line x1="80" y1="80" x2="80" y2="240" stroke="#999"/>
  <text x="70" y="86" text-anchor="end" font-size="10" fill="#666">700</text>
  <text x="70" y="122" text-anchor="end" font-size="10" fill="#666">630</text>
  <text x="70" y="243" text-anchor="end" font-size="10" fill="#666">350</text>
  <text x="46" y="165" text-anchor="middle" font-size="10.5" fill="#666" transform="rotate(-90 46 165)">store GB</text>

  <!-- watermark line -->
  <line x1="80" y1="122" x2="820" y2="122" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="826" y="119" font-size="10.5" font-weight="600" fill="#a03024">0.90 水位 = 630 GB</text>

  <!-- store curve: 354 443 531 620 614 608 601 627 620 -->
  <polyline points="110,240 200,190 290,140 380,89 470,95 560,101 650,109 740,84 800,90"
            fill="none" stroke="#48945f" stroke-width="2.5"/>
  <g fill="#48945f">
    <circle cx="110" cy="240" r="4"/><circle cx="200" cy="190" r="4"/><circle cx="290" cy="140" r="4"/>
    <circle cx="380" cy="89" r="4"/><circle cx="470" cy="95" r="4"/><circle cx="560" cy="101" r="4"/>
    <circle cx="650" cy="109" r="4"/><circle cx="740" cy="84" r="4"/><circle cx="800" cy="90" r="4"/>
  </g>
  <text x="240" y="176" font-size="10.5" fill="#1f5c33">每臂 +88 GB（独立 salt）</text>
  <text x="600" y="140" font-size="10.5" font-weight="600" fill="#1f5c33">稳态：驱逐量精确抵消新写入</text>

  <!-- arm labels + eviction -->
  <g font-size="10" text-anchor="middle" fill="#555">
    <text x="155" y="258">臂1</text><text x="245" y="258">臂2</text><text x="335" y="258">臂3</text>
    <text x="425" y="258">臂4</text><text x="515" y="258">臂5</text><text x="605" y="258">臂6</text>
    <text x="695" y="258">臂7</text><text x="770" y="258">臂8</text>
  </g>
  <g font-size="10" text-anchor="middle">
    <text x="155" y="274" fill="#999">驱逐 0</text><text x="245" y="274" fill="#999">0</text><text x="335" y="274" fill="#999">0</text>
    <text x="425" y="274" fill="#a03024" font-weight="600">3</text><text x="515" y="274" fill="#a03024" font-weight="600">3</text>
    <text x="605" y="274" fill="#a03024" font-weight="600">3</text><text x="695" y="274" fill="#a03024" font-weight="600">2</text>
    <text x="770" y="274" fill="#a03024" font-weight="600">3</text>
  </g>
  <rect x="382" y="248" width="430" height="30" rx="4" fill="none" stroke="#c0392b" stroke-dasharray="4 3"/>
  <text x="597" y="292" text-anchor="middle" font-size="10.5" font-weight="600" fill="#a03024">驱逐持续激活：累计 14 次、241,619 key、442.39 GB</text>

  <!-- recompute flat line -->
  <text x="80" y="322" font-size="12.5" font-weight="600" fill="#24486e">而重算率（= 驱逐损伤指标）全程贴着 8% 的理论下界</text>
  <line x1="110" y1="344" x2="800" y2="344" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="826" y="341" font-size="10" fill="#a03024">8.0% 下界</text>
  <polyline points="110,344 200,352 290,344 380,352 470,344 560,352 650,352 740,344"
            fill="none" stroke="#24486e" stroke-width="2.5"/>
  <g fill="#24486e" font-size="9.5" text-anchor="middle">
    <circle cx="110" cy="344" r="3.5"/><text x="110" y="368">8%</text>
    <circle cx="200" cy="352" r="3.5"/><text x="200" y="368">7%</text>
    <circle cx="290" cy="344" r="3.5"/><text x="290" y="368">8%</text>
    <circle cx="380" cy="352" r="3.5"/><text x="380" y="368">7%</text>
    <circle cx="470" cy="344" r="3.5"/><text x="470" y="368">8%</text>
    <circle cx="560" cy="352" r="3.5"/><text x="560" y="368">7%</text>
    <circle cx="650" cy="352" r="3.5"/><text x="650" y="368">7%</text>
    <circle cx="740" cy="344" r="3.5"/><text x="740" y="368">8%</text>
  </g>
  <text x="450" y="388" text-anchor="middle" font-size="11" fill="#24486e">跨越水位的全部代价：HBM 87.0→86.8%　store 5.3→5.4%　p50 +15.3 ms (+0.6%)</text>

  <!-- mechanism + caveat -->
  <rect x="70" y="402" width="380" height="86" rx="8" fill="#eaf6ee" stroke="#48945f"/>
  <text x="86" y="422" font-size="12" font-weight="600" fill="#1f5c33">零损伤的机制</text>
  <text x="86" y="440" font-size="10.5" fill="#2d6b42">① 每臂独立 salt → 旧臂数据是 100% 垃圾</text>
  <text x="86" y="456" font-size="10.5" fill="#2d6b42">② 驱逐按 lease_timeout 最早 → 恰好命中垃圾</text>
  <text x="86" y="472" font-size="10.5" fill="#2d6b42">③ 当前臂被持续探测 → 10s 租约续命 → 豁免</text>

  <rect x="466" y="402" width="374" height="86" rx="8" fill="#fdecea" stroke="#c0392b"/>
  <text x="482" y="422" font-size="12" font-weight="600" fill="#a03024">但这是实验设计的自我批评</text>
  <text x="482" y="440" font-size="10.5" fill="#7d2a20">salt 隔离（为让对比干净而引入）恰恰制造了</text>
  <text x="482" y="456" font-size="10.5" fill="#7d2a20">LRU 的理想情况：垃圾严格比工作集更旧。</text>
  <text x="482" y="472" font-size="10.5" font-weight="600" fill="#7d2a20">结论是「这个负载对驱逐不敏感」，不是「LRU 够好」</text>
</svg>
