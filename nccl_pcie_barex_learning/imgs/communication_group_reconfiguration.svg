<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
  </defs>

  <rect width="1400" height="980" rx="20" fill="#f8fafc"/>
  <text x="40" y="46" font-family="Arial, PingFang SC, sans-serif" font-size="27" font-weight="700" fill="#172033">“动态通信组”不是一种操作：四种语义必须分清</text>
  <text x="40" y="76" font-family="Arial, PingFang SC, sans-serif" font-size="15" fill="#526078">所有可靠重配置都需要安全点；新对象构建完成后再切换，不能让一半 rank 使用旧拓扑、一半使用新拓扑</text>

  <rect x="405" y="105" width="590" height="92" rx="14" fill="#ffffff" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <text x="700" y="137" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="18" font-weight="700" fill="#172033">初始 generation E0</text>
  <text x="700" y="166" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="15" fill="#526078">ProcessGroup P / NCCL comm C0 / DeepEP Buffer B0：ranks [0,1,2,3]</text>

  <line x1="700" y1="197" x2="700" y2="230" stroke="#64748b" stroke-width="2.5"/>
  <line x1="180" y1="230" x2="1220" y2="230" stroke="#64748b" stroke-width="2.5"/>
  <line x1="180" y1="230" x2="180" y2="263" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="230" x2="520" y2="263" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="880" y1="230" x2="880" y2="263" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1220" y1="230" x2="1220" y2="263" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="30" y="268" width="300" height="385" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="301" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="17" font-weight="700" fill="#172033">A. 静态子组</text>
  <text x="180" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2563eb">dist.new_group / ncclCommSplit</text>
  <rect x="55" y="355" width="250" height="62" rx="9" fill="#fff" stroke="#93c5fd"/>
  <text x="180" y="380" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#172033">父 P / C0 仍是 [0,1,2,3]</text>
  <text x="180" y="402" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="13" fill="#526078">没有任何成员被增删</text>
  <line x1="180" y1="417" x2="180" y2="447" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="55" y="452" width="250" height="72" rx="9" fill="#dbeafe" stroke="#2563eb"/>
  <text x="180" y="479" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#172033">新 child A = [0,1]</text>
  <text x="180" y="502" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="13" fill="#526078">新 handle；父 handle 可继续存在</text>
  <text x="55" y="558" font-family="Arial, PingFang SC, sans-serif" font-size="13" fill="#526078">用途：TP/DP/EP 划分</text>
  <text x="55" y="583" font-family="Arial, PingFang SC, sans-serif" font-size="13" fill="#526078">限制：只能选当前 world 内 rank</text>
  <text x="55" y="608" font-family="Arial, PingFang SC, sans-serif" font-size="13" fill="#526078">不是扩缩容，也不是故障恢复</text>

  <rect x="365" y="268" width="310" height="385" rx="14" fill="#fff7ed" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="301" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="17" font-weight="700" fill="#172033">B. TorchElastic 作业弹性</text>
  <text x="520" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#d97706">node arrival / departure</text>
  <rect x="390" y="354" width="260" height="55" rx="9" fill="#fff" stroke="#fdba74"/>
  <text x="520" y="387" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#172033">停止所有旧 workers</text>
  <line x1="520" y1="409" x2="520" y2="435" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="390" y="440" width="260" height="55" rx="9" fill="#fff" stroke="#fdba74"/>
  <text x="520" y="473" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#172033">重新 rendezvous / 分配 rank</text>
  <line x1="520" y1="495" x2="520" y2="521" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="390" y="526" width="260" height="76" rx="9" fill="#ffedd5" stroke="#d97706"/>
  <text x="520" y="554" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#172033">generation E1</text>
  <text x="520" y="577" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="13" fill="#526078">例如 [0,1,2,3,4,5]</text>
  <text x="390" y="630" font-family="Arial, PingFang SC, sans-serif" font-size="13" fill="#526078">survivor 也重启；rank 不稳定</text>

  <rect x="710" y="268" width="340" height="385" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <text x="880" y="301" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="17" font-weight="700" fill="#172033">C. NCCL Grow / Shrink</text>
  <text x="880" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#059669">communicator-level reconfiguration</text>
  <rect x="735" y="352" width="290" height="64" rx="9" fill="#fff" stroke="#6ee7b7"/>
  <text x="880" y="378" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#172033">先 quiesce / revoke / abort</text>
  <text x="880" y="400" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="12" fill="#526078">不能留有不匹配的 in-flight collective</text>
  <line x1="880" y1="416" x2="880" y2="444" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="735" y="449" width="290" height="86" rx="9" fill="#d1fae5" stroke="#059669"/>
  <text x="880" y="476" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#172033">返回新 communicator C1</text>
  <text x="880" y="499" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="13" fill="#526078">grow: [0,1,2,3,4,5]</text>
  <text x="880" y="520" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="13" fill="#526078">shrink: 例如 [0,1,2]</text>
  <text x="735" y="568" font-family="Arial, PingFang SC, sans-serif" font-size="13" fill="#526078">不是原地修改 C0；应用切换句柄</text>
  <text x="735" y="593" font-family="Arial, PingFang SC, sans-serif" font-size="13" fill="#526078">不启动进程、不搬模型/专家权重</text>
  <text x="735" y="618" font-family="Arial, PingFang SC, sans-serif" font-size="13" fill="#526078">PyTorch 当前只公开封装 shrink</text>

  <rect x="1085" y="268" width="285" height="385" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="1227" y="301" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="17" font-weight="700" fill="#172033">D. DeepEP</text>
  <text x="1227" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7c3aed">Buffer / ElasticBuffer</text>
  <rect x="1110" y="353" width="235" height="80" rx="9" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="1227" y="378" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#172033">V1 enable_shrink</text>
  <text x="1227" y="400" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="12" fill="#526078">mask peer：不收发</text>
  <text x="1227" y="419" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="12" fill="#526078">group.size/rank 不变</text>
  <rect x="1110" y="456" width="235" height="80" rx="9" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="1227" y="481" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#172033">V2 ElasticBuffer</text>
  <text x="1227" y="503" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="12" fill="#526078">Elastic 指内存灵活性</text>
  <text x="1227" y="522" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="12" fill="#526078">构造时仍固定 rank/size</text>
  <text x="1110" y="571" font-family="Arial, PingFang SC, sans-serif" font-size="13" fill="#526078">完整扩缩容：上层建新 group，</text>
  <text x="1110" y="595" font-family="Arial, PingFang SC, sans-serif" font-size="13" fill="#526078">搬专家并重建 Buffer</text>

  <text x="40" y="703" font-family="Arial, PingFang SC, sans-serif" font-size="18" font-weight="700" fill="#172033">共同的安全切换协议</text>

  <rect x="40" y="730" width="1320" height="160" rx="14" fill="#ffffff" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <g font-family="Arial, PingFang SC, sans-serif">
    <rect x="65" y="765" width="145" height="70" rx="9" fill="#fff7ed" stroke="#d97706"/>
    <text x="137" y="793" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">1. 停止旧 epoch</text>
    <text x="137" y="815" text-anchor="middle" font-size="12" fill="#526078">不再接新任务</text>
    <line x1="210" y1="800" x2="244" y2="800" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="250" y="765" width="145" height="70" rx="9" fill="#fff7ed" stroke="#d97706"/>
    <text x="322" y="793" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">2. 等数据面静止</text>
    <text x="322" y="815" text-anchor="middle" font-size="12" fill="#526078">CUDA/NCCL 安全点</text>
    <line x1="395" y1="800" x2="429" y2="800" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="435" y="765" width="145" height="70" rx="9" fill="#eff6ff" stroke="#2563eb"/>
    <text x="507" y="793" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">3. 建下一代组</text>
    <text x="507" y="815" text-anchor="middle" font-size="12" fill="#526078">PG / NCCL / Buffer</text>
    <line x1="580" y1="800" x2="614" y2="800" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="620" y="765" width="145" height="70" rx="9" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="692" y="793" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">4. 搬状态</text>
    <text x="692" y="815" text-anchor="middle" font-size="12" fill="#526078">权重/专家/路由</text>
    <line x1="765" y1="800" x2="799" y2="800" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="805" y="765" width="145" height="70" rx="9" fill="#ecfdf5" stroke="#059669"/>
    <text x="877" y="793" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">5. 验证 + barrier</text>
    <text x="877" y="815" text-anchor="middle" font-size="12" fill="#526078">所有成员一致</text>
    <line x1="950" y1="800" x2="984" y2="800" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="990" y="765" width="145" height="70" rx="9" fill="#ecfdf5" stroke="#059669"/>
    <text x="1062" y="793" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">6. Commit E1</text>
    <text x="1062" y="815" text-anchor="middle" font-size="12" fill="#526078">统一切新句柄</text>
    <line x1="1135" y1="800" x2="1169" y2="800" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="1175" y="765" width="155" height="70" rx="9" fill="#f1f5f9" stroke="#64748b"/>
    <text x="1252" y="793" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">7. 释放旧资源</text>
    <text x="1252" y="815" text-anchor="middle" font-size="12" fill="#526078">确认无人引用 C0/B0</text>
  </g>

  <rect x="190" y="915" width="1020" height="42" rx="9" fill="#fef2f2" stroke="#dc2626"/>
  <text x="700" y="942" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#991b1b">危险模式：rank 0～2 已使用 E1，而 rank 3 仍使用 E0；collective 的成员、ring、分块和完成条件将不一致</text>
</svg>
