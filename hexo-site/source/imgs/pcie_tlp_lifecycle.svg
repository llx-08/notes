<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
  </defs>

  <rect width="1200" height="980" rx="18" fill="#f8fafc"/>
  <text x="32" y="42" font-family="Arial, PingFang SC, sans-serif" font-size="24" font-weight="700" fill="#172033">一次 PCIe 任务如何变成 TLP，并在线路上传输</text>
  <text x="32" y="70" font-family="Arial, PingFang SC, sans-serif" font-size="14" fill="#526078">以设备 DMA 为例；左侧是生命周期，右侧是 Gen3–Gen5 Non-FLIT 模式下的包结构</text>

  <text x="42" y="105" font-family="Arial, PingFang SC, sans-serif" font-size="18" font-weight="700" fill="#172033">A. 从软件意图到硬件事务</text>

  <rect x="42" y="125" width="620" height="66" rx="11" fill="#fff7ed" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="75" cy="158" r="17" fill="#d97706"/>
  <text x="75" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">1</text>
  <text x="105" y="151" font-family="Arial, PingFang SC, sans-serif" font-size="16" font-weight="700" fill="#172033">应用 / 驱动产生意图</text>
  <text x="105" y="174" font-family="Arial, PingFang SC, sans-serif" font-size="13" fill="#526078">例如：发送 8 MiB、读 NVMe、让 NIC DMA 一块 buffer</text>

  <line x1="352" y1="191" x2="352" y2="214" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="42" y="218" width="620" height="66" rx="11" fill="#ffffff" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="75" cy="251" r="17" fill="#d97706"/>
  <text x="75" y="257" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">2</text>
  <text x="105" y="244" font-family="Arial, PingFang SC, sans-serif" font-size="16" font-weight="700" fill="#172033">写设备专用 descriptor / WQE</text>
  <text x="105" y="267" font-family="Arial, PingFang SC, sans-serif" font-size="13" fill="#526078">地址、长度、opcode、key、flags；它不是 PCIe 标准 TLP</text>

  <line x1="352" y1="284" x2="352" y2="307" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="42" y="311" width="620" height="66" rx="11" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="75" cy="344" r="17" fill="#2563eb"/>
  <text x="75" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">3</text>
  <text x="105" y="337" font-family="Arial, PingFang SC, sans-serif" font-size="16" font-weight="700" fill="#172033">敲 doorbell：CPU 向设备 BAR 做 MMIO Store</text>
  <text x="105" y="360" font-family="Arial, PingFang SC, sans-serif" font-size="13" fill="#526078">Root Complex 把这次 store 编成一个 Posted Memory Write TLP</text>

  <line x1="352" y1="377" x2="352" y2="400" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="42" y="404" width="620" height="66" rx="11" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="75" cy="437" r="17" fill="#059669"/>
  <text x="75" y="443" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">4</text>
  <text x="105" y="430" font-family="Arial, PingFang SC, sans-serif" font-size="16" font-weight="700" fill="#172033">Endpoint 收到 doorbell，DMA Engine 取任务</text>
  <text x="105" y="453" font-family="Arial, PingFang SC, sans-serif" font-size="13" fill="#526078">可能先 DMA-read descriptor，再读取源 payload 或准备写目标</text>

  <line x1="352" y1="470" x2="352" y2="493" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="42" y="497" width="620" height="66" rx="11" fill="#eef2ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="75" cy="530" r="17" fill="#7c3aed"/>
  <text x="75" y="536" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">5</text>
  <text x="105" y="523" font-family="Arial, PingFang SC, sans-serif" font-size="16" font-weight="700" fill="#172033">Transaction Layer 生成一个或多个 TLP</text>
  <text x="105" y="546" font-family="Arial, PingFang SC, sans-serif" font-size="13" fill="#526078">Memory Read / Memory Write / Completion；受 MPS、MRRS 等限制</text>

  <line x1="352" y1="563" x2="352" y2="586" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="42" y="590" width="620" height="66" rx="11" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="75" cy="623" r="17" fill="#0f766e"/>
  <text x="75" y="629" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">6</text>
  <text x="105" y="616" font-family="Arial, PingFang SC, sans-serif" font-size="16" font-weight="700" fill="#172033">Data Link + Physical Layer 封装并发送</text>
  <text x="105" y="639" font-family="Arial, PingFang SC, sans-serif" font-size="13" fill="#526078">加 Sequence Number/LCRC，再编码、串行化并 striping 到 xN lanes</text>

  <line x1="352" y1="656" x2="352" y2="679" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="42" y="683" width="620" height="66" rx="11" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="75" cy="716" r="17" fill="#2563eb"/>
  <text x="75" y="722" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">7</text>
  <text x="105" y="709" font-family="Arial, PingFang SC, sans-serif" font-size="16" font-weight="700" fill="#172033">Switch / Root Port 按地址或 ID 转发，目标接收</text>
  <text x="105" y="732" font-family="Arial, PingFang SC, sans-serif" font-size="13" fill="#526078">每一跳检查 LCRC；错误时链路层 ACK/NAK 与 replay</text>

  <line x1="352" y1="749" x2="352" y2="775" stroke="#64748b" stroke-width="2.5"/>
  <line x1="187" y1="775" x2="517" y2="775" stroke="#64748b" stroke-width="2.5"/>
  <line x1="187" y1="775" x2="187" y2="796" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="517" y1="775" x2="517" y2="796" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="42" y="800" width="290" height="76" rx="11" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="187" y="827" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#172033">Memory Write：Posted</text>
  <text x="187" y="850" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="13" fill="#526078">携带 payload；通常没有 PCIe</text>
  <text x="187" y="868" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="13" fill="#526078">Completion TLP 返回</text>

  <rect x="372" y="800" width="290" height="76" rx="11" fill="#eef2ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="517" y="827" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#172033">Memory Read：Non-Posted</text>
  <text x="517" y="850" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="13" fill="#526078">Request 通常无 payload；目标返回</text>
  <text x="517" y="868" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="13" fill="#526078">Completion with Data TLP</text>

  <line x1="187" y1="876" x2="187" y2="902" stroke="#64748b" stroke-width="2"/>
  <line x1="517" y1="876" x2="517" y2="902" stroke="#64748b" stroke-width="2"/>
  <line x1="187" y1="902" x2="517" y2="902" stroke="#64748b" stroke-width="2"/>
  <line x1="352" y1="902" x2="352" y2="922" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="352" y="948" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#172033">设备写 CQE / 状态；需要时通过 MSI-X 通知 CPU</text>

  <line x1="700" y1="95" x2="700" y2="940" stroke="#cbd5e1" stroke-width="2"/>

  <text x="735" y="105" font-family="Arial, PingFang SC, sans-serif" font-size="18" font-weight="700" fill="#172033">B. “发送单位”与 TLP 结构</text>
  <text x="735" y="135" font-family="Arial, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#172033">Transaction Layer 看到的 TLP</text>

  <rect x="735" y="153" width="80" height="72" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <rect x="815" y="153" width="120" height="72" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="935" y="153" width="155" height="72" fill="#dcfce7" stroke="#059669" stroke-width="1.5"/>
  <rect x="1090" y="153" width="75" height="72" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="775" y="183" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="12" font-weight="700" fill="#172033">Prefix</text>
  <text x="775" y="202" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="11" fill="#526078">可选</text>
  <text x="875" y="183" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="12" font-weight="700" fill="#172033">TLP Header</text>
  <text x="875" y="202" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="11" fill="#526078">3 DW / 4 DW</text>
  <text x="1012.5" y="183" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="12" font-weight="700" fill="#172033">Data Payload</text>
  <text x="1012.5" y="202" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="11" fill="#526078">0～MPS；可选</text>
  <text x="1127.5" y="183" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="12" font-weight="700" fill="#172033">ECRC</text>
  <text x="1127.5" y="202" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="11" fill="#526078">1 DW，可选</text>

  <text x="735" y="253" font-family="Arial, PingFang SC, sans-serif" font-size="12" fill="#526078">1 DW = 4 Byte。Header 决定类型、长度、地址、Requester/Completer、Tag、属性等。</text>

  <text x="735" y="292" font-family="Arial, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#172033">Data Link Layer 在单条 link 上追加</text>
  <rect x="735" y="309" width="75" height="60" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <rect x="810" y="309" width="270" height="60" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="1080" y="309" width="85" height="60" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="772.5" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#172033">Seq</text>
  <text x="772.5" y="353" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#526078">2 B</text>
  <text x="945" y="344" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#172033">完整 TLP（Header + 可选 Data/ECRC）</text>
  <text x="1122.5" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#172033">LCRC</text>
  <text x="1122.5" y="353" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#526078">4 B</text>
  <text x="735" y="395" font-family="Arial, PingFang SC, sans-serif" font-size="12" fill="#526078">LCRC 是逐跳保护；Switch 接收检查后，在下一条 link 上重新生成。</text>

  <text x="735" y="438" font-family="Arial, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#172033">三种最重要的事务形态</text>

  <rect x="735" y="458" width="430" height="72" rx="9" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="753" y="483" font-family="Arial, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#172033">Memory Write Request</text>
  <text x="753" y="503" font-family="Arial, PingFang SC, sans-serif" font-size="12" fill="#526078">[3/4 DW Header][Data Payload] → Posted</text>
  <text x="753" y="519" font-family="Arial, PingFang SC, sans-serif" font-size="12" fill="#526078">通常不返回 PCIe Completion TLP</text>

  <rect x="735" y="545" width="430" height="72" rx="9" fill="#eef2ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="753" y="570" font-family="Arial, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#172033">Memory Read Request</text>
  <text x="753" y="590" font-family="Arial, PingFang SC, sans-serif" font-size="12" fill="#526078">[3/4 DW Header] → Non-Posted</text>
  <text x="753" y="606" font-family="Arial, PingFang SC, sans-serif" font-size="12" fill="#526078">Request 无 data，用 Tag 匹配返回</text>

  <rect x="735" y="632" width="430" height="72" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="753" y="657" font-family="Arial, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#172033">Completion with Data</text>
  <text x="753" y="677" font-family="Arial, PingFang SC, sans-serif" font-size="12" fill="#526078">[Cpl Header][Read Data]</text>
  <text x="753" y="693" font-family="Arial, PingFang SC, sans-serif" font-size="12" fill="#526078">回应之前的 Memory Read Request</text>

  <text x="735" y="748" font-family="Arial, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#172033">Physical Layer：跨 lanes 发送</text>
  <rect x="735" y="768" width="430" height="112" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="753" y="795" font-family="Arial, PingFang SC, sans-serif" font-size="12" fill="#526078">编码后的字节/符号被串行化，并在 xN link 的 lanes 上交错：</text>
  <rect x="753" y="815" width="394" height="13" rx="3" fill="#ccfbf1"/>
  <rect x="753" y="835" width="394" height="13" rx="3" fill="#bfdbfe"/>
  <rect x="753" y="855" width="394" height="13" rx="3" fill="#ddd6fe"/>
  <text x="760" y="826" font-family="Arial, sans-serif" font-size="10" fill="#172033">lane 0: byte 0, N, 2N ...</text>
  <text x="760" y="846" font-family="Arial, sans-serif" font-size="10" fill="#172033">lane 1: byte 1, N+1 ...</text>
  <text x="760" y="866" font-family="Arial, sans-serif" font-size="10" fill="#172033">lane N-1: byte N-1, 2N-1 ...</text>

  <rect x="735" y="900" width="430" height="50" rx="9" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="950" y="922" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="12" font-weight="700" fill="#172033">一个 descriptor 可产生很多 TLP；TLP 是可变长 packet，</text>
  <text x="950" y="940" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="12" font-weight="700" fill="#172033">不是固定 64 B cache line，也不是网络 MTU packet。</text>

  <text x="1176" y="970" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#526078">NCCL · PCIe · RDMA · Barex learning notes</text>
</svg>
