<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="960" height="560" fill="#fbfbfd"/>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#1d1d1f">多 master 分区：为什么必须扫两个维度</text>
  <text x="480" y="52" text-anchor="middle" font-size="12.5" fill="#6e6e73">同一批数据，固定哪一维决定了你得到「分区没用」还是「分区近线性」</text>

  <!-- ================= LEFT PANEL: fixed procs=4, sweep N ================= -->
  <text x="80" y="90" font-size="13.5" font-weight="600" fill="#1d1d1f">① 固定 procs=4，扫 master 数</text>
  <text x="80" y="108" font-size="11.5" fill="#86868b">看起来 N&gt;2 就没增益了 → 容易误判「分区没用」</text>

  <!-- axes -->
  <line x1="105" y1="330" x2="420" y2="330" stroke="#c7c7cc" stroke-width="1.2"/>
  <line x1="105" y1="330" x2="105" y2="130" stroke="#c7c7cc" stroke-width="1.2"/>
  <text x="262" y="356" text-anchor="middle" font-size="11" fill="#86868b">masters (N)</text>
  <text x="66" y="230" text-anchor="middle" font-size="11" fill="#86868b" transform="rotate(-90 66 230)">keys/s (M)</text>

  <!-- y gridlines: 0,4,8,12 M  -> y = 330 - v/12*200 -->
  <line x1="105" y1="263.3" x2="420" y2="263.3" stroke="#ececed" stroke-width="1"/>
  <line x1="105" y1="196.7" x2="420" y2="196.7" stroke="#ececed" stroke-width="1"/>
  <line x1="105" y1="130" x2="420" y2="130" stroke="#ececed" stroke-width="1"/>
  <text x="98" y="334" text-anchor="end" font-size="10" fill="#aeaeb2">0</text>
  <text x="98" y="267" text-anchor="end" font-size="10" fill="#aeaeb2">4</text>
  <text x="98" y="200" text-anchor="end" font-size="10" fill="#aeaeb2">8</text>
  <text x="98" y="134" text-anchor="end" font-size="10" fill="#aeaeb2">12</text>

  <!-- client ceiling at 4 x 1.7 = 6.8M -> y = 330 - 6.8/12*200 = 216.7 -->
  <line x1="105" y1="216.7" x2="420" y2="216.7" stroke="#ff9500" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="416" y="211" text-anchor="end" font-size="10.5" fill="#c96a00">4 个 client 进程的上限 ≈ 6.8M</text>

  <!-- data: N=1..8 at x 145,215,285,390? use even spacing for 1,2,4,8 -->
  <!-- x: N=1 ->145, N=2 ->215, N=4 ->285, N=8 ->370 -->
  <!-- y: 3.35->274.2, 6.02->229.7, 6.40->223.3, 6.77->217.2 -->
  <polyline points="145,274.2 215,229.7 285,223.3 370,217.2" fill="none" stroke="#0071e3" stroke-width="2.4"/>
  <circle cx="145" cy="274.2" r="5" fill="#0071e3"/>
  <circle cx="215" cy="229.7" r="5" fill="#0071e3"/>
  <circle cx="285" cy="223.3" r="5" fill="#0071e3"/>
  <circle cx="370" cy="217.2" r="5" fill="#0071e3"/>
  <text x="145" y="292" text-anchor="middle" font-size="10" fill="#86868b">1</text>
  <text x="215" y="292" text-anchor="middle" font-size="10" fill="#86868b">2</text>
  <text x="285" y="292" text-anchor="middle" font-size="10" fill="#86868b">4</text>
  <text x="370" y="292" text-anchor="middle" font-size="10" fill="#86868b">8</text>
  <text x="145" y="266" text-anchor="middle" font-size="10" fill="#0071e3">3.35</text>
  <text x="215" y="221" text-anchor="middle" font-size="10" fill="#0071e3">6.02</text>
  <text x="290" y="212" text-anchor="middle" font-size="10" fill="#0071e3">6.40</text>
  <text x="374" y="206" text-anchor="middle" font-size="10" fill="#0071e3">6.77</text>

  <text x="150" y="318" font-size="10.5" fill="#86868b">1.00x → 1.80x → 1.91x → 2.02x</text>

  <!-- ================= RIGHT PANEL: fixed N=8, sweep procs ================= -->
  <text x="545" y="90" font-size="13.5" font-weight="600" fill="#1d1d1f">② 固定 N=8，扫 client 进程数</text>
  <text x="545" y="108" font-size="11.5" fill="#86868b">近线性到 11.74M（8 进程效率 86%）→ 分区确实生效</text>

  <line x1="570" y1="330" x2="900" y2="330" stroke="#c7c7cc" stroke-width="1.2"/>
  <line x1="570" y1="330" x2="570" y2="130" stroke="#c7c7cc" stroke-width="1.2"/>
  <text x="735" y="356" text-anchor="middle" font-size="11" fill="#86868b">client 进程数</text>

  <line x1="570" y1="263.3" x2="900" y2="263.3" stroke="#ececed" stroke-width="1"/>
  <line x1="570" y1="196.7" x2="900" y2="196.7" stroke="#ececed" stroke-width="1"/>
  <line x1="570" y1="130" x2="900" y2="130" stroke="#ececed" stroke-width="1"/>
  <text x="563" y="334" text-anchor="end" font-size="10" fill="#aeaeb2">0</text>
  <text x="563" y="267" text-anchor="end" font-size="10" fill="#aeaeb2">4</text>
  <text x="563" y="200" text-anchor="end" font-size="10" fill="#aeaeb2">8</text>
  <text x="563" y="134" text-anchor="end" font-size="10" fill="#aeaeb2">12</text>

  <!-- single-master ceiling 4.5M -> y = 330 - 4.5/12*200 = 255 -->
  <line x1="570" y1="255" x2="900" y2="255" stroke="#ff3b30" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="896" y="249" text-anchor="end" font-size="10.5" fill="#c1291f">单 master 实测上限 4.5M</text>

  <!-- procs 1,2,4,8 -> x 610,680,750,850 ; y: 1.70->301.7, 3.08->278.7, 6.77->217.2, 11.74->134.3 -->
  <polyline points="610,301.7 680,278.7 750,217.2 850,134.3" fill="none" stroke="#34c759" stroke-width="2.4"/>
  <circle cx="610" cy="301.7" r="5" fill="#34c759"/>
  <circle cx="680" cy="278.7" r="5" fill="#34c759"/>
  <circle cx="750" cy="217.2" r="5" fill="#34c759"/>
  <circle cx="850" cy="134.3" r="5" fill="#34c759"/>
  <text x="610" y="292" text-anchor="middle" font-size="10" fill="#1e8e3e">1.70</text>
  <text x="680" y="270" text-anchor="middle" font-size="10" fill="#1e8e3e">3.08</text>
  <text x="750" y="209" text-anchor="middle" font-size="10" fill="#1e8e3e">6.77</text>
  <text x="850" y="126" text-anchor="middle" font-size="10" fill="#1e8e3e">11.74</text>
  <text x="610" y="348" text-anchor="middle" font-size="10" fill="#86868b">1</text>
  <text x="680" y="348" text-anchor="middle" font-size="10" fill="#86868b">2</text>
  <text x="750" y="348" text-anchor="middle" font-size="10" fill="#86868b">4</text>
  <text x="850" y="348" text-anchor="middle" font-size="10" fill="#86868b">8</text>

  <!-- 14M extrapolation marker -->
  <text x="896" y="150" text-anchor="end" font-size="10.5" fill="#86868b">百实例冷缓存外推 14M（需 ≥4 个 master）</text>

  <!-- ================= BOTTOM: the reading ================= -->
  <rect x="80" y="386" width="800" height="150" rx="10" fill="#ffffff" stroke="#e5e5ea"/>
  <text x="100" y="412" font-size="13" font-weight="600" fill="#1d1d1f">怎么读这两张图</text>
  <text x="100" y="436" font-size="11.5" fill="#3a3a3c">左图的平台不是 master 饱和：4 × 1.7M = 6.8M 正好是四个 client 进程的流水线上限，master 根本没被压到。</text>
  <text x="100" y="457" font-size="11.5" fill="#3a3a3c">右图在 11.74M 时约束仍在客户端：每进程 1.47M（卡在单 client 上限）、每 master 只 1.47M（远低于 4.5M）、CPU 仅 9-12%/144 核。</text>
  <text x="100" y="478" font-size="11.5" fill="#3a3a3c">而且 p99 从单 master 8 进程时的 4.77ms 降到 1.04ms —— 分区顺带治好了排队。</text>
  <text x="100" y="506" font-size="11.5" font-weight="600" fill="#b25000">教训：实验里 master 数和 client 数是同时增加的，所以一个「线性」结果既可能是分区生效，也可能只是多了客户端流水线。</text>
  <text x="100" y="525" font-size="11.5" font-weight="600" fill="#b25000">把两维分开扫是唯一能区分它们的办法 —— 不做这一步会拿到正确的数字和错误的解释。</text>
</svg>
