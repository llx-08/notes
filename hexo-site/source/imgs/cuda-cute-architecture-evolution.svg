<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc" data-series="cuda-cute-nvidia-learning">
  <title id="title">Ampere、Hopper、Blackwell 架构演进</title>
  <desc id="desc">对比三个架构中异步搬运、Tensor Core 指令、协作范围和精度能力的演进。</desc>
  <defs><marker id="a" markerWidth="11" markerHeight="11" refX="10" refY="3" orient="auto"><path d="M0 0L11 3 0 6Z" fill="#6dd4ff"/></marker></defs>
  <rect width="1200" height="730" rx="26" fill="#071522"/>
  <text x="600" y="54" text-anchor="middle" fill="white" font-family="sans-serif" font-size="30" font-weight="700">Ampere → Hopper → Blackwell：搬运、协作与 Tensor Core 数据流</text>
  <g font-family="sans-serif">
    <path d="M385 365 H435" stroke="#6dd4ff" stroke-width="4" marker-end="url(#a)"/>
    <path d="M765 365 H815" stroke="#6dd4ff" stroke-width="4" marker-end="url(#a)"/>
    <g>
      <rect x="50" y="110" width="335" height="530" rx="20" fill="#173b55" stroke="#64ccff" stroke-width="2"/>
      <text x="217" y="155" text-anchor="middle" fill="#83dbff" font-size="27" font-weight="700">Ampere</text>
      <text x="217" y="184" text-anchor="middle" fill="#bfe8f8" font-size="16">SM80 / 第三代 Tensor Core</text>
      <rect x="85" y="220" width="265" height="75" rx="12" fill="#245271"/>
      <text x="217" y="250" text-anchor="middle" fill="white" font-size="18">global → shared</text>
      <text x="217" y="277" text-anchor="middle" fill="#bfe8f8" font-size="15">cp.async（线程发起）</text>
      <rect x="85" y="320" width="265" height="75" rx="12" fill="#28465f"/>
      <text x="217" y="350" text-anchor="middle" fill="white" font-size="18">MMA</text>
      <text x="217" y="377" text-anchor="middle" fill="#bfe8f8" font-size="15">warp-level mma.sync</text>
      <rect x="85" y="420" width="265" height="75" rx="12" fill="#28465f"/>
      <text x="217" y="450" text-anchor="middle" fill="white" font-size="18">精度</text>
      <text x="217" y="477" text-anchor="middle" fill="#bfe8f8" font-size="15">TF32 / BF16 / FP16 / FP64 TC</text>
      <text x="217" y="545" text-anchor="middle" fill="#dceff7" font-size="16">核心学习点</text>
      <text x="217" y="575" text-anchor="middle" fill="#a9cfdf" font-size="14">异步 copy + 多 stage</text>
      <text x="217" y="600" text-anchor="middle" fill="#a9cfdf" font-size="14">warp fragment</text>
    </g>
    <g>
      <rect x="435" y="110" width="330" height="530" rx="20" fill="#312d58" stroke="#ad9dff" stroke-width="2"/>
      <text x="600" y="155" text-anchor="middle" fill="#c5b8ff" font-size="27" font-weight="700">Hopper</text>
      <text x="600" y="184" text-anchor="middle" fill="#ddd7ff" font-size="16">SM90 / 第四代 Tensor Core</text>
      <rect x="470" y="220" width="260" height="75" rx="12" fill="#49427e"/>
      <text x="600" y="250" text-anchor="middle" fill="white" font-size="18">global → shared</text>
      <text x="600" y="277" text-anchor="middle" fill="#ddd7ff" font-size="15">TMA + tensor descriptor</text>
      <rect x="470" y="320" width="260" height="75" rx="12" fill="#433b73"/>
      <text x="600" y="350" text-anchor="middle" fill="white" font-size="18">MMA</text>
      <text x="600" y="377" text-anchor="middle" fill="#ddd7ff" font-size="15">4-warp WGMMA async</text>
      <rect x="470" y="420" width="260" height="75" rx="12" fill="#433b73"/>
      <text x="600" y="450" text-anchor="middle" fill="white" font-size="18">协作与精度</text>
      <text x="600" y="477" text-anchor="middle" fill="#ddd7ff" font-size="15">Thread Block Cluster / DSM / FP8</text>
      <text x="600" y="545" text-anchor="middle" fill="#f0edff" font-size="16">核心学习点</text>
      <text x="600" y="575" text-anchor="middle" fill="#ccc5ef" font-size="14">producer / consumer warp specialization</text>
      <text x="600" y="600" text-anchor="middle" fill="#ccc5ef" font-size="14">mbarrier + WGMMA commit/wait</text>
    </g>
    <g>
      <rect x="815" y="110" width="335" height="530" rx="20" fill="#21483c" stroke="#68e4aa" stroke-width="2"/>
      <text x="982" y="155" text-anchor="middle" fill="#83f0bd" font-size="27" font-weight="700">Blackwell</text>
      <text x="982" y="184" text-anchor="middle" fill="#c8f6dd" font-size="16">SM100 / 第五代 Tensor Core</text>
      <rect x="850" y="220" width="265" height="75" rx="12" fill="#306754"/>
      <text x="982" y="250" text-anchor="middle" fill="white" font-size="18">global → shared</text>
      <text x="982" y="277" text-anchor="middle" fill="#c8f6dd" font-size="15">TMA 继续承担 tensor 搬运</text>
      <rect x="850" y="320" width="265" height="75" rx="12" fill="#2d5d4c"/>
      <text x="982" y="350" text-anchor="middle" fill="white" font-size="18">MMA / Accumulator</text>
      <text x="982" y="377" text-anchor="middle" fill="#c8f6dd" font-size="15">tcgen05 → TMEM</text>
      <rect x="850" y="420" width="265" height="75" rx="12" fill="#2d5d4c"/>
      <text x="982" y="450" text-anchor="middle" fill="white" font-size="18">精度与协作</text>
      <text x="982" y="477" text-anchor="middle" fill="#c8f6dd" font-size="15">FP4/FP6/FP8 · block scaling · CTA pair</text>
      <text x="982" y="545" text-anchor="middle" fill="#edfff5" font-size="16">核心学习点</text>
      <text x="982" y="575" text-anchor="middle" fill="#bdebd3" font-size="14">TMEM 生命周期与 layout</text>
      <text x="982" y="600" text-anchor="middle" fill="#bdebd3" font-size="14">tcgen05 单线程 issue≠单线程计算</text>
    </g>
    <text x="600" y="684" text-anchor="middle" fill="#91acb8" font-size="15">架构能力不等于所有 SKU 的峰值数字；具体 SM 数、显存、带宽和启用功能必须按产品与实机确认</text>
  </g>
</svg>
