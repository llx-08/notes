<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc" data-series="cuda-cute-nvidia-learning">
  <title id="title">SM 内部教学示意</title>
  <desc id="desc">SM 内包含 warp scheduler、register file、shared memory、load store、CUDA Core、Tensor Core、SFU 等协作部件。</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#65cffb"/></marker>
  </defs>
  <rect width="1200" height="760" rx="26" fill="#071522"/>
  <text x="600" y="52" text-anchor="middle" fill="white" font-family="sans-serif" font-size="30" font-weight="700">Streaming Multiprocessor（SM）内部：调度、存储与执行管线</text>
  <rect x="60" y="85" width="1080" height="610" rx="24" fill="#10283a" stroke="#5ecbff" stroke-width="2"/>
  <g font-family="sans-serif">
    <rect x="100" y="125" width="1000" height="92" rx="15" fill="#233d64" stroke="#a99cff"/>
    <text x="125" y="158" fill="#c9c0ff" font-size="20" font-weight="700">Warp 调度与指令发射</text>
    <g fill="#37336a" stroke="#b8afff">
      <rect x="360" y="143" width="155" height="50" rx="9"/>
      <rect x="535" y="143" width="155" height="50" rx="9"/>
      <rect x="710" y="143" width="155" height="50" rx="9"/>
      <rect x="885" y="143" width="155" height="50" rx="9"/>
    </g>
    <g fill="white" font-size="15" text-anchor="middle">
      <text x="437" y="173">scheduler / dispatch</text>
      <text x="612" y="173">scoreboard</text>
      <text x="787" y="173">dependency</text>
      <text x="962" y="173">instruction issue</text>
    </g>

    <rect x="100" y="250" width="470" height="120" rx="15" fill="#1c4b48" stroke="#5de1ac"/>
    <text x="125" y="284" fill="#7af0bc" font-size="20" font-weight="700">Register File</text>
    <text x="125" y="315" fill="#e9fff5" font-size="16">每个 active thread 的寄存器状态</text>
    <text x="125" y="343" fill="#baf2d6" font-size="15">多用寄存器可能降低 resident warps；spill 会落到 local memory</text>

    <rect x="600" y="250" width="500" height="120" rx="15" fill="#59421f" stroke="#ffd063"/>
    <text x="625" y="284" fill="#ffd77c" font-size="20" font-weight="700">Shared Memory / L1</text>
    <text x="625" y="315" fill="#fff9e9" font-size="16">CTA staging、线程共享、tile 重用</text>
    <text x="625" y="343" fill="#ffe8b6" font-size="15">bank、barrier、cp.async/TMA destination</text>

    <text x="100" y="420" fill="#9eddf8" font-size="19" font-weight="700">执行与数据通路（示意，不代表精确物理分区/数量）</text>
    <g>
      <rect x="100" y="450" width="190" height="145" rx="15" fill="#16445e" stroke="#67ceff"/>
      <text x="195" y="487" text-anchor="middle" fill="#8bddff" font-size="19" font-family="sans-serif" font-weight="700">CUDA Core</text>
      <text x="195" y="521" text-anchor="middle" fill="white" font-size="15" font-family="sans-serif">FP32 / INT 等</text>
      <text x="195" y="550" text-anchor="middle" fill="#c3eafa" font-size="14" font-family="sans-serif">标量/向量 lane</text>

      <rect x="315" y="450" width="220" height="145" rx="15" fill="#443369" stroke="#ba9cff"/>
      <text x="425" y="487" text-anchor="middle" fill="#d0baff" font-size="19" font-family="sans-serif" font-weight="700">Tensor Core</text>
      <text x="425" y="521" text-anchor="middle" fill="white" font-size="15" font-family="sans-serif">MMA 矩阵乘累加</text>
      <text x="425" y="550" text-anchor="middle" fill="#e2d4ff" font-size="14" font-family="sans-serif">mma / WGMMA / tcgen05</text>

      <rect x="560" y="450" width="190" height="145" rx="15" fill="#244f45" stroke="#6ee5ad"/>
      <text x="655" y="487" text-anchor="middle" fill="#8bf0bf" font-size="19" font-family="sans-serif" font-weight="700">LSU</text>
      <text x="655" y="521" text-anchor="middle" fill="white" font-size="15" font-family="sans-serif">Load / Store</text>
      <text x="655" y="550" text-anchor="middle" fill="#c8f7dd" font-size="14" font-family="sans-serif">地址与 memory pipe</text>

      <rect x="775" y="450" width="155" height="145" rx="15" fill="#57431f" stroke="#ffcf63"/>
      <text x="852" y="487" text-anchor="middle" fill="#ffdb82" font-size="19" font-family="sans-serif" font-weight="700">SFU</text>
      <text x="852" y="521" text-anchor="middle" fill="white" font-size="15" font-family="sans-serif">特殊函数</text>
      <text x="852" y="550" text-anchor="middle" fill="#ffedc3" font-size="14" font-family="sans-serif">sin / exp 等</text>

      <rect x="955" y="450" width="145" height="145" rx="15" fill="#3e4653" stroke="#adbecb"/>
      <text x="1027" y="487" text-anchor="middle" fill="#d4e1e9" font-size="19" font-family="sans-serif" font-weight="700">TMA*</text>
      <text x="1027" y="521" text-anchor="middle" fill="white" font-size="15" font-family="sans-serif">异步 tensor 搬运</text>
      <text x="1027" y="550" text-anchor="middle" fill="#d2dfe6" font-size="14" font-family="sans-serif">Hopper+</text>
    </g>
    <g stroke="#65cffb" stroke-width="2.5" marker-end="url(#arr)">
      <path d="M600 218 V240"/>
      <path d="M335 372 V438"/>
      <path d="M850 372 V438"/>
    </g>
    <text x="600" y="655" text-anchor="middle" fill="#b8d2de" font-size="16">Warp scheduler 发射指令；不同指令进入相应管线，多个 warp 用于隐藏依赖和访存延迟</text>
    <text x="600" y="730" text-anchor="middle" fill="#819daa" font-size="14">* 示意图强调职责关系，不应据此推断某 SKU 中部件的准确数量、端口或物理布局</text>
  </g>
</svg>
