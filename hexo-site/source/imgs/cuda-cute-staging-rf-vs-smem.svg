<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="880" viewBox="0 0 1220 880" role="img" aria-labelledby="title desc" data-series="cuda-cute-nvidia-learning">
  <title id="title">在途数据放哪里：寄存器中转 vs cp.async 直达 Shared Memory</title>
  <desc id="desc">对比 Volta/Turing 的 LDG 目标寄存器占用与 Ampere cp.async 直写 shared memory，说明流水线级数的约束为何从每线程寄存器预算转移到每 SM 的 shared memory 容量。</desc>
  <rect width="1220" height="880" rx="26" fill="#071522"/>
  <text x="610" y="44" text-anchor="middle" fill="white" font-family="sans-serif" font-size="27" font-weight="700">在途数据放哪里：为什么 cp.async 能加深流水线</text>
  <text x="610" y="74" text-anchor="middle" fill="#7e9fb8" font-family="sans-serif" font-size="14.5">以 128×256×64 BF16 tile、CTA 256 线程为例。「在途」= 已发射但尚未落到目的地的那一份数据</text>

  <g font-family="sans-serif">
    <!-- ============ 上半：Volta / Turing ============ -->
    <rect x="30" y="100" width="1160" height="336" rx="16" fill="#150e14" stroke="#7d4b5c"/>
    <text x="56" y="136" fill="#ffb3c1" font-size="20" font-weight="700">Volta / Turing：LDG 的目的地是寄存器</text>

    <!-- 时间线 -->
    <text x="56" y="176" fill="#8fb8d6" font-size="13.5">一轮迭代内，frag 占着寄存器的时间横跨整个 MMA：</text>
    <rect x="300" y="192" width="120" height="26" rx="6" fill="#a85070"/>
    <text x="360" y="210" text-anchor="middle" fill="white" font-size="12.5">① LDG 发射</text>
    <rect x="428" y="192" width="330" height="26" rx="6" fill="#5c2d3d" stroke="#ff8fa3" stroke-dasharray="4 3"/>
    <text x="593" y="210" text-anchor="middle" fill="#ffb3c1" font-size="12.5">数据在途 —— 目标寄存器被 scoreboard 锁住，不可复用</text>
    <rect x="766" y="192" width="100" height="26" rx="6" fill="#a85070"/>
    <text x="816" y="210" text-anchor="middle" fill="white" font-size="12.5">④ STS 落地</text>
    <rect x="428" y="226" width="240" height="26" rx="6" fill="#3d7ea6"/>
    <text x="548" y="244" text-anchor="middle" fill="white" font-size="12.5">②③ LDS + HMMA（算当前块）</text>
    <text x="880" y="244" fill="#ff9bb0" font-size="13">↑ 两者同时在线</text>

    <!-- 寄存器预算条 -->
    <text x="56" y="292" fill="white" font-size="15" font-weight="700">每线程寄存器预算（硬件上限 255）</text>
    <rect x="300" y="304" width="820" height="46" rx="6" fill="#0d1f30" stroke="#2b4a63"/>
    <rect x="300" y="304" width="412" height="46" rx="6" fill="#2f7a52"/>
    <text x="506" y="332" text-anchor="middle" fill="white" font-size="14" font-weight="700">累加器 acc  128 reg</text>
    <rect x="712" y="304" width="154" height="46" fill="#a85070"/>
    <text x="789" y="326" text-anchor="middle" fill="white" font-size="12.5">在途 frag 0</text>
    <text x="789" y="343" text-anchor="middle" fill="#ffd3dc" font-size="11.5">48 reg</text>
    <rect x="866" y="304" width="154" height="46" fill="#8c4359"/>
    <text x="943" y="326" text-anchor="middle" fill="white" font-size="12.5">在途 frag 1</text>
    <text x="943" y="343" text-anchor="middle" fill="#ffd3dc" font-size="11.5">48 reg</text>
    <rect x="1020" y="304" width="100" height="46" fill="#233848"/>
    <text x="1070" y="332" text-anchor="middle" fill="#8fb8d6" font-size="12">剩 31</text>
    <rect x="1124" y="300" width="64" height="54" rx="6" fill="none" stroke="#ff5d78" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="1156" y="339" text-anchor="middle" fill="#ff5d78" font-size="22" font-weight="700">✗</text>
    <text x="1188" y="290" text-anchor="end" fill="#ff5d78" font-size="13" font-weight="700">第 3 级需 48 reg，仅剩 31 → 放不下</text>

    <text x="56" y="384" fill="#e7b9c4" font-size="13.5">每 stage = (128·64 + 256·64)·2B = 48 KiB，摊到 256 线程 = 192 B = 48 reg/线程</text>
    <text x="56" y="408" fill="#ff9bb0" font-size="14" font-weight="700">128 + 48 + 48 = 224，再加一级就爆 → 这就是 stage 上限约等于 2 的来源</text>

    <!-- ============ 下半：Ampere ============ -->
    <rect x="30" y="456" width="1160" height="336" rx="16" fill="#0c1a14" stroke="#3f7a58"/>
    <text x="56" y="492" fill="#9bf3c0" font-size="20" font-weight="700">Ampere：cp.async 的目的地直接是 Shared Memory</text>

    <text x="56" y="530" fill="#8fb8d6" font-size="13.5">在途数据不再经过寄存器，占用转移到本来就要花的 stage buffer：</text>
    <rect x="300" y="546" width="140" height="26" rx="6" fill="#2f7a52"/>
    <text x="370" y="564" text-anchor="middle" fill="white" font-size="12.5">cp.async 发射</text>
    <rect x="448" y="546" width="418" height="26" rx="6" fill="#1b4b33" stroke="#6ee7a0" stroke-dasharray="4 3"/>
    <text x="657" y="564" text-anchor="middle" fill="#9bf3c0" font-size="12.5">数据在途 —— 落点是 SMEM，不占任何寄存器</text>
    <rect x="448" y="580" width="240" height="26" rx="6" fill="#3d7ea6"/>
    <text x="568" y="598" text-anchor="middle" fill="white" font-size="12.5">mma（算当前块）</text>

    <text x="56" y="646" fill="white" font-size="15" font-weight="700">每线程寄存器预算（上限 255）</text>
    <rect x="300" y="658" width="820" height="40" rx="6" fill="#0d1f30" stroke="#2b4a63"/>
    <rect x="300" y="658" width="412" height="40" rx="6" fill="#2f7a52"/>
    <text x="506" y="683" text-anchor="middle" fill="white" font-size="14" font-weight="700">累加器 acc  128 reg</text>
    <rect x="712" y="658" width="77" height="40" fill="#3d7ea6"/>
    <text x="750" y="683" text-anchor="middle" fill="white" font-size="11.5">frag</text>
    <rect x="789" y="658" width="331" height="40" fill="#233848"/>
    <text x="954" y="683" text-anchor="middle" fill="#8fb8d6" font-size="12.5">富余 —— 加深流水线不再和累加器抢寄存器</text>

    <text x="56" y="736" fill="white" font-size="15" font-weight="700">每 SM Shared Memory（H20 / GB200 均 228 KB）</text>
    <rect x="300" y="748" width="820" height="40" rx="6" fill="#0d1f30" stroke="#2b4a63"/>
    <rect x="300" y="748" width="173" height="40" fill="#2f7a52"/><text x="386" y="773" text-anchor="middle" fill="white" font-size="12.5">stage 0  48 KiB</text>
    <rect x="473" y="748" width="173" height="40" fill="#286846"/><text x="559" y="773" text-anchor="middle" fill="white" font-size="12.5">stage 1  48 KiB</text>
    <rect x="646" y="748" width="173" height="40" fill="#2f7a52"/><text x="732" y="773" text-anchor="middle" fill="white" font-size="12.5">stage 2  48 KiB</text>
    <rect x="819" y="748" width="173" height="40" fill="#286846"/><text x="905" y="773" text-anchor="middle" fill="white" font-size="12.5">stage 3  48 KiB</text>
    <rect x="992" y="748" width="128" height="40" fill="#233848"/><text x="1056" y="773" text-anchor="middle" fill="#8fb8d6" font-size="12">剩 36 KB</text>

    <text x="610" y="834" text-anchor="middle" fill="#9bf3c0" font-size="15.5" font-weight="700">流水线深度的约束从「每线程 255 个寄存器」换成了「每 SM 228 KB shared memory」</text>
    <text x="610" y="862" text-anchor="middle" fill="#7e9fb8" font-size="13.5">前者要和累加器抢，且越大 tile 累加器越大；后者是本来就要为 stage buffer 花的钱</text>
  </g>
</svg>
