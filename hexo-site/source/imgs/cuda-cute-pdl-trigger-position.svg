<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc" data-series="cuda-cute-nvidia-learning">
  <title id="title">trigger 位置扫描实测：资源是否冲突决定曲线形状</title>
  <desc id="desc">两组对照实验，唯一变量是 consumer 的 prolog 使用 HBM 带宽还是 FP32 算力；前者收益随 trigger 提前单调上升，后者出现最优点并伴随 producer 自身被拖慢 21~24%。</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8fb8d6"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff9b9b"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ee6a8"/></marker></defs>
  <rect x="0" y="0" width="1200" height="640" rx="26" fill="#071522"/>
  <text x="600.0" y="46" fill="white" font-family="sans-serif" font-size="27" text-anchor="middle" font-weight="700">trigger 位置实测：「太早反而亏」只在两者争同一硬件单元时成立</text><text x="600.0" y="74" fill="#7e9fb8" font-family="sans-serif" font-size="14" text-anchor="middle">唯一变量是 consumer 的 prolog 用什么资源；producer mainloop 恒为 FP32 FMA 饱和</text>
  <rect x="60" y="110" width="520" height="320" rx="12" fill="#0b1c2a" stroke="#22405a" stroke-width="1.2"/><text x="320" y="138" fill="#cfe6f3" font-family="sans-serif" font-size="14.5" text-anchor="middle" font-weight="700">C：prolog = HBM 流式读</text><text x="320" y="158" fill="#7e9fb8" font-family="sans-serif" font-size="12" text-anchor="middle">与 producer 的 FP32 mainloop 资源不重叠 → 越早越好，单调</text><line x1="130" y1="374.3333333333333" x2="540" y2="374.3333333333333" stroke="#1b3346" stroke-width="1"/><text x="122" y="378.3333333333333" fill="#5f7f96" font-family="sans-serif" font-size="11" text-anchor="end">15%</text><line x1="130" y1="316.0" x2="540" y2="316.0" stroke="#1b3346" stroke-width="1"/><text x="122" y="320.0" fill="#5f7f96" font-family="sans-serif" font-size="11" text-anchor="end">20%</text><line x1="130" y1="257.66666666666663" x2="540" y2="257.66666666666663" stroke="#1b3346" stroke-width="1"/><text x="122" y="261.66666666666663" fill="#5f7f96" font-family="sans-serif" font-size="11" text-anchor="end">25%</text><line x1="130" y1="199.33333333333334" x2="540" y2="199.33333333333334" stroke="#1b3346" stroke-width="1"/><text x="122" y="203.33333333333334" fill="#5f7f96" font-family="sans-serif" font-size="11" text-anchor="end">30%</text><text x="130.0" y="406" fill="#5f7f96" font-family="sans-serif" font-size="11" text-anchor="middle">0%</text><text x="232.5" y="406" fill="#5f7f96" font-family="sans-serif" font-size="11" text-anchor="middle">25%</text><text x="335.0" y="406" fill="#5f7f96" font-family="sans-serif" font-size="11" text-anchor="middle">50%</text><text x="437.5" y="406" fill="#5f7f96" font-family="sans-serif" font-size="11" text-anchor="middle">75%</text><text x="540.0" y="406" fill="#5f7f96" font-family="sans-serif" font-size="11" text-anchor="middle">100%</text><text x="335.0" y="426" fill="#7e9fb8" font-family="sans-serif" font-size="12" text-anchor="middle">trigger 在 mainloop 中的位置</text><polyline points="130.0,220.33333333333334 232.5,213.33333333333331 335.0,205.16666666666666 437.5,243.66666666666669 540.0,310.1666666666667" fill="none" stroke="#65d0ff" stroke-width="2.4"/><circle cx="130.0" cy="220.33333333333334" r="4" fill="#65d0ff"/><circle cx="232.5" cy="213.33333333333331" r="4" fill="#65d0ff"/><circle cx="335.0" cy="205.16666666666666" r="4" fill="#65d0ff"/><circle cx="437.5" cy="243.66666666666669" r="4" fill="#65d0ff"/><circle cx="540.0" cy="310.1666666666667" r="4" fill="#65d0ff"/><text x="550.0" y="314.1666666666667" fill="#82dcff" font-family="sans-serif" font-size="11.5">H20</text><polyline points="130.0,310.1666666666667 232.5,307.83333333333337 335.0,292.6666666666667 437.5,276.33333333333337 540.0,265.8333333333333" fill="none" stroke="#58d68d" stroke-width="2.4"/><circle cx="130.0" cy="310.1666666666667" r="4" fill="#58d68d"/><circle cx="232.5" cy="307.83333333333337" r="4" fill="#58d68d"/><circle cx="335.0" cy="292.6666666666667" r="4" fill="#58d68d"/><circle cx="437.5" cy="276.33333333333337" r="4" fill="#58d68d"/><circle cx="540.0" cy="265.8333333333333" r="4" fill="#58d68d"/><text x="550.0" y="269.8333333333333" fill="#7ee6a8" font-family="sans-serif" font-size="11.5">GB200</text>
  <rect x="620" y="110" width="520" height="320" rx="12" fill="#0b1c2a" stroke="#22405a" stroke-width="1.2"/><text x="880" y="138" fill="#cfe6f3" font-family="sans-serif" font-size="14.5" text-anchor="middle" font-weight="700">C2：prolog = FP32 FMA</text><text x="880" y="158" fill="#7e9fb8" font-family="sans-serif" font-size="12" text-anchor="middle">与 producer 争同一批 CUDA core → 出现最优点</text><line x1="690" y1="374.3333333333333" x2="1100" y2="374.3333333333333" stroke="#1b3346" stroke-width="1"/><text x="682" y="378.3333333333333" fill="#5f7f96" font-family="sans-serif" font-size="11" text-anchor="end">15%</text><line x1="690" y1="316.0" x2="1100" y2="316.0" stroke="#1b3346" stroke-width="1"/><text x="682" y="320.0" fill="#5f7f96" font-family="sans-serif" font-size="11" text-anchor="end">20%</text><line x1="690" y1="257.66666666666663" x2="1100" y2="257.66666666666663" stroke="#1b3346" stroke-width="1"/><text x="682" y="261.66666666666663" fill="#5f7f96" font-family="sans-serif" font-size="11" text-anchor="end">25%</text><line x1="690" y1="199.33333333333334" x2="1100" y2="199.33333333333334" stroke="#1b3346" stroke-width="1"/><text x="682" y="203.33333333333334" fill="#5f7f96" font-family="sans-serif" font-size="11" text-anchor="end">30%</text><text x="690.0" y="406" fill="#5f7f96" font-family="sans-serif" font-size="11" text-anchor="middle">0%</text><text x="792.5" y="406" fill="#5f7f96" font-family="sans-serif" font-size="11" text-anchor="middle">25%</text><text x="895.0" y="406" fill="#5f7f96" font-family="sans-serif" font-size="11" text-anchor="middle">50%</text><text x="997.5" y="406" fill="#5f7f96" font-family="sans-serif" font-size="11" text-anchor="middle">75%</text><text x="1100.0" y="406" fill="#5f7f96" font-family="sans-serif" font-size="11" text-anchor="middle">100%</text><text x="895.0" y="426" fill="#7e9fb8" font-family="sans-serif" font-size="12" text-anchor="middle">trigger 在 mainloop 中的位置</text><polyline points="690.0,324.16666666666663 792.5,281.0 895.0,248.33333333333334 997.5,236.66666666666666 1100.0,272.83333333333337" fill="none" stroke="#65d0ff" stroke-width="2.4"/><circle cx="690.0" cy="324.16666666666663" r="4" fill="#65d0ff"/><circle cx="792.5" cy="281.0" r="4" fill="#65d0ff"/><circle cx="895.0" cy="248.33333333333334" r="4" fill="#65d0ff"/><circle cx="997.5" cy="236.66666666666666" r="4" fill="#65d0ff"/><circle cx="1100.0" cy="272.83333333333337" r="4" fill="#65d0ff"/><text x="1110.0" y="276.83333333333337" fill="#82dcff" font-family="sans-serif" font-size="11.5">H20</text><polyline points="690.0,355.66666666666663 792.5,306.66666666666663 895.0,264.6666666666667 997.5,229.66666666666669 1100.0,265.8333333333333" fill="none" stroke="#58d68d" stroke-width="2.4"/><circle cx="690.0" cy="355.66666666666663" r="4" fill="#58d68d"/><circle cx="792.5" cy="306.66666666666663" r="4" fill="#58d68d"/><circle cx="895.0" cy="264.6666666666667" r="4" fill="#58d68d"/><circle cx="997.5" cy="229.66666666666669" r="4" fill="#58d68d"/><circle cx="1100.0" cy="265.8333333333333" r="4" fill="#58d68d"/><text x="1110.0" y="269.8333333333333" fill="#7ee6a8" font-family="sans-serif" font-size="11.5">GB200</text><line x1="997.5" y1="176" x2="997.5" y2="386" stroke="#f0c040" stroke-width="1.6" stroke-dasharray="5 4"/><text x="997.5" y="170" fill="#ffd76a" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="700">最优</text>
  <text x="60" y="470" fill="#cfe6f3" font-family="sans-serif" font-size="14.5" font-weight="700">C2 中 producer 自身的耗时（ns）—— 这就是「争用」被量化出来的样子</text>
  <text x="286" y="507" fill="#7e9fb8" font-family="sans-serif" font-size="12" text-anchor="end">trig@0%</text>
  <rect x="300" y="492" width="302.175" height="10" rx="3" fill="#173f59" stroke="#65d0ff" stroke-width="1.2"/>
  <rect x="300" y="504" width="268.85499999999996" height="10" rx="3" fill="#14432f" stroke="#58d68d" stroke-width="1.2"/>
  <text x="612.175" y="509" fill="#9fc4dc" font-family="sans-serif" font-size="11.5">H20 13,555   GB200 13,163</text>
  <text x="286" y="535" fill="#7e9fb8" font-family="sans-serif" font-size="12" text-anchor="end">trig@25%</text>
  <rect x="300" y="520" width="246.415" height="10" rx="3" fill="#173f59" stroke="#65d0ff" stroke-width="1.2"/>
  <rect x="300" y="532" width="209.1" height="10" rx="3" fill="#14432f" stroke="#58d68d" stroke-width="1.2"/>
  <text x="556.415" y="537" fill="#9fc4dc" font-family="sans-serif" font-size="11.5">H20 12,899   GB200 12,460</text>
  <text x="286" y="563" fill="#7e9fb8" font-family="sans-serif" font-size="12" text-anchor="end">trig@50%</text>
  <rect x="300" y="548" width="201.025" height="10" rx="3" fill="#173f59" stroke="#65d0ff" stroke-width="1.2"/>
  <rect x="300" y="560" width="157.59" height="10" rx="3" fill="#14432f" stroke="#58d68d" stroke-width="1.2"/>
  <text x="511.025" y="565" fill="#9fc4dc" font-family="sans-serif" font-size="11.5">H20 12,365   GB200 11,854</text>
  <text x="286" y="591" fill="#7e9fb8" font-family="sans-serif" font-size="12" text-anchor="end">trig@75%</text>
  <rect x="300" y="576" width="141.78" height="10" rx="3" fill="#173f59" stroke="#65d0ff" stroke-width="1.2"/>
  <rect x="300" y="588" width="100.3" height="10" rx="3" fill="#14432f" stroke="#58d68d" stroke-width="1.2"/>
  <text x="451.78" y="593" fill="#9fc4dc" font-family="sans-serif" font-size="11.5">H20 11,668   GB200 11,180</text>
  <text x="286" y="619" fill="#7e9fb8" font-family="sans-serif" font-size="12" text-anchor="end">trig@100%</text>
  <rect x="300" y="604" width="103.61500000000001" height="10" rx="3" fill="#173f59" stroke="#65d0ff" stroke-width="1.2"/>
  <rect x="300" y="616" width="49.214999999999996" height="10" rx="3" fill="#14432f" stroke="#58d68d" stroke-width="1.2"/>
  <text x="413.615" y="621" fill="#9fc4dc" font-family="sans-serif" font-size="11.5">H20 11,219   GB200 10,579</text>
  <rect x="760" y="486" width="380" height="140" rx="12" fill="#0d1f2e" stroke="#f0c040" stroke-width="1.2"/>
  <text x="780" y="512" fill="#ffd76a" font-family="sans-serif" font-size="14" font-weight="700">结论</text>
  <text x="780" y="538" fill="#cfe6f3" font-family="sans-serif" font-size="12.5">producer 从 10.6μs 被拖慢到 13.2μs</text>
  <text x="780" y="558" fill="#cfe6f3" font-family="sans-serif" font-size="12.5">（GB200 +24%，H20 +21%）</text>
  <text x="780" y="584" fill="#7ee6a8" font-family="sans-serif" font-size="12.5">gemm_ar 把 trigger 放在 k-loop 结束，</text>
  <text x="780" y="604" fill="#7ee6a8" font-family="sans-serif" font-size="12.5">精确避开了唯一会争用的那一段。</text>
</svg>
