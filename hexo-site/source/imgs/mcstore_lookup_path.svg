<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a1a">KVS 查询与加载路径：两步决策，一跳数据</text>

  <!-- Step 1 -->
  <rect x="30" y="48" width="840" height="188" rx="8" fill="#f7f9fc" stroke="#b9c6d6"/>
  <text x="46" y="70" font-size="13" font-weight="600" fill="#24486e">第 1 步 async_get_num_new_matched_tokens(req, num_computed_tokens) → int</text>

  <text x="46" y="94" font-size="11.5" fill="#444">req.block_hashes[] （vLLM 链式 block hash，每 block_size token 一个）</text>
  <g font-size="10.5" text-anchor="middle">
    <rect x="60"  y="104" width="62" height="26" fill="#d6e7d8" stroke="#6a9c72"/><text x="91"  y="121" fill="#245c2e">h0</text>
    <rect x="122" y="104" width="62" height="26" fill="#d6e7d8" stroke="#6a9c72"/><text x="153" y="121" fill="#245c2e">h1</text>
    <rect x="184" y="104" width="62" height="26" fill="#ffffff" stroke="#8fa8c4"/><text x="215" y="121" fill="#345">h2</text>
    <rect x="246" y="104" width="62" height="26" fill="#ffffff" stroke="#8fa8c4"/><text x="277" y="121" fill="#345">h3</text>
    <rect x="308" y="104" width="62" height="26" fill="#ffffff" stroke="#8fa8c4"/><text x="339" y="121" fill="#345">h4</text>
    <rect x="370" y="104" width="62" height="26" fill="#ffffff" stroke="#8fa8c4"/><text x="401" y="121" fill="#345">h5</text>
  </g>
  <text x="122" y="146" text-anchor="middle" font-size="10.5" fill="#245c2e">本地 HBM 已命中</text>
  <text x="122" y="159" text-anchor="middle" font-size="10.5" fill="#245c2e">（不产生任何查询）</text>
  <text x="308" y="146" text-anchor="middle" font-size="10.5" fill="#24486e">只查这一段 → 本地命中率高会自动降低 master 压力</text>

  <text x="470" y="104" font-size="11.5" fill="#444">每个 hash 展开成 tp_size 个 key：</text>
  <text x="470" y="122" font-size="11.5" font-family="monospace" fill="#a03024">f"{hash_hex}_{tp_rank}"</text>
  <text x="470" y="142" font-size="11.5" fill="#444">store.batch_is_exist(keys) → List[int]</text>
  <g font-size="10.5" text-anchor="middle">
    <rect x="470" y="152" width="34" height="22" fill="#d6e7d8" stroke="#6a9c72"/><text x="487" y="167">1</text>
    <rect x="504" y="152" width="34" height="22" fill="#d6e7d8" stroke="#6a9c72"/><text x="521" y="167">1</text>
    <rect x="546" y="152" width="34" height="22" fill="#d6e7d8" stroke="#6a9c72"/><text x="563" y="167">1</text>
    <rect x="580" y="152" width="34" height="22" fill="#d6e7d8" stroke="#6a9c72"/><text x="597" y="167">1</text>
    <rect x="622" y="152" width="34" height="22" fill="#d6e7d8" stroke="#6a9c72"/><text x="639" y="167">1</text>
    <rect x="656" y="152" width="34" height="22" fill="#fdecea" stroke="#c0392b"/><text x="673" y="167" fill="#a03024">0</text>
  </g>
  <text x="521" y="188" text-anchor="middle" font-size="10" fill="#245c2e">h2 全 rank 中</text>
  <text x="597" y="188" text-anchor="middle" font-size="10" fill="#245c2e">h3 全 rank 中</text>
  <text x="673" y="188" text-anchor="middle" font-size="10" fill="#a03024">h4 缺 rank1</text>
  <line x1="673" y1="194" x2="673" y2="208" stroke="#c0392b" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="700" y="212" font-size="11" font-weight="600" fill="#a03024">break：任一 rank 缺失整块作废，且立即停止</text>
  <text x="46" y="226" font-size="11.5" fill="#1f5c33">输出 new_matched_tokens = 连续命中 block 数 × block_size ｜ master 侧顺带授予 10s 读租约</text>

  <!-- Step 2 -->
  <rect x="30" y="252" width="840" height="82" rx="8" fill="#fdf7ee" stroke="#d9b473"/>
  <text x="46" y="274" font-size="13" font-weight="600" fill="#7a5716">第 2 步 async_update_state_after_alloc → async_load_kv</text>
  <text x="46" y="295" font-size="11.5" fill="#5c4310">顺序是「先定命中长度，再由 vLLM 分配目标 GPU block」，然后：</text>
  <text x="46" y="315" font-size="11.5" font-family="monospace" fill="#5c4310">block_id → prepare_value_for_block() → addrs = base_addr + block_id × block_len （GPU 地址）</text>
  <text x="46" y="330" font-size="11.5" font-family="monospace" fill="#5c4310">store.batch_get_into_multi_buffers(keys, addrs, sizes)   遇第一个返回码 &lt;0 立即 break</text>

  <!-- Data path -->
  <text x="450" y="366" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">数据路径：一跳直达 GPU HBM，没有中间落地</text>
  <rect x="70" y="384" width="215" height="62" rx="7" fill="#eaf6ee" stroke="#48945f" stroke-width="1.5"/>
  <text x="177" y="406" text-anchor="middle" font-size="12" fill="#1f5c33">远端 host DRAM</text>
  <text x="177" y="424" text-anchor="middle" font-size="10.5" fill="#2d6b42">别的实例注册的 segment</text>
  <text x="177" y="439" text-anchor="middle" font-size="10.5" fill="#2d6b42">默认 random → 6/7 概率在远端</text>

  <rect x="615" y="384" width="215" height="62" rx="7" fill="#eef4fb" stroke="#5b8fc7" stroke-width="1.5"/>
  <text x="722" y="410" text-anchor="middle" font-size="12" fill="#24486e">本机 GPU HBM 目标 block</text>
  <text x="722" y="430" text-anchor="middle" font-size="10.5" fill="#7a8fa6">register_buffer 注册过的 MR</text>

  <line x1="287" y1="415" x2="612" y2="415" stroke="#c0392b" stroke-width="2.5" marker-end="url(#a1)"/>
  <text x="450" y="405" text-anchor="middle" font-size="12" font-weight="600" fill="#a03024">一次 RDMA READ（GPUDirect）</text>
  <text x="450" y="437" text-anchor="middle" font-size="10.5" fill="#a03024">RDMA 模式下即使数据在本机也走 loopback，不退化成 memcpy</text>

  <rect x="70" y="464" width="760" height="42" rx="6" fill="#f4f4f6" stroke="#bbb"/>
  <text x="82" y="482" font-size="11" fill="#444">memcpy 只在两个条件同时满足时启用：</text>
  <text x="82" y="498" font-size="11" font-family="monospace" fill="#444">memcpy_enabled_ = engine_.isTcpOnly()  且  同一个进程（同主机不够，虚拟地址空间不同会 segfault）</text>

  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#c0392b"/></marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/></marker>
  </defs>
</svg>
