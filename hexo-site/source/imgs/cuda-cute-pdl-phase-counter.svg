<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc" data-series="cuda-cute-nvidia-learning">
  <title id="title">phase counter 协议：正确性与调度的解耦</title>
  <desc id="desc">对比 naive flag 的 ABA 失效与 phase counter 的单调递增方案，列出 release/acquire 定序、绕过陈旧 L1、单线程自旋三个要点，并给出 PDL 与数据屏障的责任划分。</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8fb8d6"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff9b9b"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ee6a8"/></marker></defs>
  <rect x="0" y="0" width="1200" height="780" rx="26" fill="#071522"/>
  <text x="600.0" y="46" fill="white" font-family="sans-serif" font-size="27" text-anchor="middle" font-weight="700">phase counter：把「能否开始」和「数据是否有效」拆成两套机制</text><text x="600.0" y="74" fill="#7e9fb8" font-family="sans-serif" font-size="14" text-anchor="middle">spin_add3 故意不用 PDL wait —— 因为 wait 配对 trigger 而非完成，作为数据屏障它给的保证是错的</text>
  <rect x="60" y="104" width="520" height="300" rx="12" fill="#0d1f2e" stroke="#ff7b7b" stroke-width="1.2"/>
  <text x="80" y="132" fill="#ff9b9b" font-family="sans-serif" font-size="14.5" font-weight="700">① naive flag —— 为什么在 decode 循环里必崩</text>
  <text x="80" y="160" fill="#ffc9c9" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12">producer:  写 payload; __threadfence(); flag = 1;</text>
  <text x="80" y="180" fill="#ffc9c9" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12">consumer:  while (flag != 1) {}  读 payload;</text>
  <text x="80" y="210" fill="#ffd76a" font-family="sans-serif" font-size="13" font-weight="700">谁来把 flag 清零？</text>
  <rect x="80" y="232" width="90" height="26" rx="5" fill="#4d1f22" stroke="#ff7b7b" stroke-width="1.2"/>
  <text x="125" y="250" fill="#ff9b9b" font-family="sans-serif" font-size="11.5" text-anchor="middle">consumer 清</text>
  <text x="180" y="250" fill="#cfe6f3" font-family="sans-serif" font-size="12">第 N 层还没清完，第 N+1 层的 producer 已置 1 → 信号丢失</text>
  <rect x="80" y="266" width="90" height="26" rx="5" fill="#4d1f22" stroke="#ff7b7b" stroke-width="1.2"/>
  <text x="125" y="284" fill="#ff9b9b" font-family="sans-serif" font-size="11.5" text-anchor="middle">不清</text>
  <text x="180" y="284" fill="#cfe6f3" font-family="sans-serif" font-size="12">第 N+1 层一进来就看到上一轮残留的 flag==1 → 读到旧数据</text>
  <text x="80" y="320" fill="#cfe6f3" font-family="sans-serif" font-size="12.5">这是经典 ABA 问题。而且清零本身要么多一个 kernel、</text>
  <text x="80" y="342" fill="#cfe6f3" font-family="sans-serif" font-size="12.5">要么多一次 memset —— 正是我们在费力消除的那种 launch。</text>
  <text x="80" y="378" fill="#ff9b9b" font-family="sans-serif" font-size="13" font-weight="700">结论：flag 方案在稳态循环里不可用。</text>
  <rect x="620" y="104" width="520" height="300" rx="12" fill="#0d1f2e" stroke="#58d68d" stroke-width="1.2"/>
  <text x="640" y="132" fill="#7ee6a8" font-family="sans-serif" font-size="14.5" font-weight="700">② phase counter —— 永不清零，只单调递增</text>
  <text x="640" y="162" fill="#7ee6a8" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5">// producer，第 s 步</text>
  <text x="640" y="180" fill="#cfe6f3" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12">  写 payload ...</text>
  <text x="640" y="198" fill="#ffd76a" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12">  __threadfence();        // release</text>
  <text x="640" y="216" fill="#cfe6f3" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12">  if (elected) atomicExch(seq, s+1);</text>
  <text x="640" y="244" fill="#7ee6a8" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5">// consumer，第 s 步</text>
  <text x="640" y="262" fill="#cfe6f3" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12">  if (elected)</text>
  <text x="640" y="280" fill="#cfe6f3" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12">    while (atomicAdd(seq,0) &lt; s+1) {}</text>
  <text x="640" y="298" fill="#ffd76a" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12">  __syncthreads();        // 广播给整个 CTA</text>
  <text x="640" y="316" fill="#ffd76a" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12">  __threadfence();        // acquire</text>
  <text x="640" y="334" fill="#cfe6f3" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12">  读 payload（须绕 L1：ld.volatile/.acquire）</text>
  <text x="640" y="368" fill="#7ee6a8" font-family="sans-serif" font-size="12.8" font-weight="700">只增不减 → 无需复位、无 ABA、幂等可重放</text>
  <text x="640" y="390" fill="#cfe6f3" font-family="sans-serif" font-size="12.3">落后的 consumer 看到 seq 更大也不会误判</text>
  <text x="60" y="436" fill="#cfe6f3" font-family="sans-serif" font-size="15" font-weight="700">三个必须做对的微架构细节</text>
  <rect x="60" y="458" width="1080" height="58" rx="10" fill="#0d1f2e" stroke="#4fd6cf" stroke-width="1.2"/>
  <text x="80" y="482" fill="#7fe8e2" font-family="sans-serif" font-size="13" font-weight="700">① producer 的 release 序</text>
  <text x="80" y="503" fill="#cfe6f3" font-family="sans-serif" font-size="12.2">payload 的所有 store 必须先于 seq 的 store 变得全局可见。跨 GPU 时需 system scope（__threadfence_system / fence.release.sys），否则 consumer 看到 seq 更新却读到半写数据。</text>
  <rect x="60" y="526" width="1080" height="58" rx="10" fill="#0d1f2e" stroke="#f0c040" stroke-width="1.2"/>
  <text x="80" y="550" fill="#ffd76a" font-family="sans-serif" font-size="13" font-weight="700">② consumer 的 acquire 序 + 绕过陈旧 L1</text>
  <text x="80" y="571" fill="#cfe6f3" font-family="sans-serif" font-size="12.2">spin 之后的 payload load 不能命中 spin 之前缓存的旧行。这正是 __ldg() bug 的病根：ld.global.nc 的语义契约是「本 kernel 生命周期内数据不变」，用它读并发写入的地址是直接违约。</text>
  <rect x="60" y="594" width="1080" height="58" rx="10" fill="#0d1f2e" stroke="#b18cff" stroke-width="1.2"/>
  <text x="80" y="618" fill="#c9b0ff" font-family="sans-serif" font-size="13" font-weight="700">③ 只让一个线程 spin，再 __syncthreads()</text>
  <text x="80" y="639" fill="#cfe6f3" font-family="sans-serif" font-size="12.2">256 个线程轮询同一地址会在 L2 sector 上排队，产生巨量无用流量并拖慢 producer 自己的访存。跨 rank 可用 multimem.ld_reduce 一条指令读所有 peer。</text>
  <rect x="60" y="674" width="1080" height="92" rx="12" fill="#102a1e" stroke="#58d68d" stroke-width="1.2"/>
  <text x="80" y="700" fill="#7ee6a8" font-family="sans-serif" font-size="14.5" font-weight="700">拆开之后：两个正交问题，两套机制</text>
  <text x="90" y="726" fill="#82dcff" font-family="sans-serif" font-size="12.8" font-weight="700">我可以开始占 SM 了吗？</text>
  <text x="330" y="726" fill="#cfe6f3" font-family="sans-serif" font-size="12.5">PDL griddepcontrol</text>
  <text x="560" y="726" fill="#7ee6a8" font-family="sans-serif" font-size="12.5">搞错 → 只是慢（白占资源 / 少重叠）</text>
  <text x="90" y="750" fill="#c9b0ff" font-family="sans-serif" font-size="12.8" font-weight="700">这块数据可以读了吗？</text>
  <text x="330" y="750" fill="#cfe6f3" font-family="sans-serif" font-size="12.5">phase counter spin</text>
  <text x="560" y="750" fill="#ff9b9b" font-family="sans-serif" font-size="12.5">搞错 → 竞态、读脏数据、精度错</text>
</svg>
