<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" data-series="cuda-cute-nvidia-learning">
  <title id="title">GEMM 的 CTA、Warp 与 MMA 分块</title>
  <desc id="desc">矩阵 C 的 CTA tile 进一步划分为 warp tile 和 MMA atom，并沿 K 维流水读取 A 和 B。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#62d1ff"/></marker></defs>
  <rect width="1200" height="720" rx="26" fill="#071522"/>
  <text x="600" y="52" text-anchor="middle" fill="white" font-family="sans-serif" font-size="30" font-weight="700">GEMM：通过分块重用数据，再用 MMA 覆盖小矩阵</text>
  <g font-family="sans-serif">
    <text x="90" y="112" fill="#7bd8ff" font-size="22" font-weight="700">A[M,K]</text>
    <rect x="90" y="135" width="310" height="230" fill="#163f59" stroke="#65d0ff" stroke-width="2"/>
    <g stroke="#4c91ad"><path d="M90 190H400M90 245H400M90 300H400"/><path d="M155 135V365M220 135V365M285 135V365M350 135V365"/></g>
    <rect x="220" y="190" width="130" height="110" fill="#55bde8" opacity=".72" stroke="#bcecff" stroke-width="3"/>
    <text x="285" y="248" text-anchor="middle" fill="#05131d" font-weight="700">A tile</text>

    <text x="480" y="112" fill="#c5b8ff" font-size="22" font-weight="700">B[K,N]</text>
    <rect x="480" y="135" width="310" height="230" fill="#302d58" stroke="#ac9cff" stroke-width="2"/>
    <g stroke="#655e9e"><path d="M480 190H790M480 245H790M480 300H790"/><path d="M545 135V365M610 135V365M675 135V365M740 135V365"/></g>
    <rect x="545" y="190" width="130" height="110" fill="#9f8cf0" opacity=".75" stroke="#e0d9ff" stroke-width="3"/>
    <text x="610" y="248" text-anchor="middle" fill="#100d24" font-weight="700">B tile</text>

    <path d="M405 246 H465" stroke="#62d1ff" stroke-width="3" marker-end="url(#a)"/>
    <text x="435" y="230" text-anchor="middle" fill="#a6ddf3">×</text>
    <path d="M795 246 H850" stroke="#62d1ff" stroke-width="3" marker-end="url(#a)"/>
    <text x="823" y="230" text-anchor="middle" fill="#a6ddf3">累加</text>

    <text x="875" y="112" fill="#79ecb5" font-size="22" font-weight="700">C[M,N]</text>
    <rect x="875" y="135" width="250" height="230" fill="#194b3c" stroke="#67e4aa" stroke-width="2"/>
    <g stroke="#47846f"><path d="M875 190H1125M875 245H1125M875 300H1125"/><path d="M937 135V365M1000 135V365M1062 135V365"/></g>
    <rect x="937" y="190" width="125" height="110" fill="#5bd99a" opacity=".75" stroke="#c6ffe2" stroke-width="3"/>
    <text x="999" y="248" text-anchor="middle" fill="#082016" font-weight="700">CTA tile</text>

    <rect x="90" y="430" width="1035" height="220" rx="19" fill="#102b3c" stroke="#456f86"/>
    <text x="120" y="470" fill="#dceef6" font-size="20" font-weight="700">CTA tile 内继续分层</text>
    <rect x="140" y="505" width="250" height="100" rx="12" fill="#244c60" stroke="#70d3ff"/>
    <text x="265" y="540" text-anchor="middle" fill="#8bddff" font-size="18" font-weight="700">CTA Tile</text>
    <text x="265" y="572" text-anchor="middle" fill="white" font-size="15">例如 128×128×K_tile</text>
    <path d="M395 555 H465" stroke="#62d1ff" stroke-width="3" marker-end="url(#a)"/>
    <rect x="470" y="505" width="250" height="100" rx="12" fill="#39345f" stroke="#af9eff"/>
    <text x="595" y="540" text-anchor="middle" fill="#cbbfff" font-size="18" font-weight="700">Warp / Warpgroup Tile</text>
    <text x="595" y="572" text-anchor="middle" fill="white" font-size="15">协作线程组负责子区域</text>
    <path d="M725 555 H795" stroke="#62d1ff" stroke-width="3" marker-end="url(#a)"/>
    <rect x="800" y="505" width="265" height="100" rx="12" fill="#54401f" stroke="#ffd066"/>
    <text x="932" y="540" text-anchor="middle" fill="#ffdc84" font-size="18" font-weight="700">MMA Atom</text>
    <text x="932" y="572" text-anchor="middle" fill="white" font-size="15">硬件支持的小矩阵操作</text>
    <text x="600" y="688" text-anchor="middle" fill="#8faeba" font-size="15">沿 K 维迭代多个 A/B tile；shared memory 与多 stage pipeline 用来复用数据并隐藏搬运延迟</text>
  </g>
</svg>
