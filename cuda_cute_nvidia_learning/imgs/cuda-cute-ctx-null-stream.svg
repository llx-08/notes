<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc" data-series="cuda-cute-nvidia-learning">
  <title id="title">NULL stream 的隐式同步效应</title>
  <desc id="desc">对比 blocking 与 non-blocking stream 在中间插入 NULL stream 操作时的并发表现，并给出两种 stream 的创建方式。</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8fb8d6"/></marker></defs>
  <rect x="0" y="0" width="1200" height="540" rx="26" fill="#071522"/>
  <text x="600.0" y="46" fill="white" font-family="sans-serif" font-size="27" text-anchor="middle" font-weight="700">NULL stream 的隐式同步：一个忘记指定 stream 的调用能拍平整批并发</text><text x="600.0" y="74" fill="#7e9fb8" font-family="sans-serif" font-size="14" text-anchor="middle">cudaStreamCreate 建出来的是 blocking stream，会和 NULL stream 互相同步</text>
  <text x="60" y="120" fill="#ff9b9b" font-family="sans-serif" font-size="14" font-weight="700">① blocking stream，中间插一个 NULL stream 操作 → 并发度 0.99（串行）</text>
  <text x="136" y="159" fill="#c9b0ff" font-family="sans-serif" font-size="12.5" text-anchor="end">stream 0</text><rect x="150" y="136" width="900" height="34" rx="6" fill="#0b1c2a" stroke="#22405a" stroke-width="1.2"/>
  <rect x="154.0" y="139" width="75.0" height="28" rx="5" fill="#2e2350" stroke="#b18cff" stroke-width="1.2"/>
  <text x="191.5" y="158" fill="#c9b0ff" font-family="sans-serif" font-size="11.5" text-anchor="middle">K0</text>
  <text x="136" y="199" fill="#c9b0ff" font-family="sans-serif" font-size="12.5" text-anchor="end">stream 1</text><rect x="150" y="176" width="900" height="34" rx="6" fill="#0b1c2a" stroke="#22405a" stroke-width="1.2"/>
  <rect x="319.0" y="179" width="75.0" height="28" rx="5" fill="#2e2350" stroke="#b18cff" stroke-width="1.2"/>
  <text x="356.5" y="198" fill="#c9b0ff" font-family="sans-serif" font-size="11.5" text-anchor="middle">K1</text>
  <text x="136" y="239" fill="#c9b0ff" font-family="sans-serif" font-size="12.5" text-anchor="end">stream 2</text><rect x="150" y="216" width="900" height="34" rx="6" fill="#0b1c2a" stroke="#22405a" stroke-width="1.2"/>
  <rect x="484.0" y="219" width="75.0" height="28" rx="5" fill="#2e2350" stroke="#b18cff" stroke-width="1.2"/>
  <text x="521.5" y="238" fill="#c9b0ff" font-family="sans-serif" font-size="11.5" text-anchor="middle">K2</text>
  <text x="136" y="279" fill="#c9b0ff" font-family="sans-serif" font-size="12.5" text-anchor="end">stream 3</text><rect x="150" y="256" width="900" height="34" rx="6" fill="#0b1c2a" stroke="#22405a" stroke-width="1.2"/>
  <rect x="649.0" y="259" width="75.0" height="28" rx="5" fill="#2e2350" stroke="#b18cff" stroke-width="1.2"/>
  <text x="686.5" y="278" fill="#c9b0ff" font-family="sans-serif" font-size="11.5" text-anchor="middle">K3</text>
  <rect x="237.0" y="139" width="26" height="28" rx="4" fill="#4d1f22" stroke="#ff7b7b" stroke-width="1.2"/>
  <text x="250.0" y="158" fill="#ff9b9b" font-family="sans-serif" font-size="10.5" text-anchor="middle">N</text>
  <rect x="402.0" y="179" width="26" height="28" rx="4" fill="#4d1f22" stroke="#ff7b7b" stroke-width="1.2"/>
  <text x="415.0" y="198" fill="#ff9b9b" font-family="sans-serif" font-size="10.5" text-anchor="middle">N</text>
  <rect x="567.0" y="219" width="26" height="28" rx="4" fill="#4d1f22" stroke="#ff7b7b" stroke-width="1.2"/>
  <text x="580.0" y="238" fill="#ff9b9b" font-family="sans-serif" font-size="10.5" text-anchor="middle">N</text>
  <text x="710" y="286" fill="#ff9b9b" font-family="sans-serif" font-size="12.5">每个 NULL stream 操作都成为一道全局屏障</text>
  <text x="60" y="330" fill="#7ee6a8" font-family="sans-serif" font-size="14" font-weight="700">② non-blocking stream，同样插 NULL stream 操作 → 并发度 3.90（不受影响）</text>
  <text x="136" y="369" fill="#7ee6a8" font-family="sans-serif" font-size="12.5" text-anchor="end">stream 0</text><rect x="150" y="346" width="900" height="34" rx="6" fill="#0b1c2a" stroke="#22405a" stroke-width="1.2"/>
  <rect x="154" y="349" width="75.0" height="28" rx="5" fill="#14432f" stroke="#58d68d" stroke-width="1.2"/>
  <text x="191.5" y="368" fill="#7ee6a8" font-family="sans-serif" font-size="11.5" text-anchor="middle">K0</text>
  <text x="136" y="409" fill="#7ee6a8" font-family="sans-serif" font-size="12.5" text-anchor="end">stream 1</text><rect x="150" y="386" width="900" height="34" rx="6" fill="#0b1c2a" stroke="#22405a" stroke-width="1.2"/>
  <rect x="154" y="389" width="75.0" height="28" rx="5" fill="#14432f" stroke="#58d68d" stroke-width="1.2"/>
  <text x="191.5" y="408" fill="#7ee6a8" font-family="sans-serif" font-size="11.5" text-anchor="middle">K1</text>
  <text x="136" y="449" fill="#7ee6a8" font-family="sans-serif" font-size="12.5" text-anchor="end">stream 2</text><rect x="150" y="426" width="900" height="34" rx="6" fill="#0b1c2a" stroke="#22405a" stroke-width="1.2"/>
  <rect x="154" y="429" width="75.0" height="28" rx="5" fill="#14432f" stroke="#58d68d" stroke-width="1.2"/>
  <text x="191.5" y="448" fill="#7ee6a8" font-family="sans-serif" font-size="11.5" text-anchor="middle">K2</text>
  <text x="136" y="489" fill="#7ee6a8" font-family="sans-serif" font-size="12.5" text-anchor="end">stream 3</text><rect x="150" y="466" width="900" height="34" rx="6" fill="#0b1c2a" stroke="#22405a" stroke-width="1.2"/>
  <rect x="154" y="469" width="75.0" height="28" rx="5" fill="#14432f" stroke="#58d68d" stroke-width="1.2"/>
  <text x="191.5" y="488" fill="#7ee6a8" font-family="sans-serif" font-size="11.5" text-anchor="middle">K3</text>
  <rect x="240" y="346" width="4" height="154" rx="0" fill="#58d68d" opacity="0.3"/>
  <text x="280" y="426" fill="#7ee6a8" font-family="sans-serif" font-size="12.5">四个 kernel 完全重叠；NULL stream 操作被忽略</text>
  <rect x="700" y="330" width="440" height="180" rx="12" fill="#0d1f2e" stroke="#33566f" stroke-width="1.2"/>
  <text x="720" y="356" fill="#8fb8d6" font-family="sans-serif" font-size="13" font-weight="700">创建方式</text>
  <text x="720" y="382" fill="#ff9b9b" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5">cudaStreamCreate(&amp;s);</text>
  <text x="720" y="400" fill="#cfe6f3" font-family="sans-serif" font-size="11.5">→ blocking（默认，会和 NULL stream 同步）</text>
  <text x="720" y="428" fill="#7ee6a8" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5">cudaStreamCreateWithFlags(</text>
  <text x="720" y="444" fill="#7ee6a8" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5">    &amp;s, cudaStreamNonBlocking);</text>
  <text x="720" y="462" fill="#cfe6f3" font-family="sans-serif" font-size="11.5">→ non-blocking（真正独立）</text>
  <text x="720" y="492" fill="#ffd76a" font-family="sans-serif" font-size="11.5">实测 PyTorch 2.11 的 torch.cuda.Stream()</text>
  <text x="720" y="506" fill="#ffd76a" font-family="sans-serif" font-size="11.5" font-weight="700">用的是 NON-BLOCKING（flags=1）</text>
</svg>
